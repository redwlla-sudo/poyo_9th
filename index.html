<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');

/* 기본 */
body{
    margin:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow:hidden;
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* 인트로 */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* 연출 */
#intro::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,0.2),rgba(0,0,0,0.7));
    backdrop-filter:blur(6px);
    opacity:0;
    transition:1s;
}
.intro-active::after{opacity:1;}

.intro-group{text-align:center;}

#introText,#enterBtn{
    opacity:0;
    transform:translateY(40px) scale(0.95);
    transition:1.2s;
    pointer-events:none;
}
.show{
    opacity:1!important;
    transform:translateY(0) scale(1)!important;
    pointer-events:auto!important;
}

#introText{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    font-size:1.6rem;
    padding:16px 50px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
}

/* 스킵 */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:white;
}

/* 메인 */
#main{
    display:none;
    min-height:100vh;
    overflow-x:hidden;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* 텍스트 */
.main-title{
    font-size:6rem;
    font-weight:900;
}
.sub-title{
    font-size:3rem;
    font-weight:900;
}

/* 치지직 */
.chzzk{
    background:#0b3d2e;
    color:#00ff9d;
}

/* 점 네비 */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
}
.dot{
    width:12px;height:12px;border-radius:50%;
    background:#fff;opacity:0.3;
}
.dot.active{opacity:1;transform:scale(1.3);}

/* 볼륨 */
.volume{
    position:fixed;
    top:20px;
    right:20px;
}
</style>
</head>

<body>

<!-- 인트로 -->
<div id="intro">
    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn">스킵</button>

    <div class="intro-group">
        <div id="introText">Poyo 9th Anniversary</div>
        <button id="enterBtn">입장하기</button>
    </div>
</div>

<!-- BGM -->
<audio id="bgm" loop>
    <source src="bgm.mp3">
</audio>

<!-- 메인 -->
<div id="main">

<div class="volume">
<input type="range" min="0" max="1" step="0.01" value="0.5"
oninput="bgm.volume=this.value">
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년이라는 시간의 발자취</div>
</section>

<section class="page chzzk">
<h1>치지직 스타일</h1>
</section>

<section class="page"><h1>PAGE 3</h1></section>
<section class="page"><h1>PAGE 4</h1></section>

<section class="page">
<h1 style="font-size:3rem;font-weight:900;">
"더 많은 기록(방송 탭)" 또는 "미니 게임(조회수 맞히기)"이 하고 싶다면<br>
상단에 있는 방송 또는 게임 탭을 클릭해주세요
</h1>
</section>

</div>

<script>
const video = document.getElementById("introVideo");
const introText = document.getElementById("introText");
const enterBtn = document.getElementById("enterBtn");
const skipBtn = document.getElementById("skipBtn");
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const bgm = document.getElementById("bgm");

let shown = false;
let entered = false;

/* 인트로 사운드 */
window.addEventListener("click",()=>{
    video.muted=false;
    video.volume=0.7;
},{once:true});

/* 103초 고정 */
function loop(){
    if(!shown && video.currentTime>=103){
        shown=true;
        intro.classList.add("intro-active");
        introText.classList.add("show");
        enterBtn.classList.add("show");
    }
    requestAnimationFrame(loop);
}
loop();

/* 입장 */
function enter(){
    if(entered) return;
    entered=true;

    intro.style.display="none";
    main.style.display="block";
    document.body.style.overflow="auto";

    requestAnimationFrame(()=>{
        bgm.volume=0.5;
        bgm.play().catch(()=>{});
    });
}

/* 버튼 */
enterBtn.onclick = enter;
skipBtn.onclick = ()=>{
    video.pause();
    enter();
};

/* 네비 */
window.addEventListener("scroll",()=>{
    let i=Math.round(window.scrollY/window.innerHeight);
    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    if(document.querySelectorAll(".dot")[i]){
        document.querySelectorAll(".dot")[i].classList.add("active");
    }
});
</script>

</body>
</html>
