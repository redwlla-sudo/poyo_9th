<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#introText,
#enterBtn{
    opacity:0;
    transform:translateY(30px);
    pointer-events:none;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
    pointer-events:auto !important;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:white;
    font-weight:700;
}

.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:1000;
}

.top-nav div{
    padding:14px 35px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
    font-size:1.1rem;
    cursor:pointer;
}

.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

.dots{
    position:fixed;
    right:25px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:14px;
    z-index:999;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
    cursor:pointer;
}

.dot.active{
    opacity:1;
    transform:scale(1.4);
}

.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.main-title{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub-title{
    font-family:'Great Vibes', cursive;
    font-size:2.8rem;
    font-weight:700;
    color:#1f1f1f;
}

.game-box{
    font-size:3rem;
    font-weight:900;
}

audio{display:none;}
</style>
</head>

<body>

<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div id="introText" class="main-title">Poyo 9th Anniversary</div>

    <button id="enterBtn" onclick="enter()">입장하기</button>
</div>

<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<div class="top-nav">
    <div onclick="goTo(0)">홈</div>
    <div onclick="goTo(1)">통계</div>
    <div onclick="goTo(2)">페이지3</div>
    <div onclick="goTo(3)">페이지4</div>
    <div onclick="goTo(4)">게임</div>
</div>

<div class="volume">
    <input type="range" min="0" max="1" step="0.01"
    oninput="document.getElementById('audio').volume=this.value">
</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<div id="main">

    <section class="page"><div class="main-title">HOME</div></section>
    <section class="page"><div class="sub-title">통계 페이지</div></section>
    <section class="page"><div>PAGE 3</div></section>
    <section class="page"><div>PAGE 4</div></section>
    <section class="page"><div class="game-box">GAME PAGE</div></section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const text = document.getElementById("introText");
    const btn = document.getElementById("enterBtn");
    const audio = document.getElementById("audio");

    let shown = false;

    video.addEventListener("timeupdate", () => {
        if (shown) return;

        if (video.currentTime >= 103) {
            shown = true;
            text.classList.add("show");
            btn.classList.add("show");
        }
    });

    window.addEventListener("click", () => {
        video.volume = 1;
        video.muted = false;
    }, {once:true});

    window.enter = function(){
        audio.volume = 0.6;
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    window.skipIntro = function(){
        video.pause();
        enter();
    };

});

function goTo(i){
    window.scrollTo({
        top: i * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

window.addEventListener("scroll", () => {
    let i = Math.round(window.scrollY / window.innerHeight);

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    if(document.querySelectorAll(".dot")[i]){
        document.querySelectorAll(".dot")[i].classList.add("active");
    }
});

</script>

</body>
</html>
