<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#introText,
#enterBtn{
    opacity:0;
    transform:translateY(30px);
    pointer-events:none;
    transition:0.4s ease;
}

.lock-show{
    opacity:1 !important;
    transform:translateY(0) !important;
    pointer-events:auto !important;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:white;
    font-weight:700;
    cursor:pointer;
}

.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:1000;
}

.top-nav div{
    padding:12px 30px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
    cursor:pointer;
}

.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:white;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.main-title{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub-title{
    font-family:'Great Vibes', cursive;
    font-size:2.8rem;
    font-weight:700;
    color:#1b1b1b;
}

.final-text{
    font-size:2.5rem;
    font-weight:900;
    line-height:1.6;
}

audio{display:none;}
</style>
</head>

<body>

<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div id="introText" class="main-title">Poyo 9th Anniversary</div>

    <button id="enterBtn" onclick="enter()">입장하기</button>
</div>

<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<div class="top-nav">
    <div onclick="goTo(0)">홈</div>
    <div onclick="goTo(1)">통계</div>
    <div onclick="goTo(2)">게임</div>
</div>

<div class="volume">
    <input type="range" min="0" max="1" step="0.01"
    oninput="document.getElementById('audio').volume=this.value">
</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <!-- 1 -->
    <section class="page">
        <div class="main-title">POYO 9TH ANNIVERSARY</div>

        <div class="sub-title">
            포동이들과 함께 해온 9년이란 시간의 여정
        </div>
    </section>

    <!-- 2 (치지직 느낌 유지) -->
    <section class="page">
        <h2>치지직 스타일 페이지</h2>
    </section>

    <!-- 3 -->
    <section class="page">
        <h2>페이지 3</h2>
    </section>

    <!-- 4 -->
    <section class="page">
        <h2>페이지 4</h2>
    </section>

    <!-- 5 -->
    <section class="page">
        <div class="final-text">
            자세한 내용과 게임은<br>
            상단의 통계 탭과 게임 탭을 클릭해주세요
        </div>
    </section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const text = document.getElementById("introText");
    const btn = document.getElementById("enterBtn");
    const audio = document.getElementById("audio");

    let shown = false;

    function lockCheck(){
        if(!shown && video.currentTime >= 103){
            shown = true;
            text.classList.add("lock-show");
            btn.classList.add("lock-show");
        }
        requestAnimationFrame(lockCheck);
    }
    lockCheck();

    window.addEventListener("click", () => {
        video.volume = 1;
        video.muted = false;
    }, {once:true});

    window.enter = function(){
        audio.volume = 0.6;
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    window.skipIntro = function(){
        video.pause();
        enter();
    };

});

function goTo(i){
    window.scrollTo({
        top: i * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

</script>

</body>
</html>
