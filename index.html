<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

/* ✅ 추가된 폰트 */
@font-face {
font-family: 'NeoDunggeunGothicPro';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/NeoDunggeunmoPro-Regular.woff2') format('woff2');
font-weight: normal;
font-display: swap;
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* MAIN */
#main{position:fixed;inset:0;display:none;}

/* UI */
#uiLayer{
position:fixed;
inset:0;
z-index:2147483647;
pointer-events:none;
display:none;
}

.top-ui,.volume,.dots{pointer-events:auto;}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 24px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:999px;
}

.top-btn{
display:flex;
align-items:center;
gap:10px;
padding:10px 18px;
font-weight:900;
font-size:1.1rem;
cursor:pointer;
}

.top-btn img{width:24px;height:24px;}

.volume{position:fixed;top:20px;right:20px;}

.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* PAGES */
#pages{height:100vh;position:relative;}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .6s ease, opacity .6s ease;
opacity:0.3;
}

.page.active{opacity:1;}

.gradient{
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv-static{
background:linear-gradient(180deg,#00110a,#000);
color:#00ff88;
position:relative;
overflow:hidden;
}

/* STEP CARD */
#stepCard{
background:#000;
border:1px solid #00ff88;
padding:50px;
min-width:500px;
max-width:700px;
text-align:center;

/* ✅ 폰트 적용 */
font-family:'NeoDunggeunGothicPro',sans-serif;
}

#yearCounter{
font-size:4rem;
margin-bottom:20px;
color:#00ff88;
}

#stepContent{
font-size:1.6rem;
line-height:1.6;
color:#00ff88;
text-align:center;
}

/* OVERLAY */
#stepOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:1000;
}

#stepOverlay.show{
opacity:1;
pointer-events:auto;
}
</style>
</head>

<body>

<!-- STEP CARD -->
<div id="stepOverlay">
<div id="stepCard">
<div id="yearCounter">0일</div>
<div id="stepContent"></div>
</div>
</div>

<script>
const steps=document.querySelectorAll(".step");
const stepOverlay=document.getElementById("stepOverlay");
const counter=document.getElementById("yearCounter");
const stepContent=document.getElementById("stepContent");

let stepState={unlocked:1};

const stepData={
1:{
type:"count",
stops:[365,730,1095,1461,1826,2191,2556,2922,3287],
messages:[
"1주년 : 어색했던 첫 방송, 우리만의 시작점.",
"2주년 : 작은 채팅 하나에도 밤새 설레던,<br>서로에게 스며들기 시작한 시간.",
"3주년 : 특별한 날이 아니어도 방송 알람 하나에,<br>습관처럼 모여드는 우리.",
"4주년 : 오늘도 어김없이 찾아온, 우리만의 당연한 저녁.",
"5주년 : 함께한 시간이 벌써 이만큼, 여전히 새로운 우리의 대화.",
"6주년 : 말하지 않아도 다 아는 편안한 사이.",
"7주년 : 함께라서 가능했던 행운 같은 순간들.",
"8주년 : 지나온 날보다 앞으로가 더 기대되는 이유.",
"9주년 : 다시 새롭게 시작될 페이지,<br>우리가 함께 채워갈 내일의 기록"
]
},
2:{
type:"text",
text:"[ The Origin : 첫 번째 로그 ] (3,287일 전, 포요님의 치지직 첫 데뷔)"
},
3:{
type:"text",
text:"[ 3단계: NEXT LOGGING ]<br>다시 새롭게 시작될 페이지,<br>우리가 함께 채워갈 내일의 기록"
}
};

function openStep(step){
if(step>stepState.unlocked) return;

stepOverlay.classList.add("show");

counter.innerText="";
stepContent.innerHTML="";

if(stepData[step].type==="count"){
runCount(stepData[step]);
}else{
stepContent.innerHTML=stepData[step].text;
}
}

function runCount(data){
let num=0;
let idx=0;

function animateTo(target){
function loop(){
num+=20;

if(num>=target){
num=target;
counter.innerText=num.toLocaleString()+"일";
stepContent.innerHTML=data.messages[idx];

idx++;
if(idx>=data.stops.length) return;

setTimeout(()=>animateTo(data.stops[idx]),2500);
return;
}

counter.innerText=num.toLocaleString()+"일";
requestAnimationFrame(loop);
}
loop();
}

animateTo(data.stops[0]);
}
</script>

</body>
</html>
