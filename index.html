<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ===== 기존 구조 유지 ===== */

/* STEP 카드 */
#stepOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:1000;
}

#stepOverlay.show{
opacity:1;
pointer-events:auto;
}

#stepCard{
background:#000;
border:1px solid #00ff88;
padding:40px;
min-width:400px;
max-width:600px;
text-align:center;
}

#yearCounter{
font-size:4rem;
margin-bottom:20px;
color:#00ff88;
}

#stepText{
font-size:1.4rem;
line-height:1.6;
color:#00ff88;
}
</style>
</head>

<body>

<!-- ===== 기존 메인 구조 유지 ===== -->
<div id="main">
<div class="page tv-static">

<div class="signal-box">
<div class="step active" data-step="1">STEP 1<div class="content">9 Years : Still On-Air (3,287일의 기록)</div></div>
<div class="step locked" data-step="2">STEP 2<div class="content">LOCKED</div></div>
<div class="step locked" data-step="3">STEP 3<div class="content">LOCKED</div></div>
</div>

</div>
</div>

<!-- STEP CARD -->
<div id="stepOverlay">
<div id="stepCard">
<div id="yearCounter">0</div>
<div id="stepText"></div>
</div>
</div>

<script>
/* ===== 기존 변수 유지 ===== */
const steps=document.querySelectorAll(".step");
const stepOverlay=document.getElementById("stepOverlay");
const counter=document.getElementById("yearCounter");
const text=document.getElementById("stepText");

/* ===== STEP1 데이터 ===== */
const stops=[365,730,1095,1461,1826,2191,2556,2922,3287];

const messages=[
"어색했던 첫 방송, 우리만의 시작점.",
"작은 채팅 하나에도 밤새 설레던, 서로에게 스며들기 시작한 시간.",
"특별한 날이 아니어도 방송 알람 하나에 습관처럼 모여드는 우리.",
"오늘도 어김없이 찾아온, 우리만의 당연한 저녁.",
"함께한 시간이 벌써 이만큼, 여전히 새로운 우리의 대화.",
"말하지 않아도 다 아는 편안한 사이.",
"함께라서 가능했던 행운 같은 순간들.",
"지나온 날보다 앞으로가 더 기대되는 이유.",
"다시 새롭게 시작될 페이지, 포동이들과 함께 채워갈 내일의 기록"
];

/* ===== 🔥 STEP1 애니메이션 (최종) ===== */
function runStep1(){

let num=0;
let index=0;

function animateTo(target){

function loop(){

num+=20;

if(num>=target){
num=target;

counter.innerText=num.toLocaleString();
text.innerText=messages[index];

index++;

if(index>=stops.length) return;

setTimeout(()=>{
animateTo(stops[index]);
},700);

return;
}

counter.innerText=num.toLocaleString();
requestAnimationFrame(loop);
}

loop();
}

animateTo(stops[0]);
}

/* ===== STEP 클릭 ===== */
steps.forEach((step,i)=>{
step.addEventListener("click",()=>{

if(step.classList.contains("locked")) return;

stepOverlay.classList.add("show");

/* STEP1 실행 */
if(step.dataset.step==="1"){
runStep1();
}

/* 활성 표시 */
steps.forEach(s=>s.classList.remove("active"));
step.classList.add("active");

/* 다음 해금 */
if(i+1<steps.length){
steps[i+1].classList.remove("locked");
steps[i+1].querySelector(".content").innerText="OPEN";
}

});
});

/* 닫기 */
stepOverlay.addEventListener("click",(e)=>{
if(e.target===stepOverlay){
stepOverlay.classList.remove("show");
}
});
</script>

</body>
</html>
