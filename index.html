<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: linear-gradient(135deg,#E0BBE4,#BFFCC6);
    color: white;
}

#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

#intro video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0; /* 절대 음수 쓰지 마 */
}

#intro::after {
    display: none;
}

.center {
    position: relative;
    z-index: 2;
    text-align: center;
}

.volume {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 3;
}

#main {
    display: none;
}

#bg-video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    opacity: 0.7;
}

nav {
    display: none;
    position: fixed;
    top: 20px;
    width: 100%;
    justify-content: center;
}

nav.active {
    display: flex;
}

h1 { font-size: 4rem; }
p { font-size: 1.4rem; }

section {
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
</style>
</head>

<body>

<div id="intro">

    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="volume">
        <input type="range" min="0" max="1" step="0.01" value="0.5"
        oninput="setVolume(this.value)">
    </div>

    <div class="center">
        <h2>Poyo 9th Anniversary</h2>
        <button onclick="enter()">입장하기</button>
    </div>

</div>

<div id="main">

    <audio id="audio" loop>
        <source src="bgm.mp3">
    </audio>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4">
    </video>

    <nav id="nav">
        <a href="#home">홈</a>
        <a href="#stats">통계</a>
    </nav>

    <section id="home">
        <div>
            <h1>포요 9주년</h1>
            <p>9년의 계절, 포동이들과 함께 써 내려간 이야기</p>
        </div>
    </section>

    <section id="stats">
        <div>
            <h2>9년의 발자취</h2>
            <p>9년 · 3,285일 · ∞</p>
        </div>
    </section>

</div>

<script>
function setVolume(v){
    document.getElementById("audio").volume = v;
}

window.addEventListener("click", function firstClick(){
    document.getElementById("audio").play().catch(()=>{});
    window.removeEventListener("click", firstClick);
});

function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
    document.getElementById("nav").classList.add("active");
}
</script>

</body>
</html>
