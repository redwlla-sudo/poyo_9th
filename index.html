<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;

    /* 🚨 메인 깜빡임 방지 핵심 */
    visibility:hidden;
}

/* =========================
   🎬 인트로
========================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* ❗ 기본 숨김 (103초 전 절대 표시 금지) */
#introText,
#enterBtn{
    opacity:0;
    transform:translateY(30px);
    pointer-events:none;
    transition:0.4s ease;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
    pointer-events:auto !important;
}

/* =========================
   🧭 상단 UI
========================= */
.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:1000;
}

.top-nav div{
    padding:12px 28px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
    cursor:pointer;
}

/* =========================
   🔊 볼륨
========================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

/* =========================
   🟣 점 네비 (5개 고정)
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 페이지
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* =========================
   🎵 숨김
========================= */
audio{display:none;}
</style>
</head>

<body>

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <div id="introText">Poyo 9th Anniversary</div>

    <button id="enterBtn" onclick="enter()">입장하기</button>

</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- 🧭 UI -->
<div class="top-nav">
    <div onclick="goTo(0)">홈</div>
    <div onclick="goTo(1)">통계</div>
    <div onclick="goTo(2)">게임</div>
</div>

<!-- 🔊 볼륨 -->
<div class="volume">
    <input type="range" min="0" max="1" step="0.01"
    oninput="document.getElementById('audio').volume=this.value">
</div>

<!-- 🟣 점 네비 (5개 고정) -->
<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <section class="page"><h1>HOME</h1></section>
    <section class="page"><h1>STAT</h1></section>
    <section class="page"><h1>PAGE3</h1></section>
    <section class="page"><h1>PAGE4</h1></section>
    <section class="page"><h1>GAME</h1></section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const audio = document.getElementById("audio");
    const text = document.getElementById("introText");
    const btn = document.getElementById("enterBtn");

    let shown = false;

    /* 🚨 메인 깜빡임 방지 해제 (인트로 끝나야 보임) */
    document.body.style.visibility = "visible";

    /* 🔊 안정화 (절대 고정 구조) */
    function unlock(){
        video.muted = false;
        video.volume = 1;
        audio.volume = 0.5;
    }

    window.addEventListener("click", unlock, {once:true});

    /* 🔥 103초 이전 절대 표시 금지 */
    function loop(){
        if(!shown && video.currentTime >= 103){
            shown = true;
            text.classList.add("show");
            btn.classList.add("show");
        }
        requestAnimationFrame(loop);
    }
    loop();

    /* ▶ 입장 */
    window.enter = function(){
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

});

/* 🧭 이동 */
function goTo(i){
    window.scrollTo({
        top: i * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

</script>

</body>
</html>
