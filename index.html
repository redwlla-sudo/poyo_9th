<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
:root { 
    --mint: #BFFCC6; 
    --lavender: #E0BBE4; 
    --main-bg: linear-gradient(135deg, #E0BBE4, #BFFCC6);
}

body, html { 
    margin: 0; padding: 0; 
    font-family: 'Pretendard', sans-serif; 
    color: white; 
    background: var(--main-bg);
    overflow-x: hidden;
    text-align: center;
}

/* ⭐ 인트로 */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* ⭐ 인트로 영상 */
#intro video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* 중앙 내용 */
.intro-content {
    position: relative;
    z-index: 2;
}

/* 볼륨 */
.volume {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 3;
}

/* ⭐ 본문 숨김 */
#main {
    display: none;
}

/* ⭐ 배경 영상 */
#bg-video { 
    position: fixed;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -1;
    opacity: 0.7;
}

/* 메뉴 */
nav {
    position: fixed;
    top: 20px;
    width: 100%;
    display: none;
    justify-content: center;
    z-index: 100;
}

nav.active {
    display: flex;
}

.nav-menu {
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.3);
    padding: 10px 25px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
}

.nav-menu a {
    color: #555;
    text-decoration: none;
    font-weight: bold;
}

/* 섹션 */
section {
    min-height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ⭐ 홈 */
.home-title h1 {
    font-size: 4rem;
}

.home-title p {
    font-size: 1.4rem;
}

/* ⭐ 통계 카드 */
.stats-box {
    background: rgba(255,255,255,0.2);
    padding: 40px;
    border-radius: 30px;
    max-width: 800px;
}

.stats-grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.stat-card {
    background: rgba(255,255,255,0.2);
    padding: 25px;
    border-radius: 20px;
    flex: 1;
    min-width: 150px;
}

.stat-card h3 {
    font-size: 2rem;
}

/* ⭐ 게임 */
#game h2 {
    font-size: 2rem;
}
</style>
</head>

<body>

<!-- ⭐ 인트로 -->
<div id="intro">

    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="volume">
        <input type="range" min="0" max="1" step="0.01" value="0.5"
        oninput="setVolume(this.value)">
    </div>

    <div class="intro-content">
        <h2>Poyo 9th Anniversary</h2>
        <button onclick="enter()" style="padding:15px 40px;border:none;border-radius:50px;">입장하기</button>
    </div>

</div>

<!-- ⭐ 본문 -->
<div id="main">

    <audio id="audio" loop>
        <source src="bgm.mp3">
    </audio>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4">
    </video>

    <nav id="nav">
        <div class="nav-menu">
            <a href="#home">홈</a>
            <a href="#stats">통계</a>
            <a href="#game">게임</a>
        </div>
    </nav>

    <!-- 홈 -->
    <section id="home">
        <div class="home-title">
            <h1>포요 9주년</h1>
            <p>9년의 계절, 포동이들과 함께 써 내려간 이야기</p>
        </div>
    </section>

    <!-- 통계 -->
    <section id="stats">
        <div class="stats-box">
            <h2>9년의 발자취</h2>
            <div class="stats-grid">
                <div class="stat-card"><p>함께한 시간</p><h3>9년</h3></div>
                <div class="stat-card"><p>함께한 날들</p><h3>3,285일</h3></div>
                <div class="stat-card"><p>우리의 마음</p><h3>∞</h3></div>
            </div>
        </div>
    </section>

    <!-- 게임 -->
    <section id="game">
        <h2>🎮 게임 영역 (추가 예정)</h2>
    </section>

</div>

<script>
function setVolume(v){
    document.getElementById("audio").volume = v;
}

function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
    document.getElementById("nav").classList.add("active");

    document.getElementById("audio").play().catch(()=>{});
}
</script>

</body>
</html>
