<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* 기존 스타일 유지 그대로 */

/* 🔥 STEP SYSTEM 추가 (충돌 없음) */
.signal-box{
margin-top:40px;
text-align:center;
width:80%;
max-width:600px;
}

.step{
margin:15px 0;
padding:20px;
border:1px solid rgba(0,255,136,0.4);
border-radius:12px;
cursor:pointer;
opacity:0.3;
transition:0.3s;
}

.step.active{
opacity:1;
}

.step.locked{
opacity:0.1;
pointer-events:none;
}

.step .content{
margin-top:10px;
font-size:1.1rem;
}

/* 이하 기존 CSS 전부 그대로 */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}
#introText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
#title{font-size:5rem;font-weight:900;opacity:0;visibility:hidden;background:linear-gradient(45deg,#cdb4ff,#b8f2e6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;transition:1s;}
#enterBtn{margin-top:20px;padding:18px 60px;border-radius:40px;font-size:1.6rem;font-weight:800;opacity:0;visibility:hidden;background:linear-gradient(45deg,#cdb4ff,#b8f2e6);transition:1s;}
#skipBtn{position:fixed;top:20px;right:20px;z-index:100000;}
#main{position:fixed;inset:0;display:none;}
#uiLayer{position:fixed;inset:0;z-index:2147483647;pointer-events:none;display:none;}
.top-ui,.volume,.dots{pointer-events:auto;}
.top-ui{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:24px;padding:18px 30px;background:rgba(255,255,255,0.18);backdrop-filter:blur(14px);border-radius:999px;}
.top-btn{display:flex;align-items:center;gap:12px;padding:14px 26px;font-weight:900;font-size:1.25rem;cursor:pointer;}
.top-btn img{width:28px;height:28px;}
.volume{position:fixed;top:20px;right:20px;}
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);}
.dot{width:10px;height:10px;margin:10px 0;border-radius:50%;background:#000;opacity:.3;}
.dot.active{background:#b8f2e6;opacity:1;}
#pages{height:100vh;position:relative;}
.page{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;transition:transform .6s ease, opacity .6s ease;opacity:0.3;}
.page.active{opacity:1;}
.gradient{background:linear-gradient(135deg,#d9cfff,#b8f2e6);}
.tv-static{background:linear-gradient(180deg,#00110a,#000);color:#00ff88;}
.main-title{font-size:5rem;font-weight:900;}
.sub-title{font-size:2.2rem;font-family:'Jalnan';}
.page5-text{font-size:3.5rem;font-weight:900;text-align:center;line-height:1.5;}
.overlay{position:fixed;inset:0;z-index:9999999;display:none;justify-content:flex-start;align-items:center;flex-direction:column;opacity:0;transition:0.4s ease;overflow-y:auto;padding-top:120px;box-sizing:border-box;background:linear-gradient(135deg,#d9cfff,#b8f2e6);}
.overlay.show{display:flex;opacity:1;}
.overlay-content{width:100%;text-align:center;padding:40px;}
.hide-dots .dots{display:none;}
</style>
</head>

<body>

<!-- UI 그대로 유지 -->
<div id="uiLayer">
<div class="top-ui">
<div class="top-btn" data-page="home"><img src="poyo.png">포요</div>
<div class="top-btn" data-overlay="memory">⭐ 추억</div>
<div class="top-btn" data-overlay="game">🎮 게임</div>
</div>
<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>
<div class="dots" id="dots"></div>
</div>

<!-- INTRO 그대로 -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>
<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>
<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">
<div id="pages">

<div class="page active">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<!-- 🔥 여기만 추가됨 -->
<div class="page tv-static">
<h1>CHZZK SIGNAL</h1>

<div class="signal-box">

<div id="step1" class="step active">
STEP 1
<div class="content">???</div>
</div>

<div id="step2" class="step locked">
STEP 2
<div class="content">LOCKED</div>
</div>

<div id="step3" class="step locked">
STEP 3
<div class="content">LOCKED</div>
</div>

</div>
</div>

<div class="page gradient"></div>
<div class="page gradient"></div>

<div class="page gradient">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>

</div>
</div>

<!-- overlay 그대로 유지 -->
<div id="memory" class="overlay"><div class="overlay-content"><h1>⭐ 추억 페이지</h1><div style="height:2000px;"></div></div></div>
<div id="game" class="overlay"><div class="overlay-content"><h1>🎮 게임 페이지</h1><div style="height:2000px;"></div></div></div>

<script>

/* 기존 코드 그대로 유지 */

let step=1;
const step1=document.getElementById("step1");
const step2=document.getElementById("step2");
const step3=document.getElementById("step3");

step1.onclick=()=>{
if(step!==1) return;
step2.classList.remove("locked");
step=2;
};

step2.onclick=()=>{
if(step!==2) return;
step3.classList.remove("locked");
step=3;
};

step3.onclick=()=>{
if(step!==3) return;
console.log("ALL UNLOCKED");
};

</script>

</body>
</html>
