<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 103초 UI */
#introText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:18px 60px;
    font-size:1.6rem;
    font-weight:800;
    border:none;
    border-radius:40px;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    cursor:pointer;
}

/* ================= 스킵 ================= */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    z-index:99999;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
}

/* ================= 메인 ================= */
#main{
    display:none;
}

/* ================= 페이지 ================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* 1 페이지 */
.main-title{
    font-size:5rem;
    font-weight:700;
}

.sub-title{
    font-size:2.2rem;
}

/* 2 페이지 (치지직 느낌) */
.tv-static{
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,120,0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,120,0.1), transparent 45%),
        linear-gradient(135deg,#000,#001a10);
    color:#00ff88;
}

/* 3~5 페이지 */
.gradient{
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= 5페이지 수정 ================= */
.page5-text{
    font-family:'Fredoka', sans-serif;
    font-size:3rem;
    font-weight:900;
    text-align:center;
    line-height:1.6;
    padding:0 40px;
}

/* ================= UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:999;
    scale:1.2;
}

.top-btn{
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    cursor:pointer;
    font-size:1.1rem;
}

/* ================= 볼륨 버튼 (복구) ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
}

.volume input{
    width:120px;
}

/* ================= OVERLAY ================= */
.overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transform:translateX(100%);
    transition:0.8s ease;
    z-index:9998;
}

.overlay.active{
    transform:translateX(0);
}

#memoryOverlay{
    background:linear-gradient(135deg,#1a1a1a,#003322);
    color:#00ff88;
}

#challengeOverlay{
    background:linear-gradient(135deg,#2a0033,#b8f2e6);
    color:white;
}

.closeBtn{
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">

<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
    <div id="title">POYO 9TH ANNIVERSARY</div>
    <button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>

</div>

<audio id="introBgm" loop>
<source src="intro.mp3">
</audio>

<audio id="mainBgm" loop>
<source src="bgm.mp3">
</audio>

<!-- ================= 메인 ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn" onclick="home()">포요</div>
    <div class="top-btn" onclick="openMemory()">추억</div>
    <div class="top-btn" onclick="openChallenge()">도전</div>
</div>

<!-- 볼륨 -->
<div class="volume">
    <input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>

<!-- 5페이지 유지 -->
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년이란 발자취</div>
</section>

<section class="page tv-static"><h1>CHZZK SIGNAL</h1></section>
<section class="page gradient"></section>
<section class="page gradient"></section>

<section class="page gradient">
<div class="page5-text">
더 많은 추억 또는 게임을 하고 싶으면<br>
상단 중앙에 있는 원하는 탭을 눌러주세요
</div>
</section>

</div>

<!-- ================= OVERLAY ================= -->
<div id="memoryOverlay" class="overlay">
<button class="closeBtn" onclick="home()">포요</button>
<h1>추억 페이지</h1>
</div>

<div id="challengeOverlay" class="overlay">
<button class="closeBtn" onclick="home()">포요</button>
<h1>도전 페이지</h1>
</div>

<script>

const introVideo = document.getElementById("introVideo");
const introBgm = document.getElementById("introBgm");
const mainBgm = document.getElementById("mainBgm");

const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");
const skipBtn = document.getElementById("skipBtn");

/* ================= 인트로 오디오 ================= */
let started=false;

window.addEventListener("click",()=>{
    if(started) return;
    started=true;

    introVideo.muted=false;
    introVideo.play().catch(()=>{});

    introBgm.volume=0.5;
    introBgm.play().catch(()=>{});
},{once:true});

/* ================= 103초 UI ================= */
let shown=false;

function loop(){
    if(!shown && introVideo.currentTime>=103){
        shown=true;
        title.style.visibility="visible";
        enterBtn.style.visibility="visible";
        title.style.opacity="1";
        enterBtn.style.opacity="1";
    }
    requestAnimationFrame(loop);
}
loop();

/* ================= enter ================= */
function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    introBgm.pause();
    introVideo.pause();

    mainBgm.volume=0.5;
    mainBgm.play().catch(()=>{});
}

skipBtn.onclick=enter;
enterBtn.onclick=enter;

/* ================= overlay ================= */
const memory=document.getElementById("memoryOverlay");
const challenge=document.getElementById("challengeOverlay");

function openMemory(){
    memory.classList.add("active");
    challenge.classList.remove("active");
}

function openChallenge(){
    challenge.classList.add("active");
    memory.classList.remove("active");
}

function home(){
    memory.classList.remove("active");
    challenge.classList.remove("active");
}

</script>

</body>
</html>
