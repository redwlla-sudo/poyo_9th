<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<!-- ⭐ 둥근 폰트 -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Fredoka', sans-serif;
    overflow-x:hidden;
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
}

.intro-box{text-align:center;}

#title{
    font-size:5rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
}

#enterBtn{
    margin-top:25px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    opacity:0;
    cursor:pointer;
}

/* ================= 메인 ================= */
#main{
    display:none;
}

/* ⭐ 상단 타원 UI (절대 고정) */
.top-ui{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.8);
    padding:10px 25px;
    border-radius:999px;
    display:flex;
    gap:20px;
    z-index:999;
}

/* 동그라미 버튼 */
.top-btn{
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
    cursor:pointer;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* 메인 텍스트 */
.main-title{
    font-size:5rem;
    font-weight:700;
}
.sub-title{
    font-size:2.5rem;
    font-weight:600;
}

/* 치지직 */
.chzzk{
    background:#0b3d2e;
    color:#00ff9d;
}

/* 점 네비 */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}
.dot{
    width:10px;height:10px;border-radius:50%;
    background:white;margin:10px 0;opacity:0.3;
}
.dot.active{opacity:1}

/* 볼륨 */
.volume{
    position:fixed;
    top:20px;
    right:20px;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn">스킵</button>

    <div class="intro-box">
        <div id="title">Poyo 9th Anniversary</div>
        <button id="enterBtn">입장하기</button>
    </div>

</div>

<!-- BGM -->
<audio id="bgm" loop>
    <source src="bgm.mp3">
</audio>

<!-- ================= 메인 ================= -->
<div id="main">

<!-- ⭐ 상단 UI -->
<div class="top-ui">
    <div class="top-btn">홈</div>
    <div class="top-btn">방송</div>
    <div class="top-btn">게임</div>
</div>

<div class="volume">
<input type="range" min="0" max="1" step="0.01"
oninput="bgm.volume=this.value">
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">
포동이들과 함께 걸어온 9년이라는 시간의 발자취
</div>
</section>

<section class="page chzzk">
<h1>치지직 스타일</h1>
</section>

<section class="page"><h1>PAGE 3</h1></section>
<section class="page"><h1>PAGE 4</h1></section>

<section class="page">
<h1 style="font-size:2.5rem;">
"더 많은 기록(방송 탭)" 또는 "미니 게임(조회수 맞히기)"이 하고 싶다면<br>
상단에 있는 방송 또는 게임 탭을 클릭해주세요
</h1>
</section>

</div>

<script>
const video = document.getElementById("introVideo");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");
const skipBtn = document.getElementById("skipBtn");
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const bgm = document.getElementById("bgm");

let shown = false;

/* 인트로 소리 */
window.addEventListener("click",()=>{
    video.muted=false;
    video.volume=0.7;
},{once:true});

/* 103초 */
function loop(){
    if(!shown && video.currentTime >= 103){
        shown = true;
        title.style.opacity = 1;
        enterBtn.style.opacity = 1;
    }
    requestAnimationFrame(loop);
}
loop();

/* 입장 */
function enter(){
    intro.style.display="none";
    main.style.display="block";

    bgm.volume=0.5;
    bgm.play().catch(()=>{});
}

enterBtn.onclick = enter;
skipBtn.onclick = ()=>{
    video.pause();
    enter();
};

/* 네비 */
window.addEventListener("scroll",()=>{
    let i = Math.round(window.scrollY / window.innerHeight);
    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    if(document.querySelectorAll(".dot")[i]){
        document.querySelectorAll(".dot")[i].classList.add("active");
    }
});
</script>

</body>
</html>
