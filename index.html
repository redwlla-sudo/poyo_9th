<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    font-family:'Fredoka', sans-serif;
    scroll-behavior:smooth;
    overflow-x:hidden;
}

/* ================= INTRO ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    width:100%;
    height:100%;
    object-fit:cover;
}

#introText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:18px 60px;
    font-size:1.6rem;
    font-weight:800;
    border:none;
    border-radius:40px;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ✅ 스킵 버튼 복구 */
#skipBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10000;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    font-weight:700;
    cursor:pointer;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(10px);
}

/* ================= MAIN ================= */
#main{
    display:none;
}

/* ================= PAGE ================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* ================= 2번 페이지 (강화된 초록선) ================= */
.tv-static{
    background:
        linear-gradient(180deg,#020404,#000),

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.12) 0px,
            rgba(0,0,0,0.15) 2px,
            transparent 4px
        ),

        /* 🔥 초록선 강화 */
        repeating-linear-gradient(
            90deg,
            rgba(0,255,120,0.18) 0px,
            rgba(0,255,120,0.10) 2px,
            transparent 4px
        );

    color:#00ff88;
}

/* ================= 3~5 페이지 ================= */
.page:nth-of-type(3),
.page:nth-of-type(4),
.page:nth-of-type(5){
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= TITLE ================= */
.main-title{
    font-size:5rem;
    font-weight:900; /* 🔥 복구 */
}

.anniv{
    letter-spacing:8px;
}

.sub-title{
    font-size:2.2rem;
    font-weight:600;
}

/* ================= 5페이지 (🔥 최종 해결) ================= */
.page5-text{
    font-family:'Fredoka', sans-serif !important;
    font-size:3.8rem;
    font-weight:900;
    text-align:center;
    line-height:1.5;
    letter-spacing:0.5px;
}

/* 🔥 텍스트 자체 강제 */
.page5-text{
    white-space:pre-line;
}

/* ================= UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    padding:14px 22px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:999px;
    z-index:999;
}

/* ================= DOT ================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:10px;
    height:10px;
    margin:10px 0;
    border-radius:50%;
    background:black;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.4);
    background:#b8f2e6;
    box-shadow:0 0 12px #b8f2e6;
}

/* ================= VOLUME ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
}
</style>
</head>

<body>

<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
    <div id="title">POYO 9TH ANNIVERSARY</div>
    <button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<div id="main">

<div class="top-ui">
    <div>🏠 포요</div>
    <div>⭐ 추억</div>
    <div>🎮 게임</div>
</div>

<div class="volume">
<input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<section class="page">
<div class="main-title">
POYO 9TH <span class="anniv">ANNIVERSARY</span>
</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</section>

<section class="page tv-static"><h1>CHZZK SIGNAL</h1></section>

<section class="page"></section>
<section class="page"></section>

<!-- 🔥 5번 페이지 -->
<section class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨
더 많은 추억과 즐거움이 기다리고 있어요
상단에서 계속 이어가 보세요
</div>
</section>

</div>

<script>
const introVideo=document.getElementById("introVideo");
const introBgm=document.getElementById("introBgm");
const mainBgm=document.getElementById("mainBgm");
const title=document.getElementById("title");
const enterBtn=document.getElementById("enterBtn");

let started=false;
let shown=false;

window.addEventListener("click",()=>{
    if(started) return;
    started=true;

    introVideo.muted=false;
    introVideo.play().catch(()=>{});

    introBgm.volume=0.5;
    introBgm.play().catch(()=>{});
},{once:true});

function showIntroUI(){
    if(shown) return;
    shown=true;

    title.style.visibility="visible";
    enterBtn.style.visibility="visible";
    title.style.opacity="1";
    enterBtn.style.opacity="1";
}

function loop(){
    if(!shown && introVideo.currentTime >= 103){
        showIntroUI();
    }
    requestAnimationFrame(loop);
}
loop();

introVideo.addEventListener("ended", showIntroUI);

function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    introBgm.pause();
    introVideo.pause();

    mainBgm.volume=0.5;
    mainBgm.play().catch(()=>{});
}

enterBtn.onclick=enter;
skipBtn.onclick=enter;

const dots=document.querySelectorAll(".dot");

window.addEventListener("scroll",()=>{
    let h=window.innerHeight;
    let current=Math.round(window.scrollY/h);

    dots.forEach(d=>d.classList.remove("active"));
    if(dots[current]) dots[current].classList.add("active");
});
</script>

</body>
</html>
