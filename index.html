<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* MAIN */
#main{position:fixed;inset:0;display:none;}

/* UI */
#uiLayer{
position:fixed;
inset:0;
z-index:9999999;
pointer-events:none;
}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:24px;
padding:18px 30px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:999px;
pointer-events:auto;
}

.top-btn{
display:flex;
align-items:center;
gap:12px;
padding:14px 26px;
font-weight:900;
font-size:1.25rem;
cursor:pointer;
}

.volume{
position:fixed;
top:20px;
right:20px;
pointer-events:auto;
}

/* dots */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
pointer-events:auto;
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* PAGES */
#pages{
height:100vh;
position:relative;
}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .6s ease;
}

/* PAGE 2 */
.tv-static{
background:linear-gradient(180deg,#00110a,#000);
color:#00ff88;
}

/* STEP SYSTEM */
.signal-box{
text-align:center;
width:80%;
}

.step{
margin:20px auto;
padding:20px;
border:1px solid rgba(0,255,136,0.4);
border-radius:12px;
cursor:pointer;
opacity:0.3;
transition:0.3s;
}

.step.active{
opacity:1;
}

.step.locked{
opacity:0.1;
pointer-events:none;
}

.content{
margin-top:10px;
font-size:1.2rem;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<!-- MAIN -->
<div id="main">

<div id="uiLayer">
<div class="top-ui">
<div class="top-btn">포요</div>
<div class="top-btn">추억</div>
<div class="top-btn">게임</div>
</div>

<div class="volume">🔊</div>

<div class="dots" id="dots"></div>
</div>

<div id="pages">

<!-- PAGE 1 -->
<div class="page">
POYO 9TH ANNIVERSARY
</div>

<!-- PAGE 2 (STEP SYSTEM ONLY) -->
<div class="page tv-static">

<div class="signal-box">

<h1>CHZZK SIGNAL</h1>

<!-- STEP 1 -->
<div id="step1" class="step active">
STEP 1
<div class="content">???</div>
</div>

<!-- STEP 2 -->
<div id="step2" class="step locked">
STEP 2
<div class="content">LOCKED</div>
</div>

<!-- STEP 3 -->
<div id="step3" class="step locked">
STEP 3
<div class="content">LOCKED</div>
</div>

</div>

</div>

<!-- PAGE 3 -->
<div class="page"></div>
<div class="page"></div>

<!-- PAGE 5 -->
<div class="page">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요
</div>

</div>
</div>

<script>

/* STEP SYSTEM */
let step = 1;

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");

step1.onclick = () => {
if(step !== 1) return;
step2.classList.remove("locked");
step = 2;
};

step2.onclick = () => {
if(step !== 2) return;
step3.classList.remove("locked");
step = 3;
};

step3.onclick = () => {
if(step !== 3) return;
console.log("ALL UNLOCKED");
};

</script>

</body>
</html>
