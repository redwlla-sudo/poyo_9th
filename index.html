<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{margin:0;padding:0;font-family:'Fredoka',sans-serif;overflow:hidden;}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}
#introText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}

#title{
font-size:5rem;font-weight:900;opacity:0;visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;transition:1s;
}

#enterBtn{
margin-top:20px;padding:18px 60px;border-radius:40px;font-size:1.6rem;font-weight:800;
opacity:0;visibility:hidden;background:linear-gradient(45deg,#cdb4ff,#b8f2e6);transition:1s;
}

#skipBtn{position:fixed;top:20px;right:20px;z-index:100000;}

/* MAIN */
#main{position:fixed;inset:0;display:none;}

/* UI */
#uiLayer{position:fixed;inset:0;z-index:2147483647;pointer-events:none;display:none;}
.top-ui,.volume,.dots{pointer-events:auto;}

.top-ui{
position:fixed;top:20px;left:50%;transform:translateX(-50%);
display:flex;gap:18px;padding:14px 24px;
background:rgba(255,255,255,0.18);backdrop-filter:blur(14px);border-radius:999px;
}

.top-btn{display:flex;align-items:center;gap:10px;padding:10px 18px;font-weight:900;cursor:pointer;}
.volume{position:fixed;top:20px;right:20px;}

.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);}
.dot{width:10px;height:10px;margin:10px 0;border-radius:50%;background:#000;opacity:.3;}
.dot.active{background:#b8f2e6;opacity:1;}

/* PAGES */
#pages{height:100vh;position:relative;}
.page{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;opacity:0.3;transition:0.5s;}
.page.active{opacity:1;}

.gradient{background:linear-gradient(135deg,#d9cfff,#b8f2e6);}
.tv-static{background:linear-gradient(180deg,#00110a,#000);color:#00ff88;}

.logo{height:28px;}

.step{margin:15px auto;padding:20px;border:1px solid rgba(0,255,136,0.4);cursor:pointer;opacity:0.3;}
.step.active{opacity:1;border:2px solid #00ff88;transform:scale(1.05);}
.step.locked{opacity:0.15;pointer-events:none;}

/* STEP CARD */
#stepOverlay{
position:fixed;inset:0;background:rgba(0,0,0,0.5);
display:flex;justify-content:center;align-items:center;
opacity:0;pointer-events:none;transition:0.3s;z-index:1000;
}
#stepOverlay.show{opacity:1;pointer-events:auto;}

#stepCard{
background:#000;border:1px solid #00ff88;
padding:50px;min-width:500px;max-width:700px;text-align:center;
}

#yearCounter{font-size:4rem;margin-bottom:20px;color:#00ff88;}
#stepContent{font-size:1.6rem;color:#00ff88;}
</style>
</head>

<body>

<!-- UI -->
<div id="uiLayer">
<div class="top-ui">
<div class="top-btn" onclick="move(0)">포요</div>
</div>
<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>
<div class="dots" id="dots"></div>
</div>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">
<div id="pages">

<div class="page active">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
</div>

<div class="page tv-static">
<h1><img src="img.png" class="logo"> SIGNAL DETECTED</h1>

<div class="signal-box">
<div class="step active" data-step="1">
STEP 1
<div class="content">9 Years : Still On-Air (3,287일의 기록)</div>
</div>

<div class="step locked" data-step="2">
STEP 2
<div class="content">LOCKED</div>
</div>

<div class="step locked" data-step="3">
STEP 3
<div class="content">LOCKED</div>
</div>
</div>
</div>

<div class="page gradient"></div>
<div class="page gradient"></div>
<div class="page gradient"></div>

</div>
</div>

<!-- STEP -->
<div id="stepOverlay">
<div id="stepCard">
<div id="yearCounter">0</div>
<div id="stepContent"></div>
</div>
</div>

<script>
const introVideo=document.getElementById("introVideo");
const title=document.getElementById("title");
const btn=document.getElementById("enterBtn");
const skipBtn=document.getElementById("skipBtn");
const mainBgm=document.getElementById("mainBgm");
const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");
const uiLayer=document.getElementById("uiLayer");

let index=0,shown=false;

/* 인트로 */
window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.volume=mainBgm.volume;
introVideo.play();
},{once:true});

function introLoop(){
if(introVideo.currentTime>=103 && !shown){
shown=true;
title.style.opacity=1;
title.style.visibility="visible";
btn.style.opacity=1;
btn.style.visibility="visible";
}
requestAnimationFrame(introLoop);
}
introLoop();

function enter(){
introVideo.pause();
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
uiLayer.style.display="block";
mainBgm.play();
move(0);
}

skipBtn.onclick=enter;
btn.onclick=enter;

/* dots */
for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

function move(i){
index=i;
pages.forEach((p,idx)=>{
p.style.transform=`translateY(${(idx-index)*100}vh)`;
p.classList.toggle("active",idx===index);
});
document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===index));
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

/* STEP */
const steps=document.querySelectorAll(".step");
const overlay=document.getElementById("stepOverlay");
const counter=document.getElementById("yearCounter");
const content=document.getElementById("stepContent");

const stops=[365,730,1095,1461,1826,2191,2556,2922,3287];

const messages=[
"1주년 (365일) : 어색했던 첫 방송, 우리만의 시작점.",
"2주년 (730일) : 작은 채팅 하나에도 밤새 설레던 시간.",
"3주년 (1,095일) : 습관처럼 모여드는 우리.",
"4주년 (1,461일) : 당연한 저녁.",
"5주년 (1,826일) : 여전히 새로운 대화.",
"6주년 (2,191일) : 편안한 사이.",
"7주년 (2,556일) : 행운 같은 순간들.",
"8주년 (2,922일) : 더 기대되는 이유.",
"9주년 (3,287일) : 포동이들과 함께 채워갈 내일"
];

function runStep1(){
let num=0,idx=0;

function animate(target){
function loop(){
num+=3;
if(num>=target){
num=target;
counter.innerText=num.toLocaleString();
content.innerText=messages[idx];
idx++;
if(idx>=stops.length) return;
setTimeout(()=>animate(stops[idx]),1200);
return;
}
counter.innerText=num.toLocaleString();
requestAnimationFrame(loop);
}
loop();
}
animate(stops[0]);
}

steps.forEach((step,i)=>{
step.onclick=()=>{
if(step.classList.contains("locked")) return;

overlay.classList.add("show");

if(step.dataset.step==="1") runStep1();

steps.forEach(s=>s.classList.remove("active"));
step.classList.add("active");

if(i+1<steps.length){
steps[i+1].classList.remove("locked");
steps[i+1].querySelector(".content").innerText="해금 완료";
}
};
});

overlay.onclick=(e)=>{
if(e.target===overlay) overlay.classList.remove("show");
};
</script>

</body>
</html>
