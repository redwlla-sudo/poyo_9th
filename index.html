<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: 'YeogiOttaeJalnan';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
    margin:0;
    padding:0;
    font-family:'Fredoka',sans-serif;
    overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:18px 60px;
    font-size:1.6rem;
    font-weight:800;
    border:none;
    border-radius:40px;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

#skipBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10000;
    padding:10px 18px;
    border-radius:20px;
    font-weight:700;
    background:rgba(255,255,255,0.4);
}

/* ================= MAIN (FIXED ALWAYS ON) ================= */
#main{
    position:fixed;
    inset:0;
}

/* pages ONLY scroll engine */
#pages{
    height:100vh;
    overflow:hidden;
}

.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:transform 0.6s ease;
}

/* gradient pages */
.page:nth-child(3),
.page:nth-child(4),
.page:nth-child(5){
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv-static{
    background:linear-gradient(180deg,#002a18,#000);
    color:#00ff88;
}

.main-title{font-size:5rem;font-weight:900;}
.anniv{letter-spacing:8px;}
.sub-title{font-size:2.2rem;}

.page5-text{
    font-size:3.5rem;
    font-weight:900;
    text-align:center;
    line-height:1.5;
}

/* ================= TOP UI (ALWAYS FIXED) ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    padding:14px 22px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:999px;
    z-index:99999;
}

.top-btn{
    padding:10px 18px;
    border-radius:999px;
    font-weight:800;
    cursor:pointer;
}

/* ================= DOT ================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    z-index:9999;
}
.dot{
    width:10px;
    height:10px;
    margin:10px 0;
    border-radius:50%;
    background:#000;
    opacity:0.3;
}
.dot.active{
    opacity:1;
    background:#b8f2e6;
}

/* ================= VOLUME ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:99999;
}

/* ================= OVERLAY SYSTEM ================= */
.overlay{
    position:fixed;
    inset:0;
    display:none;
    z-index:5000;
}

.overlay.show{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
}

/* memory/game styles */
#memory{background:linear-gradient(135deg,#cdb4ff,#b8f2e6);}
#game{background:linear-gradient(135deg,#b8f2e6,#cdb4ff);}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN (ALWAYS ON) -->
<div id="main">

<div class="top-ui">
<div class="top-btn" onclick="openOverlay('memory')">⭐ 추억</div>
<div class="top-btn" onclick="openOverlay('game')">🎮 게임</div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>

<div id="pages">
<div class="page">
<div class="main-title">POYO 9TH <span class="anniv">ANNIVERSARY</span></div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<div class="page tv-static"><h1>CHZZK SIGNAL</h1></div>
<div class="page"></div>
<div class="page"></div>

<div class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>
</div>
</div>

<!-- OVERLAYS -->
<div id="memory" class="overlay">추억 페이지</div>
<div id="game" class="overlay">게임 페이지</div>

<script>
const introVideo=document.getElementById("introVideo");
const enterBtn=document.getElementById("enterBtn");
const title=document.getElementById("title");
const mainBgm=document.getElementById("mainBgm");
const introBgm=document.getElementById("introBgm");

let shown=false;
let started=false;

window.addEventListener("click",()=>{
if(started) return;
started=true;
introVideo.muted=false;
introVideo.play();
introBgm.play();
},{once:true});

/* 103초 */
introVideo.addEventListener("timeupdate",()=>{
if(!shown && introVideo.currentTime>=103){
shown=true;
title.style.visibility="visible";
enterBtn.style.visibility="visible";
}
});

function enter(){
document.getElementById("intro").style.display="none";
mainBgm.play();
initScroll();
}
enterBtn.onclick=enter;
skipBtn.onclick=enter;

/* ================= SCROLL ENGINE ================= */
let index=0;
const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");

function initScroll(){
pages.forEach((_,i)=>{
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
});
update();
}

function move(i){
index=i;
pages.forEach((p,idx)=>{
p.style.transform=`translateY(${(idx-index)*100}vh)`;
});
update();
}

function update(){
document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

/* wheel */
window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

/* ================= OVERLAY ENGINE ================= */
function openOverlay(id){
document.getElementById(id).classList.add("show");
}

document.querySelectorAll(".overlay").forEach(el=>{
el.addEventListener("click",()=>el.classList.remove("show"));
});
</script>

</body>
</html>
