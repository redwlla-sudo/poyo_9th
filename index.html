<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    font-family:'Fredoka', sans-serif;
    scroll-behavior:smooth;
}

/* ================= INTRO ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    width:100%;
    height:100%;
    object-fit:cover;
}

#introText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:18px 60px;
    font-size:1.6rem;
    font-weight:800;
    border:none;
    border-radius:40px;
    opacity:0;
    visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= SKIP ================= */
#skipBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10000;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    font-weight:700;
    cursor:pointer;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(10px);
}

/* ================= MAIN ================= */
#main{
    display:none;
}

/* ================= PAGE ================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* 메인 타이틀 */
.main-title{
    font-size:5rem;
    font-weight:700;
}

.anniv{
    letter-spacing:8px;
}

.sub-title{
    font-size:2.2rem;
}

/* ================= 5페이지 (완전 강제 폰트 적용) ================= */
.page5-text{
    font-family:'Fredoka', sans-serif !important;
    font-style:normal !important;
    font-weight:900;
    font-size:3.8rem;
    text-align:center;

    /* 🔥 폰트 깨짐 방지 핵심 */
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.page5-text span{
    font-family:'Fredoka', sans-serif !important;
    font-weight:900 !important;
}

/* ================= TOP UI (크기 증가) ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px; /* 증가 */
    padding:14px 22px; /* 증가 */
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:999px;
    z-index:999;
}

.top-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 22px; /* 증가 */
    border-radius:999px;
    font-weight:800;
    font-size:1.05rem; /* 증가 */
    color:black;
    cursor:pointer;
    transition:0.25s ease;
}

.top-btn:hover{
    transform:translateY(-2px) scale(1.05);
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= DOT ================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:10px;
    height:10px;
    margin:10px 0;
    border-radius:50%;
    background:black;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.4);
}

/* ================= VOLUME ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
}
</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">

<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
    <div id="title">POYO 9TH ANNIVERSARY</div>
    <button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>

</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- ================= MAIN ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn">🏠 포요</div>
    <div class="top-btn">⭐ 추억</div>
    <div class="top-btn">🎮 게임</div>
</div>

<div class="volume">
<input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<section class="page">
<div class="main-title">
POYO 9TH <span class="anniv">ANNIVERSARY</span>
</div>
<div class="sub-title">포동이들과 함께 걸어온 9년이란 발자취</div>
</section>

<section class="page tv-static"><h1>CHZZK SIGNAL</h1></section>

<section class="page gradient"></section>
<section class="page gradient"></section>

<section class="page gradient">
<div class="page5-text">
<span>
더 많은 게 보고 싶으면<br>
추억의 페이지와 게임 페이지를 확인해주세요
</span>
</div>
</section>

</div>

<script>

const introVideo=document.getElementById("introVideo");
const introBgm=document.getElementById("introBgm");
const mainBgm=document.getElementById("mainBgm");

let started=false;

window.addEventListener("click",()=>{
    if(started) return;
    started=true;

    introVideo.muted=false;
    introVideo.play().catch(()=>{});

    introBgm.volume=0.5;
    introBgm.play().catch(()=>{});
},{once:true});

const title=document.getElementById("title");
const enterBtn=document.getElementById("enterBtn");

let shown=false;

function loop(){
    if(!shown && introVideo.currentTime>=103){
        shown=true;
        title.style.visibility="visible";
        enterBtn.style.visibility="visible";
        title.style.opacity="1";
        enterBtn.style.opacity="1";
    }
    requestAnimationFrame(loop);
}
loop();

function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    introBgm.pause();
    introVideo.pause();

    mainBgm.volume=0.5;
    mainBgm.play().catch(()=>{});
}

enterBtn.onclick=enter;
skipBtn.onclick=enter;

const pages=document.querySelectorAll(".page");
const dots=document.querySelectorAll(".dot");

let current=0;

window.addEventListener("scroll",()=>{
    let h=window.innerHeight;
    current=Math.round(window.scrollY/h);

    dots.forEach(d=>d.classList.remove("active"));
    if(dots[current]) dots[current].classList.add("active");
});

</script>

</body>
</html>
