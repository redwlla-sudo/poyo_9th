<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:white;
    font-weight:700;
    cursor:pointer;
}

.intro-title{
    font-size:clamp(4rem,8vw,6rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    transform:translateY(20px);
    transition:0.4s ease;
}

.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:1000;
}

.top-nav div{
    padding:10px 25px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:700;
    cursor:pointer;
}

.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
    cursor:pointer;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.main-title{
    font-family:'Great Vibes', cursive;
    font-size:4rem;
    color:#2b2b2b;
    font-weight:900;
}

.sub-title{
    font-size:2rem;
    font-weight:800;
    margin-top:20px;
    color:#1f1f1f;
}

.game-box{
    font-size:3rem;
    font-weight:900;
}

audio{display:none;}
</style>
</head>

<body>

<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div class="intro-title" id="introText">
        Poyo 9th Anniversary
    </div>

    <button id="enterBtn" onclick="enter()">입장하기</button>
</div>

<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<div class="top-nav">
    <div onclick="goTo(0)">홈</div>
    <div onclick="goTo(1)">통계</div>
    <div onclick="goTo(2)">게임</div>
</div>

<div class="volume">
    <input type="range" min="0" max="1" step="0.01"
    oninput="document.getElementById('audio').volume=this.value">
</div>

<div class="dots">
    <div class="dot active" onclick="goTo(0)"></div>
    <div class="dot" onclick="goTo(1)"></div>
    <div class="dot" onclick="goTo(2)"></div>
</div>

<div id="main">

    <!-- HOME -->
    <section class="page">
        <div class="main-title">POYO 9TH ANNIVERSARY</div>

        <div class="sub-title">
            포동이들과 함께 해온 9년이란 시간의 여정
        </div>
    </section>

    <section class="page">
        <h2>통계 페이지</h2>
    </section>

    <section class="page">
        <div class="game-box">
            게임 준비중
        </div>
    </section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const introText = document.getElementById("introText");
    const enterBtn = document.getElementById("enterBtn");
    const audio = document.getElementById("audio");

    let shown = false;

    window.addEventListener("click", () => {
        video.volume = 1;
        video.muted = false;
    }, {once:true});

    function check(){
        if(video.currentTime >= 103 && !shown){
            shown = true;
            introText.classList.add("show");
            enterBtn.classList.add("show");
        }
        requestAnimationFrame(check);
    }
    check();

    window.enter = function(){
        audio.volume = 0.6;
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    window.skipIntro = function(){
        video.pause();
        enter();
    };

});

function goTo(i){
    window.scrollTo({
        top: i * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

</script>

</body>
</html>
