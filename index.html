<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
body, html {
    margin:0;
    padding:0;
    font-family: sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
    color:white;
    background:black; /* ⭐ 흰 화면 방지 */
}

/* ⭐ 인트로 */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

/* ⭐ 인트로 영상 */
#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.intro-content{
    text-align:center;
    z-index:2;
}

.intro-content h1{
    font-size:clamp(3rem,8vw,5rem);
}

/* 버튼 */
button{
    padding:15px 40px;
    border:none;
    border-radius:50px;
    cursor:pointer;
}

/* ⭐ 메인 */
#main{
    display:none;
}

/* ⭐ 배경 영상 */
#bg-video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
    opacity:0.6;
}

/* ⭐ 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
    padding:20px;
}

/* ⭐ 페이드 */
.fade{
    opacity:0;
    transform:translateY(40px);
    transition:1s;
}
.fade.show{
    opacity:1;
    transform:translateY(0);
}

/* ⭐ 점 네비 */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}
.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:white;
    margin:10px 0;
    opacity:0.3;
}
.dot.active{
    opacity:1;
}

/* ⭐ 통계 */
.stats-grid{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}
.card{
    background:rgba(255,255,255,0.2);
    padding:25px;
    border-radius:20px;
    min-width:150px;
}

/* ⭐ 볼륨 */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}
</style>
</head>

<body>

<!-- ⭐ 인트로 -->
<div id="intro">

    <!-- 🔥 인트로 영상 (video2) -->
    <video autoplay muted loop playsinline onerror="this.style.display='none'">
        <source src="video2.mp4" type="video/mp4">
    </video>

    <div class="intro-content">
        <h1>Poyo 9th Anniversary</h1>
        <button onclick="enter()">입장하기</button>
    </div>
</div>

<!-- ⭐ 메인 -->
<div id="main">

    <audio id="audio" loop>
        <source src="bgm.mp3">
    </audio>

    <!-- 배경 영상 -->
    <video autoplay muted loop playsinline id="bg-video" onerror="this.style.display='none'">
        <source src="video.mp4">
    </video>

    <!-- 볼륨 -->
    <div class="volume">
        <input type="range" min="0" max="1" step="0.01" value="0.5"
        oninput="setVolume(this.value)">
    </div>

    <!-- 점 -->
    <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- 1페이지 -->
    <section class="page fade">
        <h1 style="font-size:clamp(3rem,10vw,6rem)">포요 9주년</h1>
        <p>9년의 계절, 포동이들과 함께 써 내려간 이야기</p>
    </section>

    <!-- 1-2페이지 -->
    <section class="page fade">
        <p style="font-size:1.5rem">
        치지직 데뷔 3285일째<br>
        약 8만명의 포동이들이 함께했습니다
        </p>
    </section>

    <!-- 2페이지 -->
    <section class="page fade">
        <h2>9년의 발자취</h2>
        <div class="stats-grid">
            <div class="card">9년</div>
            <div class="card">3,285일</div>
            <div class="card">78,840시간</div>
        </div>
    </section>

</div>

<script>
function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    const audio = document.getElementById("audio");
    audio.volume = 0.5;
    audio.play().catch(()=>{});
}

function setVolume(v){
    const audio = document.getElementById("audio");
    if(audio) audio.volume = v;
}

/* ⭐ 페이드 안전 처리 */
window.addEventListener("scroll", ()=>{
    document.querySelectorAll(".fade").forEach(el=>{
        if(!el) return;
        const top = el.getBoundingClientRect().top;
        if(top < window.innerHeight - 100){
            el.classList.add("show");
        }
    });
});
</script>

</body>
</html>
