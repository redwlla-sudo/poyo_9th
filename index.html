<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
    background: linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* =========================
   🎬 인트로
========================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* 스킵 버튼 */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    font-weight:700;
}

.intro-box{
    text-align:center;
}

.intro-title{
    font-size:clamp(4rem,8vw,6rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    transform:translateY(20px);
    transition:0.4s ease;
}

#enterBtn{
    margin-top:25px;
    padding:18px 55px;
    font-size:1.5rem;
    font-weight:800;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    color:#000;
    opacity:0;
    transform:translateY(20px);
    transition:0.4s ease;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
}

/* =========================
   🧭 NAV (상단)
========================= */
.nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:1000;
}

.nav-item{
    padding:10px 25px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    color:black;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   🟣 점 네비 (오른쪽 중앙)
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:white;
    opacity:0.3;
    cursor:pointer;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 페이지
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* =========================
   🏠 1페이지
========================= */
.title-main{
    font-size:clamp(3rem,6vw,5rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* 9주년 문구 (필기체 + 강조) */
.sub-text{
    font-family:'Gaegu', cursive;
    font-size:2.2rem;
    margin-top:20px;
    color:#2b2b2b;
    text-shadow:0 2px 10px rgba(255,255,255,0.5);
}

/* =========================
   📊 통계
========================= */
.stats-grid{
    display:flex;
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.3);
    padding:25px;
    border-radius:20px;
    font-weight:700;
}

/* =========================
   🎮 게임
========================= */
.game-box{
    font-size:2rem;
    font-weight:800;
}

/* =========================
   🎵 BGM
========================= */
audio{
    display:none;
}
</style>
</head>

<body>

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div class="intro-box">

        <div id="title" class="intro-title">Poyo 9th Anniversary</div>

        <button id="enterBtn" onclick="enter()">입장하기</button>

    </div>
</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- 🧭 NAV -->
<div class="nav">
    <div class="nav-item" onclick="goTo(0)">홈</div>
    <div class="nav-item" onclick="goTo(1)">통계</div>
    <div class="nav-item" onclick="goTo(2)">게임</div>
</div>

<!-- 🟣 DOT NAV -->
<div class="dots">
    <div class="dot active" onclick="goTo(0)"></div>
    <div class="dot" onclick="goTo(1)"></div>
    <div class="dot" onclick="goTo(2)"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <!-- 1 -->
    <section class="page">
        <div class="title-main">POYO 9TH ANNIVERSARY</div>
        <div class="sub-text">9년의 여정, 함께해줘서 고마워</div>
    </section>

    <!-- 2 -->
    <section class="page" id="stats">
        <h2>통계</h2>
        <div class="stats-grid">
            <div class="card">9년</div>
            <div class="card">3,285일</div>
            <div class="card">78,840시간</div>
        </div>
    </section>

    <!-- 3 -->
    <section class="page">
        <div class="game-box">게임 준비중</div>
    </section>

</div>

<!-- ========================= SCRIPT ========================= -->
<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const title = document.getElementById("title");
    const btn = document.getElementById("enterBtn");
    const audio = document.getElementById("audio");

    let shown = false;

    /* 🎬 소리 안정화 */
    window.addEventListener("click", () => {
        video.muted = false;
        video.volume = 1;
    }, { once:true });

    /* 🎬 인트로 */
    window.enter = function () {
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    /* ⏭ 스킵 */
    window.skipIntro = function(){
        video.pause();
        enter();
    };

    /* ⏱ 등장 */
    video.addEventListener("timeupdate", () => {
        if (shown) return;
        if (video.currentTime >= 103) {
            shown = true;
            title.classList.add("show");
            btn.classList.add("show");
        }
    });

});

/* 🧭 이동 + 점 활성화 */
function goTo(page){
    window.scrollTo({
        top: page * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d => d.classList.remove("active"));
    document.querySelectorAll(".dot")[page].classList.add("active");
}

</script>

</body>
</html>
