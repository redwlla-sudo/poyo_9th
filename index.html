<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');

body{
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* =========================
   🚨 메인 (절대 초기 상태 숨김)
========================= */
#main{
    opacity:0;
    pointer-events:none;
    transition:0.5s ease;
}

#main.show{
    opacity:1;
    pointer-events:auto;
}

/* =========================
   🎬 인트로 (항상 최상단)
========================= */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* UI 그룹 */
.intro-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* 103초 전 숨김 */
#introText,
#enterBtn{
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:0.4s ease;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
    pointer-events:auto !important;
}

#introText{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    font-size:1.5rem;
    font-weight:900;
    padding:16px 50px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    cursor:pointer;
}

/* 스킵 */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:white;
    font-weight:700;
}

/* =========================
   🧭 UI
========================= */
.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:1000;
}

.top-nav div{
    padding:12px 28px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
}

/* =========================
   🟣 점 네비
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 페이지
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* audio */
audio{display:none;}
</style>
</head>

<body>

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div class="intro-group">
        <div id="introText">Poyo 9th Anniversary</div>
        <button id="enterBtn" onclick="enter()">입장하기</button>
    </div>

</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- 🧭 UI -->
<div class="top-nav">
    <div>홈</div>
    <div>통계</div>
    <div>게임</div>
</div>

<!-- 🟣 네비 -->
<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <section class="page"><h1>HOME</h1></section>
    <section class="page"><h1>CHZZK STYLE</h1></section>
    <section class="page"><h1>PAGE 3</h1></section>
    <section class="page"><h1>PAGE 4</h1></section>
    <section class="page"><h1>GAME</h1></section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const audio = document.getElementById("audio");

    let shown = false;

    /* 🔊 안정화 (중요) */
    function unlock(){
        video.muted = false;
        video.volume = 0.7;
        audio.volume = 0.5;
    }

    window.addEventListener("click", unlock, {once:true});

    /* 🔥 103초 UI */
    function loop(){
        if(!shown && video.currentTime >= 103){
            shown = true;
            document.getElementById("introText").classList.add("show");
            document.getElementById("enterBtn").classList.add("show");
        }
        requestAnimationFrame(loop);
    }
    loop();

    /* ▶ 시작 */
    window.enter = function(){
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").classList.add("show");
    };

    window.skipIntro = function(){
        video.pause();
        enter();
    };

});

</script>

</body>
</html>
