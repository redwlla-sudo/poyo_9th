<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* MAIN */
#main{
position:fixed;
inset:0;
display:none;
}

/* UI */
#uiLayer{
position:fixed;
inset:0;
z-index:2147483647;
pointer-events:none;
display:none;
}

.top-ui,.volume,.dots{pointer-events:auto;}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:24px;
padding:18px 30px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:999px;
}

.top-btn{
display:flex;
align-items:center;
gap:12px;
padding:14px 26px;
font-weight:900;
font-size:1.25rem;
cursor:pointer;
}

.top-btn img{width:28px;height:28px;}

.volume{position:fixed;top:20px;right:20px;}

.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* PAGES */
#pages{height:100vh;position:relative;}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .6s ease, opacity .6s ease;
opacity:0.3;
}

.page.active{opacity:1;}

.gradient{
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv-static{
background:linear-gradient(180deg,#00110a,#000);
color:#00ff88;
}

.main-title{font-size:5rem;font-weight:900;}

.sub-title{
font-size:2.2rem;
font-family:'Jalnan';
}

.page5-text{
font-size:3.5rem;
font-weight:900;
text-align:center;
line-height:1.5;
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
z-index:9999999;
display:none;
justify-content:flex-start;
align-items:center;
flex-direction:column;
opacity:0;
transition:0.4s ease;
overflow-y:auto;
padding-top:120px;
box-sizing:border-box;
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.overlay.show{
display:flex;
opacity:1;
}

.overlay-content{
width:100%;
text-align:center;
padding:40px;
}

.hide-dots .dots{display:none;}

/* 🔥 STEP SYSTEM */
.signal-box{
margin-top:40px;
text-align:center;
width:80%;
max-width:600px;
}

.step{
margin:15px auto;
padding:20px;
border:1px solid rgba(0,255,136,0.4);
border-radius:12px;
cursor:pointer;
opacity:0.3;
transition:0.3s;
}

.step.active{opacity:1;}
.step.locked{
opacity:0.15;
pointer-events:none;
}

.step .content{
margin-top:10px;
font-size:1.1rem;
}
</style>
</head>

<body>

<!-- UI -->
<div id="uiLayer">
<div class="top-ui">
<div class="top-btn" data-page="home"><img src="poyo.png">포요</div>
<div class="top-btn" data-overlay="memory">⭐ 추억</div>
<div class="top-btn" data-overlay="game">🎮 게임</div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>
</div>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">
<div id="pages">

<div class="page active">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<!-- 🔥 STEP 추가된 페이지 -->
<div class="page tv-static">
<h1>CHZZK SIGNAL</h1>

<div id="stepSystem" class="signal-box">

<div id="step1" class="step active">
STEP 1
<div class="content">???</div>
</div>

<div id="step2" class="step locked">
STEP 2
<div class="content">LOCKED</div>
</div>

<div id="step3" class="step locked">
STEP 3
<div class="content">LOCKED</div>
</div>

</div>
</div>

<div class="page gradient"></div>
<div class="page gradient"></div>

<div class="page gradient">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>

</div>
</div>

<!-- OVERLAY -->
<div id="memory" class="overlay">
<div class="overlay-content">
<h1>⭐ 추억 페이지</h1>
<div style="height:2000px;"></div>
</div>
</div>

<div id="game" class="overlay">
<div class="overlay-content">
<h1>🎮 게임 페이지</h1>
<div style="height:2000px;"></div>
</div>
</div>

<script>
const introVideo=document.getElementById("introVideo");
const title=document.getElementById("title");
const btn=document.getElementById("enterBtn");
const mainBgm=document.getElementById("mainBgm");
const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");
const uiLayer=document.getElementById("uiLayer");

let index=0;
let shown=false;

window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.play().catch(()=>{});
},{once:true});

function introLoop(){
if(introVideo.currentTime>=103 && !shown){
shown=true;
title.style.opacity=1;
title.style.visibility="visible";
btn.style.opacity=1;
btn.style.visibility="visible";
}
requestAnimationFrame(introLoop);
}
introLoop();

function enter(){
introVideo.pause();
introVideo.currentTime=0;
introVideo.muted=true;

document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";

uiLayer.style.display="block";

mainBgm.play().catch(()=>{});
}

skipBtn.onclick=enter;
btn.onclick=enter;

for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

function move(i){
index=i;

pages.forEach((p,idx)=>{
p.style.position="absolute";
p.style.top="0";
p.style.left="0";
p.style.width="100%";
p.style.transform=`translateY(${(idx-index)*100}vh)`;
p.classList.toggle("active",idx===index);
});

document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

function showOverlay(id){
document.body.classList.add("hide-dots");
document.getElementById(id).classList.add("show");
}

function hideOverlays(){
document.body.classList.remove("hide-dots");
document.querySelectorAll(".overlay").forEach(o=>{
o.classList.remove("show");
});
}

document.querySelectorAll(".top-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
const overlay=btn.dataset.overlay;
const page=btn.dataset.page;

if(page==="home"){
hideOverlays();
move(0);
}
if(overlay){
showOverlay(overlay);
}
});
});

/* 🔥 STEP MODULE */
const StepSystem = (()=>{
let currentStep=1;

function init(){
const root=document.getElementById("stepSystem");
if(!root) return;

const step1=root.querySelector("#step1");
const step2=root.querySelector("#step2");
const step3=root.querySelector("#step3");

if(!step1||!step2||!step3) return;

step1.onclick=()=>{
if(currentStep!==1) return;
unlock(step2);
currentStep=2;
};

step2.onclick=()=>{
if(currentStep!==2) return;
unlock(step3);
currentStep=3;
};

step3.onclick=()=>{
if(currentStep!==3) return;
console.log("ALL UNLOCKED");
};
}

function unlock(el){
el.classList.remove("locked");
el.classList.add("active");
}

return {init};
})();

window.onload=()=>{
move(0);
StepSystem.init();
};
</script>

</body>
</html>
