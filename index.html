<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포요 9주년 기념 페이지</title>
    <style>
        :root {
            --mint: #BFFCC6;
            --lavender: #E0BBE4;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            color: white;
            scroll-behavior: smooth;
            background-color: #000;
            overflow-x: hidden;
        }

        /* [1. 인트로 입장 화면] */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--lavender), var(--mint));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease-out;
        }
        .enter-btn {
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            background: white; color: #777; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .enter-btn:hover { transform: scale(1.1); color: var(--lavender); }

        /* [2. 배경 및 레이아웃] */
        #bg-video {
            position: fixed; top: 0; left: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover;
        }
        .overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            /* 영상 로딩 전에도 색상이 보이도록 배경 설정 */
            background: linear-gradient(135deg, rgba(224, 187, 228, 0.6), rgba(191, 252, 198, 0.6));
            z-index: -1;
        }

        /* [3. 네비게이션 메뉴] */
        nav {
            position: fixed; top: 20px; width: 100%;
            display: flex; justify-content: center; z-index: 100;
        }
        .nav-menu {
            display: flex; gap: 30px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 40px; border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--mint);
        }
        .nav-menu a {
            color: white; text-decoration: none; font-weight: 600; transition: 0.3s;
        }
        .nav-menu a:hover { color: var(--mint); }

        /* [4. 섹션 공통 스타일] */
        section {
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 50px 20px; text-align: center;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            max-width: 800px; width: 90%;
        }

        /* [5. 홈 섹션] */
        .main-title h1 {
            font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 10px;
            text-shadow: 0 0 20px var(--lavender);
        }

        /* [6. 통계 섹션] */
        .stats-container { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .stat-card {
            flex: 1; min-width: 150px;
            background: rgba(224, 187, 228, 0.2);
            padding: 20px; border-radius: 20px;
            border: 1px solid var(--lavender);
        }
        .stat-card h3 { font-size: 2.5rem; color: var(--mint); margin: 10px 0; }

        /* [7. 게임 섹션] */
        .nickname-input { padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; width: 250px; text-align: center; color: #333; }
        .game-area { display: none; margin-top: 20px; }
        .game-container { display: flex; gap: 20px; justify-content: center; margin-top: 20px; align-items: center; }
        .game-item {
            cursor: pointer; transition: 0.3s; flex: 1;
            padding: 20px; border: 2px solid var(--mint); border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .game-item:hover { background: rgba(191, 252, 198, 0.2); transform: scale(1.03); }
        .ranking { margin-top: 30px; padding: 20px; background: rgba(224, 187, 228, 0.2); border-radius: 20px; border: 1px solid var(--lavender); }

        /* 음악 컨트롤 버튼 */
        #music-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.2); border: 1px solid var(--mint);
            padding: 10px 15px; border-radius: 30px; cursor: pointer; color: white;
            backdrop-filter: blur(5px); font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h2 style="color: white; margin-bottom: 20px; text-align:center;">Poyo 9th Anniversary</h2>
        <button class="enter-btn" onclick="startSite()">입장하기 (Music On 🎵)</button>
    </div>

    <audio id="myAudio" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    
    <video autoplay muted loop playsinline id="bg-video">
        <source src="2026-04 _ 월간 재첩 - Chrome 2026-04-27 01-50-13.mp4" type="video/mp4">
    </video>
    
    <div class="overlay"></div>

    <div id="music-btn" onclick="toggleMusic()">🎵 Music On</div>

    <nav>
        <div class="nav-menu">
            <a href="#home">홈</a>
            <a href="#stats">통계</a>
            <a href="#game">게임
