<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');

/* 🚨 완전 초기 깜빡임 방지 */
html, body{
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
    overflow-x:hidden;
}

/* =========================
   🚨 PRELOAD LOCK (핵심)
========================= */
#app{
    opacity:0;
    transition:0.2s ease;
}

#app.ready{
    opacity:1;
}

/* =========================
   🎬 인트로
========================= */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* UI */
.intro-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

#introText,
#enterBtn{
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:0.4s ease;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
    pointer-events:auto !important;
}

#introText{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    font-size:1.5rem;
    font-weight:900;
    padding:16px 50px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    cursor:pointer;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:white;
    font-weight:700;
}

/* =========================
   🧭 상단 UI (타원)
========================= */
.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    padding:10px 25px;
    border-radius:999px;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.top-nav div{
    padding:10px 20px;
    border-radius:999px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
}

/* =========================
   🟣 점 네비 (5개 고정)
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 페이지
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* 메인 텍스트 */
.main-title{
    font-size:5rem;
    font-weight:900;
    color:black;
}

.sub-title{
    font-size:2.4rem;
    font-weight:800;
    color:black;
    margin-top:20px;
}

/* audio */
audio{display:none;}
</style>
</head>

<body>

<!-- =========================
   🚨 APP WRAPPER (핵심 구조)
========================= -->
<div id="app">

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div class="intro-group">
        <div id="introText">Poyo 9th Anniversary</div>
        <button id="enterBtn" onclick="enter()">입장하기</button>
    </div>

</div>

<!-- 🧭 UI -->
<div class="top-nav">
    <div>홈</div>
    <div>통계</div>
    <div>게임</div>
</div>

<!-- 🟣 네비 -->
<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <section class="page">
        <div class="main-title">POYO 9TH ANNIVERSARY</div>
        <div class="sub-title">
            포동이들과 함께 걸어온 9년이라는 시간의 발자취
        </div>
    </section>

    <section class="page" style="background:#0b3d2e;color:#00ff9d;">
        <h1>치지직 스타일</h1>
    </section>

    <section class="page"><h1>PAGE 3</h1></section>
    <section class="page"><h1>PAGE 4</h1></section>

    <section class="page">
        <h1 style="font-size:2.8rem;">
            상단 통계 / 게임 탭을 눌러주세요
        </h1>
    </section>

</div>

</div>

<script>

const app = document.getElementById("app");
const intro = document.getElementById("intro");
const video = document.getElementById("introVideo");

let shown = false;

/* 🚨 완전 초기 로딩 후 표시 (깜빡임 제거 핵심) */
window.addEventListener("load", () => {
    setTimeout(() => {
        app.classList.add("ready");
    }, 50);
});

/* 🔊 안정화 */
window.addEventListener("click", () => {
    video.muted = false;
    video.volume = 0.7;
}, {once:true});

/* 🔥 103초 UI */
function loop(){
    if(!shown && video.currentTime >= 103){
        shown = true;
        document.getElementById("introText").classList.add("show");
        document.getElementById("enterBtn").classList.add("show");
    }
    requestAnimationFrame(loop);
}
loop();

/* ▶ 시작 */
window.enter = function(){
    intro.remove();
    app.classList.add("ready");
};

/* ⏭ 스킵 */
window.skipIntro = function(){
    video.pause();
    enter();
};

</script>

</body>
</html>
