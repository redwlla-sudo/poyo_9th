<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Fredoka', sans-serif;
    overflow-x:hidden;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}
#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    z-index:10;
}

#introContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
}

#enterBtn{
    margin-top:20px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    opacity:0;
    cursor:pointer;
}

/* ================= 메인 ================= */
#main{
    display:none;
}

/* 상단 UI */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 20px;
    border-radius:999px;
    display:flex;
    gap:18px;
    z-index:999;
}

.top-btn{
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    font-weight:700;
    cursor:pointer;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* 점 네비 */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}
.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:black;
    margin:10px 0;
    opacity:0.3;
}
.dot.active{opacity:1}

/* overlay */
.overlay{
    position:fixed;
    inset:0;
    background:black;
    color:white;
    display:none;
    z-index:2000;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.back{
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    color:black;
    padding:10px;
    border-radius:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">

<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
    <div id="title">Poyo 9th Anniversary</div>
    <button id="enterBtn">입장하기</button>
</div>

</div>

<!-- ================= 메인 ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn" onclick="scrollToTop()">홈</div>
    <div class="top-btn" onclick="openPage('broadcast')">방송</div>
    <div class="top-btn" onclick="openPage('game')">게임</div>
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<section class="page"><h1>1</h1></section>
<section class="page"><h1>2</h1></section>
<section class="page"><h1>3</h1></section>
<section class="page"><h1>4</h1></section>
<section class="page"><h1>5</h1></section>

</div>

<!-- 방송 -->
<div id="broadcast" class="overlay">
<div class="back" onclick="closePage()">뒤로</div>
<h1>방송 페이지</h1>
</div>

<!-- 게임 -->
<div id="game" class="overlay">
<div class="back" onclick="closePage()">뒤로</div>
<h1>게임 페이지</h1>
</div>

<script>
const video = document.getElementById("introVideo");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");
const skipBtn = document.getElementById("skipBtn");

let shown=false;

/* 클릭 시 소리 */
window.addEventListener("click",()=>{
    video.muted=false;
    video.volume=0.7;
},{once:true});

/* 103초 고정 */
function loop(){
    if(!shown && video.currentTime >= 103){
        shown=true;
        title.style.opacity=1;
        enterBtn.style.opacity=1;
    }
    requestAnimationFrame(loop);
}
loop();

/* 입장 */
function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
}

enterBtn.onclick=enter;

/* 🔥 스킵 버튼 확실히 동작 */
skipBtn.onclick=()=>{
    video.pause();
    enter();
};

/* 점 네비 */
window.addEventListener("scroll",()=>{
    let i=Math.round(window.scrollY/window.innerHeight);
    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    if(document.querySelectorAll(".dot")[i]){
        document.querySelectorAll(".dot")[i].classList.add("active");
    }
});

/* overlay */
function openPage(id){
    document.getElementById(id).style.display="flex";
}
function closePage(){
    document.querySelectorAll(".overlay").forEach(o=>o.style.display="none");
}

/* 홈 */
function scrollToTop(){
    window.scrollTo({top:0,behavior:"smooth"});
}
</script>

</body>
</html>
