<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    z-index:10;
}

#introContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0; /* 🔥 절대 103초 전 노출 금지 */
    background:linear-gradient(45deg, #cdb4ff, #b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    transition:0.5s;
}

#enterBtn{
    margin-top:20px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    opacity:0; /* 🔥 절대 103초 전 금지 */
    cursor:pointer;
    background:linear-gradient(45deg, #cdb4ff, #b8f2e6);
    transition:0.5s;
}

/* ================= 메인 ================= */
#main{
    display:none;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    scroll-snap-align:start;
}

/* 메인 고정 텍스트 */
.main-title{
    font-size:5rem;
    font-weight:700;
    letter-spacing:8px;
}

.sub-title{
    font-size:2.2rem;
    font-weight:600;
}

/* ================= 색상 규칙 ================= */
/* 1,2 페이지는 기본 */
/* 3~5 페이지만 그라데이션 */
.gradient{
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= 상단 UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 25px;
    border-radius:999px;
    display:flex;
    gap:15px;
    z-index:999;
}

.top-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    font-weight:700;
    cursor:pointer;
}

/* ================= 점 네비 ================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:black;
    margin:10px 0;
    opacity:0.3;
    transition:0.3s;
}

.dot.active{
    opacity:1;
    transform:scale(1.5);
}

/* ================= 볼륨 ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999;
}

/* ================= overlay (구조만 유지) ================= */
.overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
    color:white;
    font-size:3rem;
    z-index:9998;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
    <div id="title">Poyo 9th Anniversary</div>
    <button id="enterBtn">입장하기</button>
</div>
</div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<!-- ================= 메인 ================= -->
<div id="main">

<!-- 상단 UI -->
<div class="top-ui">
    <div class="top-btn" onclick="goPage(0)">포요</div>
    <div class="top-btn" onclick="goPage(1)">추억</div>
    <div class="top-btn" onclick="goPage(2)">도전</div>
</div>

<!-- 볼륨 -->
<div class="volume">
<input id="volumeCtrl" type="range" min="0" max="1" step="0.01">
</div>

<!-- 점 네비 (5개 유지) -->
<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<!-- 1 메인 (절대 고정) -->
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년이라는 시간</div>
</section>

<!-- 2 -->
<section class="page">
</section>

<!-- 3 -->
<section class="page gradient">
</section>

<!-- 4 -->
<section class="page gradient">
</section>

<!-- 5 -->
<section class="page gradient">
</section>

</div>

<!-- ================= overlay 구조 유지 ================= -->
<div class="overlay" id="overlayBroadcast">방송</div>
<div class="overlay" id="overlayGame">게임</div>

<script>
const introVideo = document.getElementById("introVideo");
const bgm = document.getElementById("bgm");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");

/* ================= 볼륨 동기화 ================= */
document.getElementById("volumeCtrl").oninput = (e)=>{
    bgm.volume = e.target.value;
    introVideo.volume = e.target.value;
};

/* ================= 인트로 103초 강제 ================= */
let shown = false;

function showIntroUI(){
    if(shown) return;
    shown = true;
    title.style.opacity = 1;
    enterBtn.style.opacity = 1;
}

/* 103초 체크 (강제) */
function checkTime(){
    if(introVideo.currentTime >= 103){
        showIntroUI();
    }
    requestAnimationFrame(checkTime);
}
checkTime();

/* fallback */
setTimeout(showIntroUI, 105000);

/* ================= 인트로 오디오 ================= */
window.addEventListener("click",()=>{
    introVideo.muted = false;
    introVideo.volume = 0.5;
    introVideo.play().catch(()=>{});
},{once:true});

/* ================= 입장 ================= */
function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
    bgm.play().catch(()=>{});
}

enterBtn.onclick = enter;
document.getElementById("skipBtn").onclick = ()=>{
    introVideo.pause();
    enter();
};

/* ================= 스크롤 ================= */
const pages = document.querySelectorAll(".page");
let current = 0;

window.addEventListener("wheel",(e)=>{
    if(e.deltaY > 0) current++;
    else current--;

    if(current < 0) current = 0;
    if(current > 4) current = 4;

    pages[current].scrollIntoView({behavior:"smooth"});

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[current].classList.add("active");
});

/* ================= 이동 ================= */
function goPage(i){
    current = i;
    pages[i].scrollIntoView({behavior:"smooth"});

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}
</script>

</body>
</html>
