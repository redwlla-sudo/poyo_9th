<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow:hidden; /* 🔥 슬라이드 구조 */
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    z-index:99999;
}

#introContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    opacity:0;
    cursor:pointer;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= 슬라이드 컨테이너 ================= */
#slider{
    display:flex;
    width:500vw;
    height:100vh;
    transition:transform 0.8s ease;
}

/* ================= 페이지 ================= */
.page{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* ================= 1 ================= */
.main-title{
    font-size:5rem;
    font-weight:700;
}

.sub-title{
    font-size:2.2rem;
    font-weight:600;
}

/* ================= 2 ================= */
.tv-static{
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,120,0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,120,0.1), transparent 45%),
        linear-gradient(135deg,#000,#001a10);
    color:#00ff88;
}

/* ================= 3~4 ================= */
.gradient{
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= 5 ================= */
.page5-text{
    font-family:'Fredoka', sans-serif;
    font-size:4rem;
    font-weight:900;
    text-align:center;
    line-height:1.5;
}

/* ================= UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 25px;
    border-radius:999px;
    display:flex;
    gap:15px;
    z-index:999;
}

.top-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
    <div id="title">Poyo 9th Anniversary</div>
    <button id="enterBtn">입장하기</button>
</div>
</div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<!-- ================= 슬라이더 ================= -->
<div id="slider">

<!-- 1 -->
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년이란 발자취</div>
</section>

<!-- 2 -->
<section class="page tv-static">
<h1>CHZZK SIGNAL</h1>
</section>

<!-- 3 -->
<section class="page gradient">
<h1>추억 페이지</h1>
</section>

<!-- 4 -->
<section class="page gradient">
<h1>도전 페이지</h1>
</section>

<!-- 5 -->
<section class="page gradient">
<div class="page5-text">
더 많은 추억과 또는 게임이 하고 싶다면<br>
상단에 추억과 게임을 눌러주세요
</div>
</section>

</div>

<!-- ================= JS ================= -->
<script>
const introVideo = document.getElementById("introVideo");
const bgm = document.getElementById("bgm");
const enterBtn = document.getElementById("enterBtn");
const title = document.getElementById("title");

let volume = 0.5;

/* 인트로 클릭 활성화 */
window.addEventListener("click",()=>{
    introVideo.muted = false;
    introVideo.volume = volume;
    introVideo.play().catch(()=>{});
},{once:true});

/* 103초 UI */
let shown = false;
function check(){
    if(introVideo.currentTime >= 103 && !shown){
        shown = true;
        title.style.opacity = 1;
        enterBtn.style.opacity = 1;
    }
    requestAnimationFrame(check);
}
check();

/* ================= 오디오 분리 ================= */
function enter(){

    introVideo.pause();
    introVideo.muted = true;
    introVideo.currentTime = 0;

    document.getElementById("intro").style.display="none";

    bgm.pause();
    bgm.currentTime = 0;
    bgm.volume = volume;
    bgm.play().catch(()=>{});
}

enterBtn.onclick = enter;
document.getElementById("skipBtn").onclick = enter;

/* ================= 슬라이드 시스템 ================= */
const slider = document.getElementById("slider");
let index = 0;

/* 이동 */
function move(){
    slider.style.transform = `translateX(-${index * 100}vw)`;
}

/* 버튼 이동 */
function goPage(i){
    index = i;
    move();
}

/* 휠 이동 (부드럽게 제한) */
let lock = false;

window.addEventListener("wheel",(e)=>{
    if(lock) return;
    lock = true;

    if(e.deltaY > 0) index++;
    else index--;

    if(index < 0) index = 0;
    if(index > 4) index = 4;

    move();

    setTimeout(()=> lock = false, 800);
});
</script>

</body>
</html>
