<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포요 9주년 기념 페이지</title>
    <style>
        :root {
            --mint: #BFFCC6;
            --lavender: #E0BBE4;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            color: white;
            scroll-behavior: smooth;
            background-color: #000;
            overflow-x: hidden;
        }

        /* [1. 인트로 입장 화면] */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--lavender), var(--mint));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease-out;
        }
        .enter-btn {
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            background: white; color: #777; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .enter-btn:hover { transform: scale(1.1); color: var(--lavender); }

        /* [2. 배경 및 레이아웃] */
        #bg-video {
            position: fixed; top: 0; left: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover;
        }
        .overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(224, 187, 228, 0.4), rgba(191, 252, 198, 0.4));
            z-index: -1;
        }

        /* [3. 네비게이션 메뉴] */
        nav {
            position: fixed; top: 20px; width: 100%;
            display: flex; justify-content: center; z-index: 100;
        }
        .nav-menu {
            display: flex; gap: 30px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 40px; border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--mint);
        }
        .nav-menu a {
            color: white; text-decoration: none; font-weight: 600; transition: 0.3s;
        }
        .nav-menu a:hover { color: var(--mint); }

        /* [4. 섹션 공통 스타일] */
        section {
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 50px 20px; text-align: center;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            max-width: 800px; width: 90%;
        }

        /* [5. 홈 섹션] */
        .main-title h1 {
            font-size: 5rem; margin-bottom: 10px;
            text-shadow: 0 0 20px var(--lavender);
        }

        /* [6. 통계 섹션] */
        .stats-container { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .stat-card {
            flex: 1; min-width: 150px;
            background: rgba(224, 187, 228, 0.2);
            padding: 20px; border-radius: 20px;
            border: 1px solid var(--lavender);
        }
        .stat-card h3 { font-size: 3rem; color: var(--mint); margin: 10px 0; }

        /* [7. 게임 섹션] */
        .nickname-input { padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; width: 250px; text-align: center; color: #333; }
        .game-area { display: none; margin-top: 20px; }
        .game-container { display: flex; gap: 20px; justify-content: center; margin-top: 20px; align-items: center; }
        .game-item {
            cursor: pointer; transition: 0.3s; flex: 1;
            padding: 20px; border: 2px solid var(--mint); border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .game-item:hover { background: rgba(191, 252, 198, 0.2); transform: scale(1.03); }
        .ranking { margin-top: 30px; padding: 20px; background: rgba(224, 187, 228, 0.2); border-radius: 20px; border: 1px solid var(--lavender); }

        /* 음악 컨트롤 버튼 */
        #music-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.2); border: 1px solid var(--mint);
            padding: 10px 15px; border-radius: 30px; cursor: pointer; color: white;
            backdrop-filter: blur(5px); font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h2 style="color: white; margin-bottom: 20px;">Poyo 9th Anniversary</h2>
        <button class="enter-btn" onclick="startSite()">입장하기 (Music On 🎵)</button>
    </div>

    <audio id="myAudio" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <video autoplay muted loop playsinline id="bg-video"><source src="poyo_bg.mp4" type="video/mp4"></video>
    <div class="overlay"></div>

    <div id="music-btn" onclick="toggleMusic()">🎵 Music On</div>

    <nav>
        <div class="nav-menu">
            <a href="#home">홈</a>
            <a href="#stats">통계</a>
            <a href="#game">게임</a>
        </div>
    </nav>

    <section id="home">
        <div class="main-title">
            <h1>포요 9주년</h1>
            <p style="font-size: 1.8rem; font-weight: 300;">9년의 계절, 우리가 함께 써 내려간 이야기</p>
        </div>
    </section>

    <section id="stats">
        <div class="content-box">
            <h2 style="color:var(--mint)">9년의 발자취</h2>
            <div class="stats-container">
                <div class="stat-card"><p>함께한 시간</p><h3>9년</h3></div>
                <div class="stat-card"><p>함께한 날들</p><h3>3,285일</h3></div>
                <div class="stat-card"><p>우리의 마음</p><h3>∞</h3></div>
            </div>
        </div>
    </section>

    <section id="game">
        <div class="content-box">
            <h2 style="color:var(--mint)">포동이 퀴즈: 조회수 대결!</h2>
            
            <div id="start-screen">
                <p>닉네임을 입력하고 도전을 시작하세요!</p>
                <input type="text" id="nickname" class="nickname-input" placeholder="포동이 닉네임 입력">
                <br>
                <button class="enter-btn" style="font-size: 1rem;" onclick="startGame()">게임 시작</button>
            </div>

            <div id="game-screen" class="game-area">
                <p><span id="user-display" style="color:var(--mint); font-weight:bold;"></span> 포동이님, 조회수가 더 높은 영상은?</p>
                <p>현재 점수: <span id="score-display">0</span></p>
                <div class="game-container">
                    <div class="game-item" onclick="checkAnswer(true)">
                        <div id="thumb-a" style="background:#555; height:150px; border-radius:10px; margin-bottom:10px; display:flex; align-items:center; justify-content:center;">썸네일 A</div>
                        <p id="title-a">영상 제목 A</p>
                    </div>
                    <div style="font-weight:bold; font-size:1.5rem;">VS</div>
                    <div class="game-item" onclick="checkAnswer(false)">
                        <div id="thumb-b" style="background:#555; height:150px; border-radius:10px; margin-bottom:10px; display:flex; align-items:center; justify-content:center;">썸네일 B</div>
                        <p id="title-b">영상 제목 B</p>
                    </div>
                </div>
            </div>

            <div class="ranking">
                <p>🏆 나의 최고 기록</p>
                <div id="best-record" style="color:var(--mint); font-weight:bold;">기록을 세워보세요!</div>
            </div>
        </div>
    </section>

    <script>
        const audio = document.getElementById("myAudio");
        let score = 0;
        let nick = "";

        function startSite() {
            audio.play();
            document.getElementById("intro-overlay").style.opacity = '0';
            setTimeout(() => { document.getElementById("intro-overlay").style.display = 'none'; }, 1000);
            updateBestDisplay();
        }

        function toggleMusic() {
            const btn = document.getElementById("music-btn");
            if (audio.paused) {
                audio.play();
                btn.innerText = "🎵 Music On";
            } else {
                audio.pause();
                btn.innerText = "🔇 Music Off";
            }
        }

        function startGame() {
            nick = document.getElementById('nickname').value;
            if(!nick) { alert("닉네임을 입력해주세요!"); return; }
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('user-display').innerText = nick;
            score = 0;
            document.getElementById('score-display').innerText = score;
        }

        function checkAnswer(isA) {
            // 현재는 A를 누르면 점수가 오르게 설정되어 있습니다.
            if(isA) {
                score++;
                document.getElementById('score-display').innerText = score;
                alert("정답! 조회수가 더 높네요!");
            } else {
                alert("아쉬워요! 최종 점수: " + score);
                saveRecord();
                document.getElementById('start-screen').style.display = 'block';
                document.getElementById('game-screen').style.display = 'none';
            }
        }

        function saveRecord() {
            const best = localStorage.getItem('poyo_best') || 0;
            if(score > best) {
                localStorage.setItem('poyo_best', score);
                localStorage.setItem('poyo_nick', nick);
            }
            updateBestDisplay();
        }

        function updateBestDisplay() {
            const bS = localStorage.getItem('poyo_best');
            const bN = localStorage.getItem('poyo_nick');
            if(bS) document.getElementById('best-record').innerText = bN + " 포동이 : " + bS + "문제 성공!";
        }
    </script>
</body>
</html>
