<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Fredoka', sans-serif;
    overflow:hidden;
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
}

#title{
    font-size:5rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
}

#enterBtn{
    margin-top:25px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    opacity:0;
}

/* ================= 메인 ================= */
#main{
    display:none;
    height:100vh;
    overflow:hidden;
}

/* 상단 UI */
.top-ui{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.85);
    padding:6px 14px;
    border-radius:999px;
    display:flex;
    gap:12px;
    z-index:999;
}

.top-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:0.8rem;
    font-weight:700;
    cursor:pointer;
}

/* 화면 전환 */
.screen{
    display:none;
    height:100vh;
}
.screen.active{
    display:block;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* 텍스트 */
.main-title{
    font-size:5rem;
    font-weight:700;
}
.sub-title{
    font-size:2.5rem;
    font-weight:600;
}

/* 치지직 */
.chzzk{
    background:#0b3d2e;
    color:#00ff9d;
}

/* 점 네비 */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}
.dot{
    width:10px;height:10px;border-radius:50%;
    background:white;margin:10px 0;opacity:0.3;
}
.dot.active{opacity:1}

/* 볼륨 */
.volume{
    position:fixed;
    top:20px;
    right:20px;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">
    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn">스킵</button>

    <div style="text-align:center;">
        <div id="title">Poyo 9th Anniversary</div>
        <button id="enterBtn">입장하기</button>
    </div>
</div>

<audio id="bgm" loop>
    <source src="bgm.mp3">
</audio>

<!-- ================= 메인 ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn" onclick="showPage('home')">홈</div>
    <div class="top-btn" onclick="showPage('broadcast')">방송</div>
    <div class="top-btn" onclick="showPage('game')">게임</div>
</div>

<div class="volume">
<input type="range" min="0" max="1" step="0.01"
oninput="bgm.volume=this.value">
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<!-- 홈 -->
<div id="home" class="screen active">
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">
포동이들과 함께 걸어온 9년이라는 시간의 발자취
</div>
</section>
</div>

<!-- 방송 -->
<div id="broadcast" class="screen">
<section class="page chzzk">
<h1 style="font-size:3rem;">📺 방송 페이지</h1>
<p>여기에 영상 넣으면 됨</p>
</section>
</div>

<!-- 게임 -->
<div id="game" class="screen">
<section class="page">
<h1 style="font-size:3rem;">🎮 게임 페이지</h1>
<p>미니게임 자리</p>
</section>
</div>

</div>

<script>
const video = document.getElementById("introVideo");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");
const skipBtn = document.getElementById("skipBtn");
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const bgm = document.getElementById("bgm");

let shown = false;

/* 인트로 소리 */
window.addEventListener("click",()=>{
    video.muted=false;
    video.volume=0.7;
},{once:true});

/* 103초 고정 */
function loop(){
    if(!shown && video.currentTime >= 103){
        shown = true;
        title.style.opacity = 1;
        enterBtn.style.opacity = 1;
    }
    requestAnimationFrame(loop);
}
loop();

/* 입장 */
function enter(){
    intro.style.display="none";
    main.style.display="block";

    bgm.volume=0.5;
    bgm.play().catch(()=>{});
}

enterBtn.onclick = enter;
skipBtn.onclick = ()=>{
    video.pause();
    enter();
};

/* 페이지 전환 */
function showPage(name){
    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });
    document.getElementById(name).classList.add("active");
}
</script>

</body>
</html>
