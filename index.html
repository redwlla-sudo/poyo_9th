<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

/* 🔥 스킵 항상 영상 위 */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    z-index:99999;
}

#introContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:5;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    opacity:0;
    cursor:pointer;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= 메인 ================= */
#main{
    display:none;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* 메인 고정 텍스트 */
.main-title{
    font-size:5rem;
    font-weight:700;
    letter-spacing:8px;
}

.sub-title{
    font-size:2.2rem;
    font-weight:600;
}

/* ================= 2페이지 치지직 ================= */
.chzzk{
    background:radial-gradient(circle at top,#00f0ff33,transparent),
               radial-gradient(circle at bottom,#ff00ff33,transparent),
               #050510;
    color:white;
}

/* ================= 3~5 ================= */
.gradient{
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= 5페이지 문구 ================= */
.page5-text{
    font-size:2rem;
    font-weight:600;
    text-align:center;
}

/* ================= UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 25px;
    border-radius:999px;
    display:flex;
    gap:15px;
    z-index:999;
}

.top-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    font-weight:700;
    cursor:pointer;
}

/* ================= dots ================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:black;
    margin:10px 0;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.5);
}

/* ================= 볼륨 ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
    <div id="title">Poyo 9th Anniversary</div>
    <button id="enterBtn">입장하기</button>
</div>
</div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<!-- ================= 메인 ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn" onclick="goPage(0)">포요</div>
    <div class="top-btn" onclick="goPage(1)">추억</div>
    <div class="top-btn" onclick="goPage(2)">도전</div>
</div>

<div class="volume">
<input id="volumeCtrl" type="range" min="0" max="1" step="0.01">
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<!-- 1 -->
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년</div>
</section>

<!-- 2 -->
<section class="page chzzk">
<h1>치지직 플랫폼</h1>
</section>

<!-- 3 -->
<section class="page gradient"></section>

<!-- 4 -->
<section class="page gradient"></section>

<!-- 5 -->
<section class="page gradient">
<div class="page5-text">
더 많은 추억과 또는 게임이 하고 싶다면<br>
상단에 추억과 게임을 눌러주세요
</div>
</section>

</div>

<script>
const introVideo = document.getElementById("introVideo");
const bgm = document.getElementById("bgm");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");

let globalVolume = 0.5;

/* ================= 볼륨 ================= */
document.getElementById("volumeCtrl").oninput = (e)=>{
    globalVolume = e.target.value;
    bgm.volume = globalVolume;
    introVideo.volume = globalVolume;
};

/* ================= 인트로 클릭 음성 ================= */
window.addEventListener("click",()=>{
    introVideo.muted = false;
    introVideo.volume = globalVolume;
    introVideo.play().catch(()=>{});
},{once:true});

/* ================= 103초 UI ================= */
let shown = false;

function showUI(){
    if(shown) return;
    shown = true;
    title.style.opacity = 1;
    enterBtn.style.opacity = 1;
}

function check(){
    if(introVideo.currentTime >= 103){
        showUI();
    }
    requestAnimationFrame(check);
}
check();

setTimeout(showUI,105000);

/* ================= 안전 전환 (핵심 수정) ================= */
function enter(){

    introVideo.pause();
    introVideo.removeAttribute("src");
    introVideo.load();

    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    bgm.pause();
    bgm.currentTime = 0;
    bgm.volume = globalVolume;
    bgm.play().catch(()=>{});
}

enterBtn.onclick = enter;
document.getElementById("skipBtn").onclick = ()=>{
    enter();
};

/* ================= 스크롤 ================= */
const pages = document.querySelectorAll(".page");
let current = 0;

window.addEventListener("wheel",(e)=>{
    if(e.deltaY > 0) current++;
    else current--;

    if(current < 0) current = 0;
    if(current > 4) current = 4;

    pages[current].scrollIntoView({behavior:"smooth"});

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[current].classList.add("active");
});

/* ================= 이동 ================= */
function goPage(i){
    current = i;
    pages[i].scrollIntoView({behavior:"smooth"});

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}
</script>

</body>
</html>
