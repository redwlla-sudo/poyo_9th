<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family:'Jalnan';
src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:9999;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* ================= MAIN ================= */
#main{
position:fixed;
inset:0;
display:none;
}

/* ================= UI ================= */
#uiLayer{
position:fixed;
inset:0;
z-index:2147483647;
pointer-events:none;
display:none;
}

.top-ui,.volume,.dots{pointer-events:auto;}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 24px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:999px;
}

.top-btn{
display:flex;
align-items:center;
gap:10px;
padding:10px 18px;
font-weight:900;
font-size:1.1rem;
cursor:pointer;
}

.volume{position:fixed;top:20px;right:20px;}

.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* ================= PAGES ================= */
#pages{
height:100vh;
position:relative;
}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .7s ease, opacity .7s ease;
opacity:0.3;
}

.page.active{opacity:1;}

/* ================= GRADIENT ================= */
.gradient{
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= PAGE 1 (복구) ================= */
.main-title{
font-size:5rem;
font-weight:900;
text-align:center;
}

.sub-title{
font-size:2rem;
font-family:'Jalnan';
}

/* ================= PAGE 2 (복구 핵심) ================= */
.signal-box{
margin-top:10px;
text-align:center;
width:80%;
max-width:600px;
}

.step{
margin:15px auto;
padding:20px;
border:1px solid rgba(0,255,136,0.4);
cursor:pointer;
opacity:0.3;
transition:0.3s;
}

.step.active{
opacity:1;
border:2px solid #00ff88;
transform:scale(1.05);
}

.step.locked{
opacity:0.15;
pointer-events:none;
}

/* ================= PAGE 5 (복구 고정) ================= */
.page5-text{
font-size:2rem;
text-align:center;
line-height:1.6;
font-family:'Jalnan';
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">
<div id="pages">

<!-- PAGE 1 (복구 완료) -->
<div class="page active">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<!-- PAGE 2 (복구 완료) -->
<div class="page">
<div class="signal-box">
<div class="step active" data-step="1">STEP 1<div class="content">9 Years : Still On-Air</div></div>
<div class="step locked" data-step="2">STEP 2<div class="content">LOCKED</div></div>
<div class="step locked" data-step="3">STEP 3<div class="content">LOCKED</div></div>
</div>
</div>

<!-- PAGE 3~4 -->
<div class="page gradient"></div>
<div class="page gradient"></div>

<!-- PAGE 5 (복구 완료 핵심) -->
<div class="page gradient">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>

</div>
</div>

<!-- STEP -->
<div id="stepOverlay">
<div id="stepCard">
<div id="yearCounter"></div>
<div id="stepContent"></div>
</div>
</div>

<!-- UI -->
<div id="uiLayer">
<div class="top-ui">
<div class="top-btn">포요</div>
<div class="top-btn">⭐ 추억</div>
<div class="top-btn">🎮 게임</div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>
</div>

<script>

const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");
const uiLayer=document.getElementById("uiLayer");

let index=0;

/* INTRO */
const introVideo=document.getElementById("introVideo");
const title=document.getElementById("title");
const btn=document.getElementById("enterBtn");
const skipBtn=document.getElementById("skipBtn");
const mainBgm=document.getElementById("mainBgm");

window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.play().catch(()=>{});
},{once:true});

function enter(){
introVideo.pause();
introVideo.currentTime=0;

document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
uiLayer.style.display="block";

setTimeout(()=>mainBgm.play().catch(()=>{}),300);

move(0);
}

skipBtn.onclick=enter;
btn.onclick=enter;

/* DOTS */
for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

/* SCROLL */
function move(i){
index=i;

pages.forEach((p,idx)=>{
p.style.position="absolute";
p.style.top="0";
p.style.left="0";
p.style.width="100%";
p.style.height="100vh";
p.style.transform=`translateY(${(idx-index)*100}vh)`;
});

document.querySelectorAll(".dot").forEach((d,i2)=>{
d.classList.toggle("active",i2===index);
});
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

</script>

</body>
</html>
