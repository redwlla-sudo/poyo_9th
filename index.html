<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POYO 9th</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
font-family:'Fredoka',sans-serif;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:1000;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO TEXT */
#introUI{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:4rem;
opacity:0;
font-weight:900;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:15px 45px;
opacity:0;
transition:1s;
}

/* SKIP */
#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:9999;
}

/* ================= TOP UI ================= */
.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:none;
gap:20px;
z-index:9999;
color:#000;
}

/* ================= MAIN ================= */
#main{
display:none;
}

.page{
position:absolute;
width:100%;
height:100%;
transition:transform 0.6s ease;
}

/* 기본 */
.page:not(.page2){
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* 2페이지 */
.page2{
background:linear-gradient(180deg,#001a10,#000,#00ff66);
color:#00ff88;
}

/* PAGE1 */
.page1-title{
font-size:4rem;
font-weight:900;
}

.page1-sub{
font-size:1.5rem;
}

/* PAGE5 */
.page5-text{
font-size:2.3rem;
font-weight:800;
text-align:center;
}

/* DOT */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px;
border-radius:50%;
background:#000;
opacity:0.3;
cursor:pointer;
}

.dot.active{
opacity:1;
background:#b8f2e6;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">

<video id="introVideo" autoplay muted playsinline>
<source src="video.mp4">
</video>

<div id="introUI">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">SKIP</button>
</div>

<audio id="introAudio" loop></audio>
<audio id="mainAudio" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">

<div class="top-ui">
<div>포요</div>
<div>추억</div>
<div>게임</div>
</div>

<div class="dots">
<div class="dot active" data-i="0"></div>
<div class="dot" data-i="1"></div>
<div class="dot" data-i="2"></div>
<div class="dot" data-i="3"></div>
<div class="dot" data-i="4"></div>
</div>

<section class="page page1">
<div class="page1-title">POYO 9TH ANNIVERSARY</div>
<div class="page1-sub">포동이들과 함께 쌓아온 9년의 시간</div>
</section>

<section class="page page2">CHZZK STYLE</section>
<section class="page">PAGE3</section>
<section class="page">PAGE4</section>

<section class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</section>

</div>

<script>

let state="intro";
let page=0;
let target=0;
let shown=false;

const intro=document.getElementById("intro");
const main=document.getElementById("main");

const video=document.getElementById("introVideo");
const introAudio=document.getElementById("introAudio");
const mainAudio=document.getElementById("mainAudio");

const title=document.getElementById("title");
const enterBtn=document.getElementById("enterBtn");

/* ================= 103s TRIGGER ================= */
function loop(){
if(video.currentTime>=103 && !shown){
shown=true;

/* 페이드 인 */
title.style.opacity=1;
enterBtn.style.opacity=1;

/* 인트로 종료 준비 */
introAudio.pause();
}

requestAnimationFrame(loop);
}
loop();

/* ================= ENTER ================= */
function enter(){
state="main";

/* 인트로 종료 */
intro.style.display="none";
main.style.display="block";

/* 메인 즉시 시작 */
mainAudio.volume=0.5;
mainAudio.play().catch(()=>{});

/* 스크롤 즉시 활성 */
animate();
}

/* ================= PAGE ENGINE ================= */
function animate(){
if(state!=="main") return;

page += (target-page)*0.15;

document.querySelectorAll(".page").forEach((p,i)=>{
p.style.transform=`translateY(${(i-page)*100}vh)`;
});

document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",Math.round(page)===i);
});

requestAnimationFrame(animate);
}

/* ================= SCROLL ================= */
window.addEventListener("wheel",(e)=>{
if(state!=="main") return;

target += e.deltaY>0 ? 1 : -1;
target=Math.max(0,Math.min(4,target));
});

/* ================= DOT CLICK ================= */
document.querySelectorAll(".dot").forEach(dot=>{
dot.addEventListener("click",()=>{
target = Number(dot.dataset.i);
});
});

/* ================= EVENTS ================= */
enterBtn.onclick=enter;
skipBtn.onclick=enter;

window.addEventListener("click",()=>{
video.muted=false;
video.play().catch(()=>{});
introAudio.play().catch(()=>{});
},{once:true});

</script>

</body>
</html>
