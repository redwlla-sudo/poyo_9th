<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
    color:white;
    background: linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* =========================
   ⭐ 인트로 (절대 수정 금지 유지)
========================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.intro-box{
    text-align:center;
}

.intro-title{
    font-size:clamp(4rem,8vw,6rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    transform:translateY(20px);
    transition:0.4s ease;
}

#enterBtn{
    margin-top:25px;
    padding:18px 55px;
    font-size:1.5rem;
    font-weight:800;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    color:#000;
    opacity:0;
    transform:translateY(20px);
    transition:0.4s ease;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
}

/* =========================
   ⭐ NAV (한글로 변경)
========================= */
.nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:1000;
}

.nav-item{
    padding:10px 25px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.nav-item:hover{
    transform:scale(1.1);
}

/* =========================
   ⭐ 메인
========================= */
#main{
    display:none;
}

#bg-video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
    opacity:0.35;
}

.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

/* =========================
   ⭐ Page 1
========================= */
.title-main{
    font-size:clamp(3rem,6vw,5rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub-text{
    font-size:2rem;
    margin-top:20px;
}

/* =========================
   ⭐ Page 2
========================= */
.stats-grid{
    display:flex;
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.25);
    padding:25px;
    border-radius:20px;
}

/* =========================
   ⭐ Page 3
========================= */
.game-box{
    font-size:2rem;
    font-weight:800;
}

/* volume */
.volume{
    position:fixed;
    top:20px;
    right:20px;
}
</style>
</head>

<body>

<!-- 🎬 인트로 (그대로 유지) -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <div class="intro-box">

        <div id="title" class="intro-title">
            Poyo 9th Anniversary
        </div>

        <button id="enterBtn" onclick="enter()">
            입장하기
        </button>

    </div>
</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- =========================
   ⭐ NAV (한글)
========================= -->
<div class="nav">
    <div class="nav-item" onclick="goTo(0)">홈</div>
    <div class="nav-item" onclick="goTo(1)">통계</div>
    <div class="nav-item" onclick="goTo(2)">게임</div>
</div>

<!-- =========================
   ⭐ MAIN
========================= -->
<div id="main">

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4">
    </video>

    <div class="volume">
        <input type="range" min="0" max="1" step="0.01"
        oninput="document.getElementById('audio').volume=this.value">
    </div>

    <!-- PAGE 1 -->
    <section class="page">
        <div class="title-main">POYO 9TH ANNIVERSARY</div>
        <div class="sub-text">🎉 9년의 여정, 함께해줘서 고마워 🎉</div>
    </section>

    <!-- PAGE 2 -->
    <section class="page">
        <h2>📊 STATISTICS</h2>
        <div class="stats-grid">
            <div class="card">9 YEARS</div>
            <div class="card">3,285 DAYS</div>
            <div class="card">78,840 HOURS</div>
        </div>
    </section>

    <!-- PAGE 3 -->
    <section class="page">
        <div class="game-box">🎮 GAME COMING SOON</div>
    </section>

</div>

<!-- =========================
   ⭐ JS (인트로 유지)
========================= -->
<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const title = document.getElementById("title");
    const btn = document.getElementById("enterBtn");
    const audio = document.getElementById("audio");

    let shown = false;

    window.enter = function () {
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    video.addEventListener("timeupdate", () => {
        if (shown) return;
        if (video.currentTime >= 103) {
            shown = true;
            title.classList.add("show");
            btn.classList.add("show");
        }
    });

});

/* 🧭 네비 이동 */
function goTo(page){
    window.scrollTo({
        top: page * window.innerHeight,
        behavior:"smooth"
    });
}

</script>

</body>
</html>
