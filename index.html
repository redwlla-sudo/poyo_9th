<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포요 9주년 기념 페이지</title>
    <style>
        :root { --mint: #BFFCC6; --lavender: #E0BBE4; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; color: white; scroll-behavior: smooth; background-color: #000; overflow-x: hidden; }
        
        /* 인트로 화면 */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--lavender), var(--mint));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.8s ease;
        }
        .enter-btn {
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            background: white; color: #777; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .enter-btn:hover { transform: scale(1.1); color: var(--lavender); }

        /* 배경 설정 */
        #bg-video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(224, 187, 228, 0.5), rgba(191, 252, 198, 0.5)); z-index: -1; }
        
        nav { position: fixed; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .nav-menu { display: flex; gap: 30px; background: rgba(255, 255, 255, 0.2); padding: 12px 40px; border-radius: 40px; backdrop-filter: blur(10px); border: 1px solid var(--mint); }
        .nav-menu a { color: white; text-decoration: none; font-weight: 600; }
        
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 50px 20px; text-align: center; }
        .content-box { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); max-width: 800px; width: 90%; }
        
        h1 { font-size: clamp(2.5rem, 8vw, 5rem); text-shadow: 0 0 20px var(--lavender); margin: 0; }
        #music-btn { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: rgba(255, 255, 255, 0.2); border: 1px solid var(--mint); padding: 10px 15px; border-radius: 30px; cursor: pointer; color: white; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h2 style="color: white; margin-bottom: 20px;">Poyo 9th Anniversary</h2>
        <button class="enter-btn" onclick="startSite()">입장하기 (Music On 🎵)</button>
    </div>

    <audio id="myAudio" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>
    
    <video autoplay muted loop playsinline id="bg-video">
        <source src="2026-04 _ 월간 재첩 - Chrome 2026-04-27 01-50-13.mp4" type="video/mp4">
    </video>
    
    <div class="overlay"></div>
    <div id="music-btn" onclick="toggleMusic()">🎵 Music On</div>

    <nav>
        <div class="nav-menu">
            <a href="#home">홈</a>
            <a href="#stats">통계</a>
            <a href="#game">게임</a>
        </div>
    </nav>

    <section id="home">
        <h1>포요 9주년</h1>
        <p style="font-size: 1.5rem; font-weight: 300;">9년의 계절, 우리가 함께 써 내려간 이야기</p>
    </section>

    <section id="stats">
        <div class="content-box">
            <h2 style="color:var(--lavender)">9년의 발자취</h2>
            <p>함께한 3,285일, 고맙습니다.</p>
        </div>
    </section>

    <section id="game">
        <div class="content-box">
            <h2 style="color:var(--mint)">포동이 퀴즈</h2>
            <p>준비 중인 이벤트입니다!</p>
        </div>
    </section>

    <script>
        const audio = document.getElementById("myAudio");

        function startSite() {
            // 음악 재생 시도 (파일이 없어도 에러로 멈추지 않게 처리)
            if (audio) {
                audio.play().catch(e => console.log("음악 파일 로드 실패"));
            }
            
            // 인트로 화면 숨기기
            const intro = document.getElementById("intro-overlay");
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
            }, 800);
        }

        function toggleMusic() {
            const btn = document.getElementById("music-btn");
            if (audio.paused) {
                audio.play();
                btn.innerText = "🎵 Music On";
            } else {
                audio.pause();
                btn.innerText = "🔇 Music Off";
            }
        }
    </script>
</body>
</html>
