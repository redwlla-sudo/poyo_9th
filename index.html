<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:1000;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:4rem;
font-weight:900;
opacity:0;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#enterBtn{
margin-top:20px;
padding:14px 40px;
opacity:0;
transition:0.3s;
}

/* SKIP */
#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:9999;
}

/* ================= TOP UI ================= */
.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:none;
gap:20px;
z-index:9999;
padding:10px 20px;
border-radius:999px;
background:rgba(255,255,255,0.2);
color:#000;
}

/* ================= MAIN ================= */
#main{
display:none;
}

.page{
position:absolute;
width:100%;
height:100%;
transition:transform 0.8s ease;
}

/* background */
.page:not(.page2){
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.page2{
background:linear-gradient(180deg,#001a10,#000,#00ff66);
color:#00ff88;
}

/* PAGE1 */
.page1-title{
font-size:4rem;
font-weight:900;
}

.page1-sub{
font-size:1.5rem;
opacity:0.8;
}

/* PAGE5 */
.page5-text{
font-size:2.4rem;
text-align:center;
font-weight:800;
}

/* DOT NAV */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px;
border-radius:50%;
background:#000;
opacity:0.3;
cursor:pointer;
}

.dot.active{
opacity:1;
background:#b8f2e6;
}

/* VOLUME */
.volume{
position:fixed;
top:80px;
right:20px;
display:none;
z-index:9999;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">SKIP</button>
</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- TOP UI -->
<div class="top-ui">
<div>포요</div>
<div>추억</div>
<div>게임</div>
</div>

<!-- MAIN -->
<div id="main">

<div class="dots">
<div class="dot active" data-i="0"></div>
<div class="dot" data-i="1"></div>
<div class="dot" data-i="2"></div>
<div class="dot" data-i="3"></div>
<div class="dot" data-i="4"></div>
</div>

<section class="page page1">
<div class="page1-title">POYO 9TH ANNIVERSARY</div>
<div class="page1-sub">포동이들과 함께 쌓아온 9년의 시간</div>
</section>

<section class="page page2">CHZZK SIGNAL</section>
<section class="page">PAGE3</section>
<section class="page">PAGE4</section>

<section class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</section>

</div>

<script>

let state="intro";
let page=0;
let target=0;
let shown=false;

const intro=document.getElementById("intro");
const main=document.getElementById("main");

const video=document.getElementById("introVideo");
const introBgm=document.getElementById("introBgm");
const mainBgm=document.getElementById("mainBgm");

const title=document.getElementById("title");
const enterBtn=document.getElementById("enterBtn");

/* ================= 103s BUTTON ================= */
function loop(){
if(video.currentTime>=103 && !shown){
shown=true;
title.style.opacity=1;
enterBtn.style.opacity=1;
}
requestAnimationFrame(loop);
}
loop();

/* ================= ENTER ================= */
function enter(){
state="main";

intro.style.display="none";
main.style.display="block";

video.pause();
introBgm.pause();

mainBgm.volume=0.5;
mainBgm.play().catch(()=>{});
}

/* ================= SMOOTH SCROLL ================= */
function animate(){
if(state!=="main") return;

page += (target-page)*0.12;

document.querySelectorAll(".page").forEach((p,i)=>{
p.style.transform=`translateY(${(i-page)*100}vh)`;
});

/* DOT SYNC */
document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",Math.round(page)===i);
});

requestAnimationFrame(animate);
}
animate();

/* ================= WHEEL ================= */
window.addEventListener("wheel",(e)=>{
if(state!=="main") return;

if(e.deltaY>0) target++;
else target--;

target=Math.max(0,Math.min(4,target));
});

/* ================= DOT CLICK ================= */
document.querySelectorAll(".dot").forEach(dot=>{
dot.addEventListener("click",()=>{
target = Number(dot.dataset.i);
});
});

/* ================= EVENTS ================= */
enterBtn.onclick=enter;
skipBtn.onclick=enter;

window.addEventListener("click",()=>{
video.muted=false;
video.play().catch(()=>{});
introBgm.play().catch(()=>{});
},{once:true});

</script>

</body>
</html>
