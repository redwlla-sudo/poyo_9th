<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:9999;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
font-size:1.6rem;
font-weight:800;
border-radius:40px;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* 🔥 103초 최종 UI */
#introFinal{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
display:none;
z-index:10000;
color:white;
}

/* ================= SKIP ================= */
#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:99999;
padding:10px 18px;
border:none;
border-radius:20px;
cursor:pointer;
}

/* ================= MAIN ================= */
#main{
display:none;
position:fixed;
inset:0;
}

/* ================= UI ================= */
#uiLayer{
position:fixed;
inset:0;
z-index:999999;
pointer-events:none;
}

/* 상단 UI */
.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
padding:14px 22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:999px;
pointer-events:auto;
}

.top-btn{
font-weight:800;
cursor:pointer;
}

/* 볼륨 */
.volume{
position:fixed;
top:20px;
right:20px;
pointer-events:auto;
}

/* dots */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
pointer-events:auto;
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:0.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* ================= PAGES ================= */
#pages{
height:100vh;
}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .7s ease;
}

.page:nth-child(3),
.page:nth-child(4),
.page:nth-child(5){
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv{
background:linear-gradient(180deg,#002a18,#000);
color:#00ff88;
}

.main-title{
font-size:5rem;
font-weight:900;
}

.sub-title{
font-size:2rem;
}

/* 🔥 5페이지 문구 고정 */
.page5-text{
font-size:3.2rem;
font-weight:900;
text-align:center;
line-height:1.5;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">

<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<!-- 🔥 103초 확정 UI -->
<div id="introFinal">
<h1>포요 9주년 축하합니다 🎉</h1>
<button onclick="enter()">입장하기</button>
</div>

</div>

<!-- SKIP -->
<button id="skipBtn">스킵</button>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">

<div id="uiLayer">

<div class="top-ui">
<div class="top-btn">🐶 포요</div>
<div class="top-btn">추억</div>
<div class="top-btn">게임</div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>

</div>

<div id="pages">

<div class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<div class="page tv">CHZZK SIGNAL</div>

<div class="page"></div>
<div class="page"></div>

<!-- 🔥 5페이지 복구 -->
<div class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>

</div>
</div>

<script>

const introVideo=document.getElementById("introVideo");
const introBgm=document.getElementById("introBgm");
const mainBgm=document.getElementById("mainBgm");

let started=false;

window.addEventListener("click",()=>{
if(started) return;
started=true;
introVideo.play();
introBgm.play();
},{once:true});

/* 🔥 103초 안정 고정 */
introVideo.addEventListener("timeupdate",()=>{
if(introVideo.currentTime>=103){
document.getElementById("introFinal").style.display="block";
}
});

/* ENTER */
function enter(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";

introVideo.pause();
introBgm.pause();
mainBgm.play();
}

skipBtn.onclick=enter;

/* PAGE SYSTEM */
let index=0;
const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");

for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

function move(i){
index=i;
pages.forEach((p,idx)=>{
p.style.transform=`translateY(${(idx-index)*100}vh)`;
});

document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

</script>

</body>
</html>
