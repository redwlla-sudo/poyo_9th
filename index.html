<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
}

/* 🌈 전체 기본 */
body{
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* =========================
   🎬 인트로 (그룹 고정)
========================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* 🔒 그룹 묶음 (절대 초기화 방지) */
.intro-group{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* 인트로 타이틀 */
#introText{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* 입장 버튼 (고정) */
#enterBtn{
    padding:18px 55px;
    font-size:1.5rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    cursor:pointer;
}

/* =========================
   🧭 상단 UI
========================= */
.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:1000;
}

.top-nav div{
    padding:12px 30px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
    cursor:pointer;
}

/* =========================
   🔊 볼륨 (50% 기본)
========================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

/* =========================
   🟣 점 네비 (스크롤 따라 이동)
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
    transition:0.2s;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 페이지
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* =========================
   🏠 1페이지 메인 (크게 + 중앙)
========================= */
.main-title{
    font-size:5rem;
    font-weight:900;
    color:black;
}

/* 서브 문장 (카페24 유지) */
.sub-title{
    font-size:2.5rem;
    font-weight:800;
    margin-top:20px;
}

/* =========================
   🎮 마지막 페이지
========================= */
.final-text{
    font-size:3.5rem;
    font-weight:900;
    line-height:1.6;
}

/* =========================
   🎵 audio
========================= */
audio{display:none;}

/* =========================
   🟢 2페이지 치지직 느낌
========================= */
.tv-page{
    background:
    repeating-linear-gradient(
        0deg,
        #052b1e,
        #052b1e 2px,
        #0b3d2e 4px
    );
    color:#00ff9d;
}
</style>
</head>

<body>

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <!-- 🔒 그룹 (절대 초기화 금지) -->
    <div class="intro-group">

        <div id="introText">Poyo 9th Anniversary</div>

        <button id="enterBtn" onclick="enter()">입장하기</button>

    </div>

</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- 🧭 상단 UI -->
<div class="top-nav">
    <div onclick="goTo(0)">홈</div>
    <div onclick="goTo(1)">통계</div>
    <div onclick="goTo(2)">게임</div>
</div>

<!-- 🔊 볼륨 (50% 기본) -->
<div class="volume">
    <input type="range" min="0" max="1" step="0.01" value="0.5"
    oninput="document.getElementById('audio').volume=this.value">
</div>

<!-- 🟣 점 네비 -->
<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <!-- 1 -->
    <section class="page">
        <div class="main-title">POYO 9TH ANNIVERSARY</div>
        <div class="sub-title">포동이들과 함께 해온 9년의 여정</div>
    </section>

    <!-- 2 -->
    <section class="page tv-page">
        <h1>치지직 스타일 페이지</h1>
    </section>

    <!-- 3 -->
    <section class="page">
        <h2>페이지 3</h2>
    </section>

    <!-- 4 -->
    <section class="page">
        <h2>페이지 4</h2>
    </section>

    <!-- 5 -->
    <section class="page">
        <div class="final-text">
            자세한 내용과 게임은<br>
            상단의 통계 탭과 게임 탭을 클릭해주세요
        </div>
    </section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const audio = document.getElementById("audio");

    let shown = false;

    /* 🔒 103초 이전 절대 표시 금지 */
    function check(){
        if(!shown && video.currentTime >= 103){
            shown = true;
        }
        requestAnimationFrame(check);
    }
    check();

    window.enter = function(){
        audio.volume = 0.5;
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

});

/* 🧭 이동 */
function goTo(i){
    window.scrollTo({
        top: i * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

/* 🧭 스크롤 동기화 */
window.addEventListener("scroll", () => {
    let i = Math.round(window.scrollY / window.innerHeight);

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    if(document.querySelectorAll(".dot")[i]){
        document.querySelectorAll(".dot")[i].classList.add("active");
    }
});

</script>

</body>
</html>
