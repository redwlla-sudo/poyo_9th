<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* MAIN */
#main{position:fixed;inset:0;display:none;}

/* UI */
#uiLayer{
position:fixed;
inset:0;
z-index:2147483647;
pointer-events:none;
display:none;
}

.top-ui,.volume,.dots{pointer-events:auto;}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 24px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:999px;
}

.top-btn{
display:flex;
align-items:center;
gap:10px;
padding:10px 18px;
font-weight:900;
font-size:1.1rem;
cursor:pointer;
}

.top-btn img{width:24px;height:24px;}

.volume{position:fixed;top:20px;right:20px;}

.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* PAGES */
#pages{height:100vh;position:relative;}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .6s ease, opacity .6s ease;
opacity:0.3;
}

.page.active{opacity:1;}

.gradient{
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv-static{
background:linear-gradient(180deg,#00110a,#000);
color:#00ff88;
position:relative;
overflow:hidden;
}

/* 2페이지 */
.tv-static h1{
font-size:1.8rem;
opacity:0.5;
letter-spacing:2px;
margin-bottom:10px;
}

.tv-static .signal-text{
margin-top:10px;
margin-bottom:40px;
text-align:center;
line-height:1.4;
font-size:2.8rem;
font-weight:900;
z-index:1;
}

.tv-static .signal-text strong{
font-size:3.2rem;
}

/* binary */
.binary-bg{
position:absolute;
top:0;
left:0;
width:100%;
height:200%;
font-size:14px;
line-height:14px;
white-space:pre;
color:#00ff88;
opacity:0.07;
animation:binaryMove 20s linear infinite;
z-index:0;
pointer-events:none;
}

@keyframes binaryMove{
from{transform:translateY(0);}
to{transform:translateY(-50%);}
}

/* STEP */
.signal-box{
margin-top:10px;
text-align:center;
width:80%;
max-width:600px;
z-index:1;
}

.step{
margin:15px auto;
padding:20px;
border:1px solid rgba(0,255,136,0.4);
border-radius:12px;
cursor:pointer;
opacity:0.3;
transition:0.3s;
}

.step.active{opacity:1;}
.step.locked{
opacity:0.15;
pointer-events:none;
}

/* 🔥 STEP CARD 수정 */
.step-card{
background:linear-gradient(180deg,#00110a,#000);
padding:60px 80px;
border-radius:6px;
min-width:500px;
max-width:800px;
border:1px solid rgba(0,255,136,0.3);
}

.step-card-content{
font-size:2.4rem;
color:#00ff88;
font-family:'Fredoka',sans-serif;
}

/* 기존 유지 */
.step-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:1000;
}

.step-overlay.show{
opacity:1;
pointer-events:auto;
}

/* 5페이지 */
.page5-text{
text-align:center;
font-size:3.5rem !important;
font-weight:900 !important;
line-height:1.5 !important;
}

/* 보호 */
.page .main-title{
font-size:5rem !important;
font-weight:900 !important;
}

.page .sub-title{
font-size:2.2rem !important;
font-family:'Jalnan' !important;
}
</style>
</head>

<body>

<!-- (기존 HTML 전부 그대로 유지) -->

<!-- STEP POPUP -->
<div id="stepOverlay" class="step-overlay">
<div class="step-card">
<div id="stepContent" class="step-card-content"></div>
</div>
</div>

<script>
/* 기존 STEP 로직 그대로 유지 */
</script>

</body>
</html>
