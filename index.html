<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:9999;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

/* ================= SKIP ================= */
#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* ================= MAIN ================= */
#main{
position:fixed;
inset:0;
display:none;
}

/* ================= UI ================= */
#uiLayer{
position:fixed;
inset:0;
z-index:9999999;
pointer-events:none;
}

.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:999px;
pointer-events:auto;
}

.top-btn{
display:flex;
align-items:center;
gap:8px;
padding:10px 18px;
font-weight:800;
cursor:pointer;
}

.top-btn img{
width:22px;
height:22px;
}

/* 볼륨 */
.volume{
position:fixed;
top:20px;
right:20px;
pointer-events:auto;
}

/* dots */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
pointer-events:auto;
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* ================= PAGES ================= */
#pages{
height:100vh;
position:relative;
}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .6s ease;
}

/* 🔥 클래스 기반 배경 (수정 완료) */
.gradient{
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv-static{
background:linear-gradient(180deg,#00110a,#000);
color:#00ff88;
}

.main-title{font-size:5rem;font-weight:900;}
.sub-title{font-size:2.2rem;}

/* 🔥 5페이지 고정 레이어 */
#page5Fixed{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:3.5rem;
font-weight:900;
text-align:center;
line-height:1.5;
z-index:999999;
display:none;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">

<div id="uiLayer">

<div class="top-ui">
<div class="top-btn"><img src="poyo.png">포요</div>
<div class="top-btn">⭐ 추억</div>
<div class="top-btn">🎮 게임</div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>

</div>

<div id="pages">

<!-- 1 -->
<div class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<!-- 2 (치지직) -->
<div class="page tv-static">
<h1>CHZZK SIGNAL</h1>
</div>

<!-- 3 -->
<div class="page gradient"></div>

<!-- 4 -->
<div class="page gradient"></div>

<!-- 5 -->
<div class="page gradient"></div>

</div>
</div>

<!-- 🔥 5페이지 문구 따로 분리 -->
<div id="page5Fixed">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>

<script>
const introVideo=document.getElementById("introVideo");
const title=document.getElementById("title");
const btn=document.getElementById("enterBtn");
const mainBgm=document.getElementById("mainBgm");

/* 클릭 시 소리 */
window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.play().catch(()=>{});
},{once:true});

/* 103초 */
let shown=false;
function loop(){
if(introVideo.currentTime>=103 && !shown){
shown=true;
title.style.opacity=1;
title.style.visibility="visible";
btn.style.opacity=1;
btn.style.visibility="visible";
}
requestAnimationFrame(loop);
}
loop();

/* 진입 */
function enter(){
introVideo.pause();
introVideo.currentTime=0;
introVideo.muted=true;

document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";

mainBgm.currentTime=0;
mainBgm.play().catch(()=>{});
}

skipBtn.onclick=enter;
btn.onclick=enter;

/* 스크롤 */
let index=0;
const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");

for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

function move(i){
index=i;

pages.forEach((p,idx)=>{
p.style.transform=`translateY(${(idx-index)*100}vh)`;
});

document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});

/* 🔥 5페이지 문구 표시 */
if(index===4){
document.getElementById("page5Fixed").style.display="block";
}else{
document.getElementById("page5Fixed").style.display="none";
}
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});
</script>

</body>
</html>
