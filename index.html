<!-- 기존 코드 그대로 유지 -->

<!-- 🔥 추가: 슬라이드 페이지 -->
<div id="slideMemory" class="slide-page">
    <div class="circle">추억</div>
</div>

<div id="slideGame" class="slide-page">
    <div class="circle">도전</div>
</div>

<style>
/* 🔥 슬라이드 페이지 */
.slide-page{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1500;

    transform:translateX(100%);
    transition:0.5s;
}

.slide-page.active{
    transform:translateX(0);
}

/* 🔥 중앙 동그라미 */
.circle{
    width:220px;
    height:220px;
    border-radius:50%;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2rem;
    font-weight:700;
    cursor:pointer;
}
</style>

<script>
/* 🔥 기존 버튼 연결만 변경 */
function goMemory(){
    document.getElementById("slideMemory").classList.add("active");
}
function goGame(){
    document.getElementById("slideGame").classList.add("active");
}

/* 🔥 닫기 (원 클릭 시 돌아가기) */
document.querySelectorAll(".circle").forEach(c=>{
    c.addEventListener("click",()=>{
        document.querySelectorAll(".slide-page").forEach(p=>{
            p.classList.remove("active");
        });
    });
});
</script>
