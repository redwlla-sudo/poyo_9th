<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:9999;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

/* 🔥 FIX: intro text always safe */
#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= SKIP ================= */
#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:999999;
padding:10px 18px;
border-radius:20px;
}

/* ================= MAIN ================= */
#main{
position:fixed;
inset:0;
display:none;
}

/* ================= UI ================= */
#uiLayer{
position:fixed;
inset:0;
z-index:9999999;
pointer-events:none;
}

/* 🔥 TOP UI RESTORE */
.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:999px;
pointer-events:auto;
}

/* 🔥 FIX: POYO BUTTON RESTORED */
.top-btn{
padding:10px 18px;
font-weight:800;
cursor:pointer;
display:flex;
align-items:center;
gap:6px;
}

.top-btn img{
width:22px;
height:22px;
border-radius:50%;
}

/* volume */
.volume{
position:fixed;
top:20px;
right:20px;
pointer-events:auto;
}

/* dots */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
pointer-events:auto;
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* ================= PAGES ================= */
#pages{
height:100vh;
position:relative;
}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .7s cubic-bezier(0.22,1,0.36,1);
}

/* background */
.page:nth-child(3),
.page:nth-child(4),
.page:nth-child(5){
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* 2 page */
.tv-static{
background:linear-gradient(180deg,#002a18,#000);
color:#00ff88;
}

/* text */
.main-title{font-size:5rem;font-weight:900;}
.anniv{letter-spacing:8px;}
.sub-title{font-size:2.2rem;}

/* 🔥 FIX 5 PAGE TEXT */
.page5-text{
font-size:3.5rem;
font-weight:900;
text-align:center;
line-height:1.5;
z-index:999;
}

/* ================= OVERLAY ================= */
.overlay{
position:fixed;
inset:0;
display:none;
z-index:99999;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">

<div id="uiLayer">

<!-- 🔥 FIX: POYO BUTTON RESTORED -->
<div class="top-ui">
<div class="top-btn">
<img src="poyo.png"> 포요
</div>
<div class="top-btn">추억</div>
<div class="top-btn">게임</div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>

</div>

<div id="pages">

<div class="page">
<div class="main-title">POYO 9TH <span class="anniv">ANNIVERSARY</span></div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<div class="page tv-static"><h1>CHZZK SIGNAL</h1></div>

<div class="page"></div>
<div class="page"></div>

<!-- 🔥 FIX: 5 PAGE RESTORED -->
<div class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>

</div>
</div>

<!-- OVERLAY -->
<div id="memory" class="overlay"></div>
<div id="game" class="overlay"></div>

<script>

/* ================= AUDIO ================= */
const introVideo=document.getElementById("introVideo");
const introBgm=document.getElementById("introBgm");
const mainBgm=document.getElementById("mainBgm");

let started=false;

window.addEventListener("click",()=>{
if(started) return;
started=true;

introVideo.muted=false;
introVideo.play();
introBgm.play();
},{once:true});

/* ================= 103s FIX ================= */
function checkIntro(){
if(introVideo.currentTime>=103){
document.getElementById("title").style.visibility="visible";
document.getElementById("enterBtn").style.visibility="visible";
}
requestAnimationFrame(checkIntro);
}
checkIntro();

/* ================= ENTER ================= */
function enter(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";

introVideo.pause();
introBgm.pause();
mainBgm.play();
}

enterBtn.onclick=enter;
skipBtn.onclick=enter;

/* ================= SCROLL ================= */
let index=0;
let lock=false;

const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");

for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

function move(i){
index=i;
pages.forEach((p,idx)=>{
p.style.transform=`translateY(${(idx-index)*100}vh)`;
});
document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

window.addEventListener("wheel",(e)=>{
if(lock) return;
lock=true;

if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;

move(index);

setTimeout(()=>lock=false,700);
});

</script>

</body>
</html>
