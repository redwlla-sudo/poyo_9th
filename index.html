<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: 'YeogiOttaeJalnan';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html, body{
    margin:0;
    padding:0;
    font-family:'Fredoka', sans-serif;
    overflow:hidden;
}

#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;z-index:10000;
}

#title{
    font-size:5rem;font-weight:900;opacity:0;visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;padding:18px 60px;font-size:1.6rem;font-weight:800;
    border:none;border-radius:40px;opacity:0;visibility:hidden;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

#skipBtn{
    position:fixed;top:20px;right:20px;z-index:10000;
    padding:10px 18px;border-radius:20px;font-weight:700;
    background:rgba(255,255,255,0.4);
}

#app{position:fixed;inset:0;display:none;overflow:hidden;}

#sceneWrapper{
    display:flex;width:300vw;height:100vh;
    transition:transform 0.9s cubic-bezier(0.22,1,0.36,1);
}

.scene{width:100vw;height:100vh;flex-shrink:0;}

#pages{
    position:absolute;width:100%;height:100%;
    transition:transform 1.1s cubic-bezier(0.22,1,0.36,1);
}

.page{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;}

.tv-static{background:linear-gradient(180deg,#002a18,#000);color:#00ff88;}

.page:nth-of-type(3),
.page:nth-of-type(4),
.page:nth-of-type(5){
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.main-title{font-size:5rem;font-weight:900;}
.anniv{letter-spacing:8px;}
.sub-title{font-size:2.2rem;}

.page5-text{font-size:3.5rem;font-weight:900;text-align:center;line-height:1.5;}
.page:nth-of-type(5) .page5-text{font-family:'YeogiOttaeJalnan';}

.top-ui{
    position:fixed;top:15px;left:50%;transform:translateX(-50%);
    display:flex;gap:20px;padding:14px 22px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:999px;z-index:99999;
}

.top-btn{
    display:flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:999px;cursor:pointer;
    font-weight:800;background:rgba(255,255,255,0.25);
}

.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);}
.dot{width:10px;height:10px;margin:10px 0;border-radius:50%;background:black;opacity:0.3;}
.dot.active{opacity:1;transform:scale(1.4);background:#b8f2e6;}

.volume{position:fixed;top:20px;right:20px;z-index:10000;}
</style>
</head>
<body>

<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
    <div id="title">POYO 9TH ANNIVERSARY</div>
    <button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<div id="app">

<div class="top-ui">
    <div class="top-btn" onclick="goScene(0)">포요</div>
    <div class="top-btn" onclick="goScene(1)">추억</div>
    <div class="top-btn" onclick="goScene(2)">게임</div>
</div>

<div class="volume">
    🔊 <input type="range" min="0" max="1" step="0.01" oninput="mainBgm.volume=this.value">
</div>

<div id="sceneWrapper">

<div class="scene" id="mainScene">
<div class="dots"></div>

<div id="pages">
<section class="page">
<div class="main-title">POYO 9TH <span class="anniv">ANNIVERSARY</span></div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</section>

<section class="page tv-static"><h1>CHZZK SIGNAL</h1></section>
<section class="page"></section>
<section class="page"></section>
<section class="page">
<div class="page5-text">아직 끝이 아니에요 ✨<br>더 많은 추억과 즐거움이 기다리고 있어요<br>상단에서 계속 이어가 보세요</div>
</section>
</div>
</div>

<div class="scene" id="memoryScene">추억 페이지</div>
<div class="scene" id="gameScene">게임 페이지</div>

</div>
</div>

<script>
const introVideo=document.getElementById("introVideo");
const enterBtn=document.getElementById("enterBtn");
const title=document.getElementById("title");
const app=document.getElementById("app");
const sceneWrapper=document.getElementById("sceneWrapper");
const pages=document.getElementById("pages");
const dotsContainer=document.querySelector(".dots");
const mainBgm=document.getElementById("mainBgm");
const introBgm=document.getElementById("introBgm");

let started=false, shown=false;
let index=0;
let lock=false;
let initialized=false;

window.addEventListener("click",()=>{
if(started) return;
started=true;
introVideo.muted=false;
introVideo.play();
introBgm.play();
},{once:true});

introVideo.addEventListener("timeupdate",()=>{
if(!shown && introVideo.currentTime>=103){
shown=true;
title.style.visibility="visible";
enterBtn.style.visibility="visible";
}
});

function enter(){
document.getElementById("intro").style.display="none";
app.style.display="block";
introVideo.pause();
introBgm.pause();
mainBgm.play();
init();
resetMain();
}

enterBtn.onclick=enter;
skipBtn.onclick=enter;

/* 씬 이동 */
function goScene(i){
sceneWrapper.style.transform=`translateX(-${i*100}vw)`;
if(i===0) resetMain();
}

/* 메인 복구 핵심 */
function resetMain(){
index=0;
pages.style.transform="translateY(0vh)";
update();
}

/* dot init 1회 */
function init(){
if(initialized) return;
initialized=true;

for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dotsContainer.appendChild(d);
}
update();
}

function move(i){
index=i;
pages.style.transform=`translateY(-${i*100}vh)`;
update();
}

function update(){
document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

window.addEventListener("wheel",(e)=>{
if(lock || app.style.display!=="block") return;
lock=true;

if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;

move(index);
setTimeout(()=>lock=false,600);
});
</script>

</body>
</html>
