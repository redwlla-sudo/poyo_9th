<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

html,body{margin:0;padding:0;font-family:'Fredoka',sans-serif;overflow:hidden;}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;font-weight:900;
opacity:0;visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;padding:18px 60px;
border-radius:40px;font-size:1.6rem;font-weight:800;
opacity:0;visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;top:20px;right:20px;z-index:100000;
}

/* MAIN */
#main{position:fixed;inset:0;display:none;}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<script>
const introVideo = document.getElementById("introVideo");
const title = document.getElementById("title");
const btn = document.getElementById("enterBtn");
const skipBtn = document.getElementById("skipBtn");
const mainBgm = document.getElementById("mainBgm");

let shown = false;

/* 🔥 첫 클릭 시 음소거 해제 */
window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.play().catch(()=>{});
},{once:true});

/* 🔥 103초 후 텍스트 등장 */
function introLoop(){
if(introVideo.currentTime >= 103 && !shown){
shown = true;

title.style.opacity = 1;
title.style.visibility = "visible";

btn.style.opacity = 1;
btn.style.visibility = "visible";
}
requestAnimationFrame(introLoop);
}
introLoop();

/* 🔥 입장 / 스킵 */
function enter(){
introVideo.pause();
introVideo.currentTime = 0;
introVideo.muted = true;

document.getElementById("intro").style.display = "none";

/* BGM 시작 */
mainBgm.volume = introVideo.volume;
mainBgm.play().catch(()=>{});
}

skipBtn.onclick = enter;
btn.onclick = enter;
</script>

</body>
</html>
