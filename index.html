<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
body, html {
    margin:0;
    padding:0;
    font-family:sans-serif;
    overflow-x:hidden;
    color:white;

    /* 🎨 확실한 변경 (연보라+민트) */
    background: linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.75;
    z-index:-1;
}

/* 인트로 박스 */
.intro-box{
    text-align:center;
}

/* ⭐ 확실히 보이게 (중요) */
.intro-title{
    font-size:clamp(3rem,7vw,5rem);
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:1;
}

#enterBtn{
    margin-top:20px;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    cursor:pointer;

    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    color:#000;
}

/* ================= 메인 ================= */
#main{
    display:none;
}

#bg-video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
    opacity:0.35;
}

/* 페이지 */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

/* 빠른 등장 */
.fade{
    opacity:1;
}

/* 점 */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}
.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:white;
    margin:10px 0;
    opacity:0.3;
}
.dot.active{opacity:1}

/* 카드 */
.stats-grid{
    display:flex;
    gap:20px;
}
.card{
    background:rgba(255,255,255,0.25);
    padding:20px;
    border-radius:20px;
}

/* TV 느낌 */
.tv-bg{
    background:repeating-linear-gradient(
        45deg,
        #000,
        #000 10px,
        #0f3d2e 10px,
        #0f3d2e 20px
    );
}

/* 볼륨 */
.volume{
    position:fixed;
    top:20px;
    right:20px;
}
</style>
</head>

<body>

<!-- 🎵 음악 (무조건 재생 시도) -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- ================= 인트로 ================= -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <div class="intro-box">
        <div class="intro-title">Poyo 9th Anniversary</div>
        <button id="enterBtn" onclick="enter()">입장하기</button>
    </div>
</div>

<!-- ================= 메인 ================= -->
<div id="main">

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4">
    </video>

    <div class="volume">
        <input type="range" min="0" max="1" step="0.01" value="0.5"
        oninput="audio.volume=this.value">
    </div>

    <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <section class="page">
        <h1 style="font-size:4rem;
        background:linear-gradient(90deg,#cdb4ff,#7fffd4);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;">
        포요 9주년
        </h1>
        <p>9년의 계절, 포동이들과 함께 써 내려간 이야기</p>
    </section>

    <section class="page tv-bg">
        <h2 style="font-size:2rem">
            치지직 데뷔 3285일째<br>
            약 8만명의 포동이들이 함께했습니다
        </h2>

        <img src="img.png" width="200">
    </section>

    <section class="page">
        <h2>9년의 발자취</h2>
        <div class="stats-grid">
            <div class="card">9년</div>
            <div class="card">3,285일</div>
            <div class="card">78,840시간</div>
        </div>
    </section>

</div>

<script>

const audio = document.getElementById("audio");
const introVideo = document.getElementById("introVideo");

/* 🔥 음악 (무조건 시도) */
window.addEventListener("click", ()=>{
    audio.play().catch(()=>{});
}, {once:true});

/* 🔥 안전 fallback (영상 끝 안나와도 버튼 표시) */
setTimeout(()=>{
    document.getElementById("enterBtn").style.display="inline-block";
}, 4000);

/* 🔥 영상 끝났을 때 */
introVideo.addEventListener("ended", ()=>{
    document.getElementById("enterBtn").style.display="inline-block";
});

/* 🔥 입장 */
function enter(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
    audio.play();
}

</script>

</body>
</html>
