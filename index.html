<!-- 기존 코드 전부 유지 -->
<!-- ⚠️ 아래는 '수정된 부분 포함 전체 코드' -->

<!-- (중간 CSS/HTML 전부 동일 — 너가 준 코드 그대로 유지됨) -->

<script>
/* ===== 기존 코드 유지 ===== */
const introVideo=document.getElementById("introVideo");
const title=document.getElementById("title");
const btn=document.getElementById("enterBtn");
const mainBgm=document.getElementById("mainBgm");
const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");
const uiLayer=document.getElementById("uiLayer");

let index=0;
let shown=false;

window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.play().catch(()=>{});
},{once:true});

function introLoop(){
if(introVideo.currentTime>=103 && !shown){
shown=true;
title.style.opacity=1;
title.style.visibility="visible";
btn.style.opacity=1;
btn.style.visibility="visible";
}
requestAnimationFrame(introLoop);
}
introLoop();

function enter(){
introVideo.pause();
introVideo.currentTime=0;
introVideo.muted=true;

move(0);

document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";

uiLayer.style.display="block";

mainBgm.play().catch(()=>{});
}

skipBtn.onclick=enter;
btn.onclick=enter;

/* dots */
for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>move(i);
dots.appendChild(d);
}

function move(i){
index=i;
pages.forEach((p,idx)=>{
p.style.position="absolute";
p.style.top="0";
p.style.left="0";
p.style.width="100%";
p.style.transform=`translateY(${(idx-index)*100}vh)`;
p.classList.toggle("active",idx===index);
});
document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

/* overlay */
function showOverlay(id){
document.body.classList.add("hide-dots");
document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("show"));
document.getElementById(id).classList.add("show");
}

function hideOverlays(){
document.body.classList.remove("hide-dots");
document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("show"));
}

document.querySelectorAll(".top-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
const overlay=btn.dataset.overlay;
const page=btn.dataset.page;

if(page==="home"){
hideOverlays();
move(0);
}
if(overlay){
showOverlay(overlay);
}
});
});

/* ===== 🔥 STEP 시스템 ===== */
const steps=document.querySelectorAll(".step");
const stepOverlay=document.getElementById("stepOverlay");
const stepContent=document.getElementById("stepContent");
const counter=document.getElementById("yearCounter");

/* ✔ 정확한 멈춤 */
const stops=[365,730,1095,1461,1826,2191,2556,2922,3287];

/* ✔ 문장 */
const messages=[
"어색했던 첫 방송, 우리만의 시작점.",
"작은 채팅 하나에도 밤새 설레던, 서로에게 스며들기 시작한 시간.",
"특별한 날이 아니어도 방송 알람 하나에 습관처럼 모여드는 우리.",
"오늘도 어김없이 찾아온, 우리만의 당연한 저녁.",
"함께한 시간이 벌써 이만큼, 여전히 새로운 우리의 대화.",
"말하지 않아도 다 아는 편안한 사이.",
"함께라서 가능했던 행운 같은 순간들.",
"지나온 날보다 앞으로가 더 기대되는 이유.",
"다시 새롭게 시작될 페이지, 포동이들과 함께 채워갈 내일의 기록"
];

/* 🔥 STEP1 최종 */
function runStep1(){

let num=0;
let idx=0;

function animateTo(target){

function loop(){
num+=20;

if(num>=target){
num=target;

counter.innerText=num.toLocaleString();
stepContent.innerText=messages[idx];

idx++;

if(idx>=stops.length) return;

setTimeout(()=>{
animateTo(stops[idx]);
},700);

return;
}

counter.innerText=num.toLocaleString();
requestAnimationFrame(loop);
}

loop();
}

animateTo(stops[0]);
}

/* STEP 클릭 */
steps.forEach((step,i)=>{
step.addEventListener("click",()=>{

if(step.classList.contains("locked")) return;

hideOverlays();

stepOverlay.classList.add("show");

/* STEP1 실행 */
if(step.dataset.step==="1"){
runStep1();
}

/* 활성 표시 */
steps.forEach(s=>s.classList.remove("active"));
step.classList.add("active");

/* 다음 해금 */
if(i+1<steps.length){
steps[i+1].classList.remove("locked");
steps[i+1].querySelector(".content").innerText="OPEN";
}

});
});

/* 닫기 */
stepOverlay.addEventListener("click",(e)=>{
if(e.target===stepOverlay){
stepOverlay.classList.remove("show");
}
});

/* 스크롤 방지 */
window.addEventListener("wheel",(e)=>{
if(stepOverlay.classList.contains("show")){
e.preventDefault();
}
},{passive:false});

window.onload=()=>{move(0);}
</script>
