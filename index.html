<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
}

/* 🌈 기본 배경 (연보라+민트) */
body{
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* =========================
   🎬 인트로
========================= */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:white;
    font-weight:700;
    cursor:pointer;
}

.intro-box{
    text-align:center;
}

.intro-title{
    font-size:clamp(4rem,8vw,6rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    transform:translateY(20px);
    transition:0.4s ease;
}

/* ✨ 필기체 */
.sub-text{
    font-family:'Great Vibes', cursive;
    font-size:2.5rem;
    color:#1b1b1b;
    margin-top:20px;
}

#enterBtn{
    margin-top:25px;
    padding:18px 55px;
    font-size:1.5rem;
    font-weight:800;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    color:#000;
}

/* =========================
   🧭 DOT NAV (5개)
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
    cursor:pointer;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 PAGE 공통
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

/* =========================
   🟢 2페이지 (치지직 느낌)
========================= */
.tv-page{
    background:
    repeating-linear-gradient(
        0deg,
        #0b3d2e,
        #0b3d2e 2px,
        #062018 4px
    );
    color:#00ff9d;
}

/* =========================
   🌈 나머지 페이지
========================= */
.grad-page{
    background:linear-gradient(135deg,#d8c7ff,#b8f2e6);
}

/* =========================
   🏠 1페이지
========================= */
.title-main{
    font-size:clamp(3rem,6vw,5rem);
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* =========================
   🎮 5페이지
========================= */
.game-final{
    font-size:3rem;
    font-weight:900;
}

/* =========================
   🎵 audio 숨김
========================= */
audio{display:none;}
</style>
</head>

<body>

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div class="intro-box">

        <div id="title" class="intro-title">Poyo 9th Anniversary</div>
        <div class="sub-text">Thank you for 9 years</div>

        <button id="enterBtn" onclick="enter()">입장하기</button>

    </div>
</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- 🟣 DOT NAV (5개) -->
<div class="dots">
    <div class="dot active" onclick="goTo(0)"></div>
    <div class="dot" onclick="goTo(1)"></div>
    <div class="dot" onclick="goTo(2)"></div>
    <div class="dot" onclick="goTo(3)"></div>
    <div class="dot" onclick="goTo(4)"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <!-- 1 -->
    <section class="page grad-page">
        <div class="title-main">POYO 9TH ANNIVERSARY</div>
    </section>

    <!-- 2 (치지직 느낌) -->
    <section class="page tv-page">
        <h1 style="font-size:3rem;">POYO LIVE STREAM</h1>
        <p>9년 동안 함께한 순간들</p>
    </section>

    <!-- 3 -->
    <section class="page grad-page">
        <h2>THANK YOU</h2>
    </section>

    <!-- 4 -->
    <section class="page grad-page">
        <h2>MEMORIES</h2>
    </section>

    <!-- 5 (최종) -->
    <section class="page grad-page">
        <div class="game-final">
            게임을 하고 싶다면<br>
            통계와 게임 탭을 눌러주세요
        </div>
    </section>

</div>

<!-- ========================= SCRIPT ========================= -->
<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const audio = document.getElementById("audio");

    /* 🎬 안정화 핵심 */
    function unlockAudio(){
        video.volume = 1.0;
        video.muted = false;
    }

    window.addEventListener("click", unlockAudio, { once:true });

    window.enter = function(){
        audio.volume = 0.7;
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    window.skipIntro = function(){
        video.pause();
        enter();
    };

});

/* 🧭 이동 + 점 */
function goTo(i){
    window.scrollTo({
        top: i * window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

</script>

</body>
</html>
