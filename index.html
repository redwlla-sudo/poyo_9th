<!-- 변경된 부분만 포함된 전체 구조 -->

<style>
/* 🔥 UI 더 강하게 고정 */
#uiLayer{
position:fixed;
inset:0;
z-index:9999999; /* 🔥 더 높임 */
pointer-events:none;
}

.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 22px;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(12px);
border-radius:999px;
pointer-events:auto;
z-index:99999999; /* 🔥 절대 고정 */
}

/* 🔥 5페이지 절대 고정 */
.page5-text{
font-size:3.5rem;
font-weight:900;
text-align:center;
line-height:1.5;
position:relative;
z-index:99999;
}
</style>

<script>

/* ================= SCROLL (부드럽게 수정) ================= */
let current=0;
let target=0;

function animate(){

/* 🔥 속도 낮춤 (핵심) */
current += (target-current)*0.03;

pages.forEach((p,i)=>{
p.style.transform=`translateY(${(i-current)*100}vh)`;
});

/* 🔥 점 네비 동기화 */
document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",Math.round(current)===i);
});

requestAnimationFrame(animate);
}
animate();

/* 🔥 휠 감속 */
window.addEventListener("wheel",(e)=>{
if(e.deltaY>0) target=Math.min(4,target+1);
else target=Math.max(0,target-1);
},{passive:true});

</script>
