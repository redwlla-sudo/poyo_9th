<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
font-family:'Fredoka', sans-serif;
overflow-x:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:9999;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#introFinal{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
display:none;
z-index:10000;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:10000;
}

/* ================= MAIN ================= */
#main{
display:none;
}

/* ================= TOP UI (고정 복구) ================= */
.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
padding:14px 22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:999px;
z-index:99999;
pointer-events:auto;
}

.top-btn img{
width:24px;
height:24px;
border-radius:50%;
display:block;
}

/* ================= VOLUME ================= */
.volume{
position:fixed;
top:20px;
right:20px;
z-index:99999;
}

/* ================= DOT ================= */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:black;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* ================= PAGE ================= */
.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

/* ================= 5페이지 복구 ================= */
.page5-text{
font-size:3rem;
font-weight:900;
text-align:center;
line-height:1.5;
}

/* ================= INTRO FINAL ================= */
#introFinal h1{
color:white;
}

#introFinal button{
padding:12px 40px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">

<video id="introVideo" autoplay playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<h1 style="color:white;">POYO 9TH ANNIVERSARY</h1>
</div>

<!-- 🔥 복구된 최종 UI -->
<div id="introFinal">
<h1>포요 9주년 축하합니다 🎉</h1>
<button onclick="enter()">입장하기</button>
</div>

</div>

<!-- SKIP -->
<button id="skipBtn" onclick="enter()">스킵</button>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">

<!-- TOP UI (복구 고정) -->
<div class="top-ui">
<div class="top-btn">
<img src="poyo.png" onerror="this.style.display='none'">
포요
</div>
<div class="top-btn">추억</div>
<div class="top-btn">게임</div>
</div>

<!-- VOLUME -->
<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>

<!-- DOT -->
<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<!-- PAGES -->
<section class="page">
<h1>POYO 9TH ANNIVERSARY</h1>
<p>포동이들과 함께 쌓아온 9년의 시간</p>
</section>

<section class="page">2페이지</section>
<section class="page">3페이지</section>
<section class="page">4페이지</section>

<!-- 🔥 5페이지 복구 -->
<section class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</section>

</div>

<script>

const video=document.getElementById("introVideo");
const mainBgm=document.getElementById("mainBgm");

/* 🔥 103초 UI 복구 (안정형) */
function introCheck(){
if(video.currentTime >= 103){
document.getElementById("introFinal").style.display="block";
}
requestAnimationFrame(introCheck);
}
introCheck();

/* 종료 시 보장 */
video.addEventListener("ended",()=>{
document.getElementById("introFinal").style.display="block";
});

/* enter */
function enter(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
mainBgm.play().catch(()=>{});
}

/* wheel */
let index=0;
const pages=document.querySelectorAll(".page");

function move(i){
index=i;
pages.forEach((p,idx)=>{
p.style.transform=`translateY(${(idx-index)*100}vh)`;
});
}

window.addEventListener("wheel",(e)=>{
if(e.deltaY>0 && index<4) index++;
if(e.deltaY<0 && index>0) index--;
move(index);
});

</script>

</body>
</html>
