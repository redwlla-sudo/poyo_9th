<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;
inset:0;
z-index:9999;
}
#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:10001;
}

#title,#enterBtn{
opacity:0;
visibility:hidden;
transition:1s;
}

#title{
font-size:5rem;
font-weight:900;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= SKIP ================= */
#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:99999999;
}

/* ================= MAIN ================= */
#main{
position:fixed;
inset:0;
display:none;
}

/* ================= UI ================= */
#uiLayer{
position:fixed;
inset:0;
z-index:999999999;
pointer-events:none;
}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 22px;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(12px);
border-radius:999px;
pointer-events:auto;
}

.top-btn{
padding:8px;
cursor:pointer;
}

/* 🔥 아이콘 */
.icon{
width:32px;
height:32px;
object-fit:contain;
pointer-events:none;
}

.volume{
position:fixed;
top:20px;
right:20px;
pointer-events:auto;
}

.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
pointer-events:auto;
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
cursor:pointer;
}
.dot.active{
background:#b8f2e6;
opacity:1;
}

/* ================= PAGES ================= */
.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

/* 배경 */
.page:nth-child(3),
.page:nth-child(4),
.page:nth-child(5){
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* 2페이지 */
.tv-static{
background:
radial-gradient(circle at center, rgba(0,255,120,0.08), transparent 60%),
linear-gradient(180deg,#00110a,#000);
color:#00ff88;
text-shadow:0 0 6px rgba(0,255,120,0.4);
}

.main-title{font-size:5rem;font-weight:900;}
.sub-title{font-size:2.2rem;}

.page5-text{
font-size:3.5rem;
font-weight:900;
text-align:center;
line-height:1.5;
z-index:9999;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- MAIN -->
<div id="main">

<div id="uiLayer">
<div class="top-ui">
  <div class="top-btn"><img src="poyo.png" class="icon"></div>
  <div class="top-btn"><img src="poyo.png" class="icon"></div>
  <div class="top-btn"><img src="poyo.png" class="icon"></div>
</div>

<div class="volume">
🔊 <input type="range" min="0" max="1" step="0.01"
oninput="mainBgm.volume=this.value">
</div>

<div class="dots" id="dots"></div>
</div>

<div id="pages">

<div class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 쌓아온 9년의 시간</div>
</div>

<div class="page tv-static">
<h1>CHZZK SIGNAL</h1>
</div>

<div class="page"></div>
<div class="page"></div>

<div class="page">
<div class="page5-text">
아직 끝이 아니에요 ✨<br>
더 많은 추억과 즐거움이 기다리고 있어요<br>
상단에서 계속 이어가 보세요
</div>
</div>

</div>
</div>

<script>
const introVideo=document.getElementById("introVideo");
const mainBgm=document.getElementById("mainBgm");
const title=document.getElementById("title");
const enterBtn=document.getElementById("enterBtn");

window.addEventListener("click",()=>{
introVideo.muted=false;
introVideo.play().catch(()=>{});
},{once:true});

let shown=false;
function loop(){
if(introVideo.currentTime>=103 && !shown){
shown=true;
title.style.opacity=1;
title.style.visibility="visible";
enterBtn.style.opacity=1;
enterBtn.style.visibility="visible";
}
requestAnimationFrame(loop);
}
loop();

function enter(){
introVideo.pause();
introVideo.currentTime=0;
introVideo.muted=true;

intro.style.display="none";
main.style.display="block";

mainBgm.currentTime=0;
mainBgm.play().catch(()=>{});
}

skipBtn.onclick=enter;
enterBtn.onclick=enter;

/* SCROLL */
let current=0;
let target=0;
let lock=false;

const pages=document.querySelectorAll(".page");
const dots=document.getElementById("dots");

for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>target=i;
dots.appendChild(d);
}

function animate(){
current += (target-current)*0.035;

pages.forEach((p,i)=>{
p.style.transform=`translateY(${(i-current)*100}vh)`;
});

document.querySelectorAll(".dot").forEach((d,i)=>{
d.classList.toggle("active",Math.round(current)===i);
});

requestAnimationFrame(animate);
}
animate();

window.addEventListener("wheel",(e)=>{
if(lock) return;
lock=true;

if(e.deltaY>0) target=Math.min(4,target+1);
else target=Math.max(0,target-1);

setTimeout(()=>lock=false,450);
});
</script>

</body>
</html>
