<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face {
font-family: 'Jalnan';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
}

@font-face {
font-family: 'NeoDunggeunGothicPro';
src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/NeoDunggeunmoPro-Regular.woff2') format('woff2');
}

html,body{
margin:0;
padding:0;
font-family:'Fredoka',sans-serif;
overflow:hidden;
}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;}
#intro video{width:100%;height:100%;object-fit:cover;}

#introText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
font-weight:900;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
transition:1s;
}

#enterBtn{
margin-top:20px;
padding:18px 60px;
border-radius:40px;
font-size:1.6rem;
font-weight:800;
opacity:0;
visibility:hidden;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
transition:1s;
}

#skipBtn{
position:fixed;
top:20px;
right:20px;
z-index:100000;
}

/* MAIN */
#main{position:fixed;inset:0;display:none;}

/* UI */
#uiLayer{
position:fixed;
inset:0;
z-index:2147483647;
pointer-events:none;
display:none;
}

.top-ui,.volume,.dots{pointer-events:auto;}

.top-ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
padding:14px 24px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:999px;
}

.top-btn{
display:flex;
align-items:center;
gap:10px;
padding:10px 18px;
font-weight:900;
font-size:1.1rem;
cursor:pointer;
}

.top-btn img{width:24px;height:24px;}

.volume{position:fixed;top:20px;right:20px;}

.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}

.dot{
width:10px;
height:10px;
margin:10px 0;
border-radius:50%;
background:#000;
opacity:.3;
}

.dot.active{
background:#b8f2e6;
opacity:1;
}

/* PAGES */
#pages{height:100vh;position:relative;}

.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:transform .6s ease, opacity .6s ease;
opacity:0.3;
}

.page.active{opacity:1;}

.gradient{
background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

.tv-static{
background:linear-gradient(180deg,#00110a,#000);
color:#00ff88;
position:relative;
overflow:hidden;
}

.logo{
height:28px;
}

.signal-text{
font-size:2.8rem;
font-weight:900;
margin-bottom:40px;
text-align:center;
}

/* STEP */
.signal-box{
width:80%;
max-width:600px;
}

.step{
margin:15px;
padding:20px;
border:1px solid rgba(0,255,136,0.4);
cursor:pointer;
opacity:0.3;
}

.step.active{
opacity:1;
border:2px solid #00ff88;
}

.step.locked{
opacity:0.15;
pointer-events:none;
}

/* STEP POPUP */
#stepOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:.3s;
}

#stepOverlay.show{
opacity:1;
pointer-events:auto;
}

#stepCard{
background:#000;
border:1px solid #00ff88;
padding:50px;
width:700px;
text-align:center;
font-family:'NeoDunggeunGothicPro';
}

.origin-message{
white-space:pre-line; /* ⭐ 핵심 수정 */
text-align:center;
font-size:1.6rem;
line-height:2;
}

/* typing */
.typing-cursor{
display:inline-block;
width:8px;
height:1em;
background:#00ff88;
animation:blink .7s infinite;
}

@keyframes blink{
0%,50%,100%{opacity:1;}
25%,75%{opacity:0;}
}
</style>
</head>

<body>

<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<div id="introText">
<div id="title">POYO 9TH ANNIVERSARY</div>
<button id="enterBtn">입장하기</button>
</div>

<button id="skipBtn">스킵</button>
</div>

<audio id="mainBgm" loop src="bgm.mp3"></audio>

<div id="main">
<div id="pages">

<div class="page active">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
</div>

<div class="page tv-static">

<div class="signal-text">
9년이라는 시간은<br>
<strong>우리가 함께 만들어온 시간입니다</strong>
</div>

<div class="signal-box">
<div class="step active" data-step="1">STEP 1<div class="content">LOCKED</div></div>
<div class="step locked" data-step="2">STEP 2<div class="content">LOCKED</div></div>
<div class="step locked" data-step="3">STEP 3<div class="content">LOCKED</div></div>
</div>

</div>

</div>
</div>

<div id="stepOverlay">
<div id="stepCard">
<div id="stepContent"></div>
</div>
</div>

<script>
const steps=document.querySelectorAll(".step");
const stepOverlay=document.getElementById("stepOverlay");
const stepContent=document.getElementById("stepContent");

steps.forEach((step,i)=>{
step.addEventListener("click",()=>{
if(step.classList.contains("locked")) return;

stepOverlay.classList.add("show");

if(step.dataset.step==="2"){
runStep2();
}

steps.forEach(s=>s.classList.remove("active"));
step.classList.add("active");

if(i+1<steps.length){
steps[i+1].classList.remove("locked");
steps[i+1].querySelector(".content").innerText="OPEN";
}
});
});

function runStep2(){
stepContent.innerHTML=
'<div class="origin-message">'+
'잊고 있었던, 우리들의 첫 번째 페이지.\n'+
'서툴게 적었던 만 명이라는 꿈,\n'+
'그 작았던 숫자가 지금 우리를 여기까지 데려왔습니다.'+
'</div>';
}

stepOverlay.onclick=()=>stepOverlay.classList.remove("show");
</script>

</body>
</html>
