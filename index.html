<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    z-index:99999;
}

#introContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:5;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    opacity:0;
    cursor:pointer;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
}

/* ================= 메인 ================= */
#main{
    display:none;
}

.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* ================= 1페이지 ================= */
.main-title{
    font-size:5rem;
    font-weight:700;
    letter-spacing:8px;
}

.sub-title{
    font-size:2.2rem;
    font-weight:600;
}

/* ================= 2페이지 (지지직 TV) ================= */
.tv-static{
    position:relative;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,120,0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,120,0.1), transparent 45%),
        linear-gradient(135deg, #000000, #001a10);
    color:#00ff88;
    overflow:hidden;
}

/* 노이즈 효과 */
.tv-static::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
    );
    animation: noise 0.2s infinite;
    pointer-events:none;
    mix-blend-mode:overlay;
}

@keyframes noise{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-1px,1px); }
    50%{ transform:translate(1px,-1px); }
    75%{ transform:translate(1px,1px); }
    100%{ transform:translate(0,0); }
}

/* ================= 3~5 ================= */
.gradient{
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= 5페이지 문구 (강화) ================= */
.page5-text{
    font-family:'Fredoka', sans-serif;
    font-size:2.6rem;
    font-weight:800;
    text-align:center;
    line-height:1.4;
}

/* ================= UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 25px;
    border-radius:999px;
    display:flex;
    gap:15px;
    z-index:999;
}

.top-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    font-weight:700;
    cursor:pointer;
}

/* dots */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:black;
    margin:10px 0;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.5);
}

/* volume */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
    <div id="title">Poyo 9th Anniversary</div>
    <button id="enterBtn">입장하기</button>
</div>
</div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<!-- ================= 메인 ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn" onclick="goPage(0)">포요</div>
    <div class="top-btn" onclick="goPage(1)">추억</div>
    <div class="top-btn" onclick="goPage(2)">도전</div>
</div>

<div class="volume">
<input id="volumeCtrl" type="range" min="0" max="1" step="0.01">
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<!-- 1 -->
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년</div>
</section>

<!-- 2 -->
<section class="page tv-static">
<h1>CHZZK SIGNAL</h1>
</section>

<!-- 3 -->
<section class="page gradient"></section>

<!-- 4 -->
<section class="page gradient"></section>

<!-- 5 -->
<section class="page gradient">
<div class="page5-text">
더 많은 추억과 또는 게임이 하고 싶다면<br>
상단에 추억과 게임을 눌러주세요
</div>
</section>

</div>

<script>
const introVideo = document.getElementById("introVideo");
const bgm = document.getElementById("bgm");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");

let volume = 0.5;

/* 볼륨 */
document.getElementById("volumeCtrl").oninput = (e)=>{
    volume = e.target.value;
    bgm.volume = volume;
    introVideo.volume = volume;
};

/* 인트로 클릭 활성화 */
window.addEventListener("click",()=>{
    introVideo.muted = false;
    introVideo.volume = volume;
    introVideo.play().catch(()=>{});
},{once:true});

/* 103초 UI */
let shown = false;

function showUI(){
    if(shown) return;
    shown = true;
    title.style.opacity = 1;
    enterBtn.style.opacity = 1;
}

function check(){
    if(introVideo.currentTime >= 103){
        showUI();
    }
    requestAnimationFrame(check);
}
check();

/* ================= 오디오 충돌 해결 ================= */
function enter(){

    try{
        introVideo.pause();
        introVideo.currentTime = 0;
        introVideo.muted = true;
    }catch(e){}

    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";

    bgm.pause();
    bgm.currentTime = 0;
    bgm.volume = volume;
    bgm.play().catch(()=>{});
}

enterBtn.onclick = enter;
document.getElementById("skipBtn").onclick = enter;

/* 페이지 이동 */
const pages = document.querySelectorAll(".page");
let current = 0;

window.addEventListener("wheel",(e)=>{
    if(e.deltaY > 0) current++;
    else current--;

    if(current < 0) current = 0;
    if(current > 4) current = 4;

    pages[current].scrollIntoView({behavior:"smooth"});

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[current].classList.add("active");
});

function goPage(i){
    current = i;
    pages[i].scrollIntoView({behavior:"smooth"});

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}
</script>

</body>
</html>
