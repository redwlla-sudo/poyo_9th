<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poyo 9th Anniversary</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif;}
body{overflow:hidden;background:#0b0b0f;}

/* ===== INTRO ===== */
#intro{
position:fixed;inset:0;
background:linear-gradient(135deg,#cdb4ff,#a0ffe6);
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:9999;
}
#intro h1{font-size:3rem;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,0.3);}
#enterBtn,#skipBtn{
margin-top:20px;padding:12px 20px;border:none;border-radius:12px;cursor:pointer;
}
#enterBtn{display:none;background:#fff;}
#skipBtn{background:rgba(0,0,0,0.3);color:#fff;position:absolute;top:20px;right:20px;}

/* ===== MAIN ===== */
#main{
position:fixed;inset:0;
transition:transform 0.6s ease;
}
.page{
width:100vw;height:100vh;
display:flex;align-items:center;justify-content:center;
font-size:2rem;
}
.page:nth-child(1){background:#111;}
.page:nth-child(2){background:#222;}
.page:nth-child(3),
.page:nth-child(4),
.page:nth-child(5){
background:linear-gradient(135deg,#cdb4ff,#a0ffe6);
}

/* dots */
#dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:1000;}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;margin:10px;opacity:0.3;cursor:pointer;}
.dot.active{opacity:1;}

/* top UI */
#topUI{position:fixed;top:10px;left:10px;z-index:1000;display:flex;gap:10px;}
.uiBtn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;background:#fff;opacity:0.8;}

/* overlay */
.overlay{
position:fixed;inset:0;
transform:translateY(100%);
transition:transform 0.6s ease;
z-index:2000;
background:linear-gradient(135deg,#cdb4ff,#a0ffe6);
display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.overlay.active{transform:translateY(0);}
.backBtn{margin-top:20px;padding:10px 18px;border:none;border-radius:12px;background:#fff;cursor:pointer;}

</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
<button id="skipBtn">SKIP</button>
<h1>포요 9주년</h1>
<button id="enterBtn">입장하기</button>
</div>

<!-- MAIN -->
<div id="main">
<div class="page">1</div>
<div class="page">2 치지직 느낌</div>
<div class="page">3</div>
<div class="page">4</div>
<div class="page">5 아직 끝이 아니에요 ✨ 더 많은 추억...</div>
</div>

<!-- DOTS -->
<div id="dots"></div>

<!-- TOP UI -->
<div id="topUI">
<button class="uiBtn" onclick="openOverlay('memory')">추억</button>
<button class="uiBtn" onclick="openOverlay('game')">게임</button>
</div>

<!-- OVERLAYS -->
<div id="memory" class="overlay">
<h1>추억 페이지</h1>
<button class="backBtn" onclick="goHome()">포요</button>
</div>

<div id="game" class="overlay">
<h1>게임 페이지</h1>
<button class="backBtn" onclick="goHome()">포요</button>
</div>

<script>
let intro = document.getElementById('intro');
let enterBtn = document.getElementById('enterBtn');
let skipBtn = document.getElementById('skipBtn');

setTimeout(()=>{enterBtn.style.display='block';},103000);

enterBtn.onclick=()=>{
intro.style.display='none';
};
skipBtn.onclick=()=>{
intro.style.display='none';
};

// overlay logic
function openOverlay(id){
document.getElementById(id).classList.add('active');
}
function goHome(){
document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('active'));
}

// dots
let dots=document.getElementById('dots');
for(let i=0;i<5;i++){
let d=document.createElement('div');d.className='dot';dots.appendChild(d);
}
</script>

</body>
</html>
