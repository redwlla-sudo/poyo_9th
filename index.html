<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<style>
@import url('https://fonts.cafe24.com/css/cafe24ssurround.css');

html, body {
    margin:0;
    padding:0;
    font-family:'Cafe24 Ssurround', sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
}

/* 🚨 메인 깜빡임 완전 제거 */
#main{
    display:none !important;
}

/* =========================
   🎬 인트로
========================= */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#introVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

/* =========================
   🔒 인트로 UI 그룹 (고정)
========================= */
.intro-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* 103초 전 절대 숨김 */
#introText,
#enterBtn{
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:0.4s ease;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
    pointer-events:auto !important;
}

/* 타이틀 */
#introText{
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* 버튼 */
#enterBtn{
    font-size:1.6rem;
    font-weight:900;
    padding:18px 60px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
}

/* 스킵 */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border-radius:20px;
    border:none;
    background:white;
    font-weight:700;
}

/* =========================
   🧭 상단 UI
========================= */
.top-nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:1000;
}

.top-nav div{
    padding:12px 30px;
    border-radius:50px;
    background:linear-gradient(90deg,#cdb4ff,#7fffd4);
    font-weight:800;
}

/* =========================
   🔊 볼륨
========================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

/* =========================
   🟣 점 네비 (5개 고정)
========================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:999;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.3);
}

/* =========================
   📄 페이지
========================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* =========================
   🏠 메인 문구 (고정 + 그룹)
========================= */
.main-title{
    font-size:5rem;
    font-weight:900;
    color:black;
}

.sub-title{
    font-size:2.6rem;
    font-weight:900;
    color:black;
    margin-top:20px;
}

/* =========================
   🎵 audio
========================= */
audio{display:none;}
</style>
</head>

<body>

<!-- 🎬 인트로 -->
<div id="intro">

    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <button id="skipBtn" onclick="skipIntro()">스킵</button>

    <div class="intro-group">
        <div id="introText">Poyo 9th Anniversary</div>
        <button id="enterBtn" onclick="enter()">입장하기</button>
    </div>

</div>

<!-- 🎵 BGM -->
<audio id="audio" loop>
    <source src="bgm.mp3">
</audio>

<!-- 🧭 UI -->
<div class="top-nav">
    <div onclick="goTo(0)">홈</div>
    <div onclick="goTo(1)">통계</div>
    <div onclick="goTo(2)">게임</div>
</div>

<!-- 🔊 볼륨 -->
<div class="volume">
    <input type="range" min="0" max="1" step="0.01"
    oninput="document.getElementById('audio').volume=this.value">
</div>

<!-- 🟣 점 네비 -->
<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- ========================= MAIN ========================= -->
<div id="main">

    <section class="page">
        <div class="main-title">POYO 9TH ANNIVERSARY</div>
        <div class="sub-title">
            포동이들과 함께 걸어온 9년이라는 시간의 발자취
        </div>
    </section>

    <section class="page" style="background:#0b3d2e;color:#00ff9d;">
        <h1>치지직 스타일 페이지</h1>
    </section>

    <section class="page"><h1>PAGE 3</h1></section>
    <section class="page"><h1>PAGE 4</h1></section>

    <section class="page">
        <h1 style="font-size:2.8rem;">
            자세한 내용과 게임은<br>
            상단 통계 / 게임 탭을 눌러주세요
        </h1>
    </section>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

    const video = document.getElementById("introVideo");
    const audio = document.getElementById("audio");

    let shown = false;

    /* 🚨 메인 완전 차단 후 해제 */
    document.getElementById("main").style.display = "none";
    document.body.style.visibility = "visible";

    /* 🔊 볼륨 70 고정 */
    video.volume = 0.7;

    /* 🔥 103초 고정 */
    function loop(){
        if(!shown && video.currentTime >= 103){
            shown = true;
            document.getElementById("introText").classList.add("show");
            document.getElementById("enterBtn").classList.add("show");
        }
        requestAnimationFrame(loop);
    }
    loop();

    window.enter = function(){
        audio.volume = 0.5;
        audio.play().catch(()=>{});
        document.getElementById("intro").style.display="none";
        document.getElementById("main").style.display="block";
    };

    window.skipIntro = function(){
        video.pause();
        enter();
    };

});

/* 🧭 스크롤 */
function goTo(i){
    window.scrollTo({
        top:i*window.innerHeight,
        behavior:"smooth"
    });

    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".dot")[i].classList.add("active");
}

/* 🧭 동기화 */
window.addEventListener("scroll", () => {
    let i = Math.round(window.scrollY / window.innerHeight);
    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
    if(document.querySelectorAll(".dot")[i]){
        document.querySelectorAll(".dot")[i].classList.add("active");
    }
});

</script>

</body>
</html>
