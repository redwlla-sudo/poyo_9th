<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    z-index:10;
}

#introContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title{
    font-size:5rem;
    font-weight:900;
    opacity:0;
    background:linear-gradient(45deg, #cdb4ff, #b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#enterBtn{
    margin-top:20px;
    padding:20px 60px;
    font-size:1.6rem;
    font-weight:900;
    border:none;
    border-radius:50px;
    opacity:0;
    cursor:pointer;
    background:linear-gradient(45deg, #cdb4ff, #b8f2e6);
}

/* ================= 슬라이드 시스템 ================= */
#slider{
    position:absolute;
    top:0;
    left:0;
    width:500vw;
    height:100vh;
    display:flex;
    transition:0.8s ease;
}

/* 페이지 */
.page{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* 메인 페이지 (절대 수정 금지) */
.main-title{
    font-size:5rem;
    font-weight:700;
    letter-spacing:8px;
}
.sub-title{
    font-size:2.2rem;
    font-weight:600;
}

/* 2~5 페이지 기본 배경 */
.page:nth-child(n+2){
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* ================= 상단 UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 25px;
    border-radius:999px;
    display:flex;
    gap:15px;
    z-index:999;
}

.top-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    font-weight:700;
    cursor:pointer;
}

/* ================= 중앙 동그라미 UI ================= */
.center-circle{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:120px;
    height:120px;
    border-radius:50%;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    display:none;
    justify-content:center;
    align-items:center;
    font-weight:700;
    z-index:1000;
}

/* ================= 볼륨 ================= */
.volume{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999;
}
</style>
</head>

<body>

<!-- 인트로 -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
    <div id="title">Poyo 9th Anniversary</div>
    <button id="enterBtn">입장하기</button>
</div>
</div>

<audio id="bgm" loop>
<source src="bgm.mp3">
</audio>

<!-- 중앙 UI -->
<div class="center-circle" id="centerUI"></div>

<!-- 상단 UI -->
<div class="top-ui">
    <div class="top-btn" onclick="goPage(0)">포요</div>
    <div class="top-btn" onclick="goPage(1)">추억</div>
    <div class="top-btn" onclick="goPage(2)">도전</div>
</div>

<div class="volume">
<input type="range" min="0" max="1" step="0.01" oninput="bgm.volume=this.value">
</div>

<!-- 슬라이더 -->
<div id="slider">

<!-- 1 메인 (절대 수정 금지) -->
<section class="page">
<div class="main-title">POYO 9TH ANNIVERSARY</div>
<div class="sub-title">포동이들과 함께 걸어온 9년</div>
</section>

<!-- 2 추억 -->
<section class="page">
<h1>추억 페이지</h1>
</section>

<!-- 3 도전 -->
<section class="page">
<h1>도전 페이지</h1>
</section>

<!-- 4 (유지용 빈 페이지) -->
<section class="page"></section>

<!-- 5 -->
<section class="page">
<h1>기록 페이지</h1>
</section>

</div>

<script>
const slider = document.getElementById("slider");
const centerUI = document.getElementById("centerUI");
const bgm = document.getElementById("bgm");

/* 인트로 */
const video = document.getElementById("introVideo");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");

window.addEventListener("click",()=>{
    video.muted=false;
    video.volume=0.7;
    video.play().catch(()=>{});
},{once:true});

function enter(){
    document.getElementById("intro").style.display="none";
    bgm.play().catch(()=>{});
}
enterBtn.onclick=enter;
document.getElementById("skipBtn").onclick=()=>{ video.pause(); enter(); };

/* 슬라이드 전환 */
let currentPage=0;

function goPage(i){
    currentPage=i;
    slider.style.transform=`translateX(-${i*100}vw)`;

    /* 중앙 UI 제어 */
    if(i===1){
        centerUI.style.display="flex";
        centerUI.innerText="추억";
    }
    else if(i===2){
        centerUI.style.display="flex";
        centerUI.innerText="도전";
    }
    else{
        centerUI.style.display="none";
    }
}
</script>

</body>
</html>
