<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html, body {
    margin:0;
    padding:0;
    font-family:'Fredoka', sans-serif;
    overflow:hidden;
}

/* ================= INTRO ================= */
#intro {
    position:fixed;
    inset:0;
    z-index:1000;
    background:black;
}

#intro video {
    width:100%;
    height:100%;
    object-fit:cover;
}

#introText {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#title {
    font-size:4rem;
    font-weight:900;
    background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
}

#enterBtn {
    margin-top:20px;
    padding:15px 40px;
    font-size:1.3rem;
    border:none;
    border-radius:30px;
    opacity:0;
}

/* ================= GLOBAL UI (항상 고정) ================= */
.top-ui {
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:9999;
    background:rgba(255,255,255,0.15);
    padding:10px 20px;
    border-radius:999px;
    backdrop-filter:blur(10px);
}

.top-btn {
    cursor:pointer;
    font-weight:800;
    color:white;
}

/* ================= MAIN ================= */
#main {
    position:fixed;
    inset:0;
    display:none;
}

/* pages */
.page {
    position:absolute;
    width:100%;
    height:100%;
    transition:transform 0.8s ease;
}

/* page backgrounds */
.page:nth-child(1),
.page:nth-child(3),
.page:nth-child(4),
.page:nth-child(5){
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* 2번 페이지 */
.page2 {
    background:linear-gradient(180deg,#002a10,#000);
    color:#00ff88;
}

/* dots */
.dots {
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    z-index:9999;
}

.dot {
    width:10px;
    height:10px;
    margin:10px;
    border-radius:50%;
    background:black;
    opacity:0.3;
}

.dot.active {
    opacity:1;
    background:#b8f2e6;
}

/* skip */
#skipBtn {
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
}
</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">
    <video id="introVideo" autoplay muted playsinline>
        <source src="video2.mp4">
    </video>

    <div id="introText">
        <div id="title">POYO 9TH ANNIVERSARY</div>
        <button id="enterBtn">입장하기</button>
    </div>

    <button id="skipBtn">SKIP</button>
</div>

<audio id="introBgm" loop></audio>
<audio id="mainBgm" loop src="bgm.mp3"></audio>

<!-- ================= TOP UI (항상 유지) ================= -->
<div class="top-ui">
    <div class="top-btn" onclick="goPage(0)">포요</div>
    <div class="top-btn" onclick="openOverlay('memory')">추억</div>
    <div class="top-btn" onclick="openOverlay('game')">게임</div>
</div>

<!-- ================= MAIN ================= -->
<div id="main">

    <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <section class="page">PAGE1</section>
    <section class="page page2">PAGE2</section>
    <section class="page">PAGE3</section>
    <section class="page">PAGE4</section>
    <section class="page">PAGE5</section>

</div>

<script>

let APP_STATE = "intro";
let currentPage = 0;

const intro = document.getElementById("intro");
const main = document.getElementById("main");
const video = document.getElementById("introVideo");
const introBgm = document.getElementById("introBgm");
const mainBgm = document.getElementById("mainBgm");
const title = document.getElementById("title");
const enterBtn = document.getElementById("enterBtn");

/* ================= INTRO START ================= */
window.addEventListener("click", () => {
    if(APP_STATE !== "intro") return;

    video.muted = false;
    video.play().catch(()=>{});

    introBgm.volume = 0.5;
    introBgm.play().catch(()=>{});

    // 103초 후 UI 표시 (안정 방식)
    setTimeout(() => {
        title.style.opacity = 1;
        enterBtn.style.opacity = 1;
    }, 103000);

}, {once:true});

/* ================= ENTER MAIN ================= */
function enterMain() {

    APP_STATE = "main";

    // intro 완전 종료
    video.pause();
    video.src = "";
    introBgm.pause();
    introBgm.src = "";

    intro.style.display = "none";
    main.style.display = "block";

    mainBgm.volume = 0.5;
    mainBgm.play().catch(()=>{});

}

/* ================= PAGE ENGINE ================= */
function goPage(index){
    currentPage = index;

    document.querySelectorAll(".page").forEach((p,i)=>{
        p.style.transform = `translateY(${(i-index)*100}vh)`;
    });

    document.querySelectorAll(".dot").forEach((d,i)=>{
        d.classList.toggle("active", i===index);
    });
}

/* ================= WHEEL ================= */
window.addEventListener("wheel",(e)=>{
    if(APP_STATE !== "main") return;

    if(e.deltaY > 0) currentPage++;
    else currentPage--;

    currentPage = Math.max(0, Math.min(4, currentPage));
    goPage(currentPage);
});

/* ================= EVENTS ================= */
enterBtn.onclick = enterMain;
skipBtn.onclick = enterMain;

</script>

</body>
</html>
