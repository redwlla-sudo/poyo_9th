<script>
/* =========================
   STEP 독립 시스템
========================= */

const steps=document.querySelectorAll(".step");
const stepOverlay=document.getElementById("stepOverlay");
const counter=document.getElementById("yearCounter");
const stepContent=document.getElementById("stepContent");

/* 상태 */
let stepState={
unlocked:1
};

/* STEP 데이터 */
const stepData={
1:{
type:"count",
stops:[365,730,1095,1461,1826,2191,2556,2922,3287],
messages:[
"1주년 : 어색했던 첫 방송, 우리만의 시작점.",
"2주년 : 작은 채팅 하나에도 밤새 설레던 시간.",
"3주년 : 습관처럼 모여드는 우리.",
"4주년 : 당연한 저녁.",
"5주년 : 여전히 새로운 대화.",
"6주년 : 편안한 사이.",
"7주년 : 행운 같은 순간들.",
"8주년 : 더 기대되는 이유.",
"9주년 : 포동이들과 함께 채워갈 내일"
]
},
2:{
type:"text",
text:"[ The Origin : 첫 번째 로그 ] (3,287일 전, 포요님의 첫 시작)"
},
3:{
type:"text",
text:"[ 3단계: NEXT LOGGING ] 다시 새롭게 시작될 페이지, 포동이들과 함께 채워갈 내일의 기록"
}
};

/* 실행 제어 */
let running=false;

/* STEP 실행 */
function openStep(stepNum){

if(stepNum>stepState.unlocked) return;

stepOverlay.classList.add("show");

/* 초기화 */
counter.innerText="";
stepContent.innerText="";
running=false;

/* STEP1 (카운트) */
if(stepData[stepNum].type==="count"){
runCount(stepData[stepNum]);
}

/* STEP2,3 (텍스트만) */
if(stepData[stepNum].type==="text"){
counter.innerText="";
stepContent.innerText=stepData[stepNum].text;
}
}

/* 카운트 */
function runCount(data){
if(running) return;
running=true;

let num=0;
let idx=0;

function animateTo(target){
function loop(){
num+=20; // 기존 속도 유지

if(num>=target){
num=target;
counter.innerText=num.toLocaleString();
stepContent.innerText=data.messages[idx];

idx++;
if(idx>=data.stops.length){
running=false;
return;
}

setTimeout(()=>animateTo(data.stops[idx]),700);
return;
}

counter.innerText=num.toLocaleString();
requestAnimationFrame(loop);
}
loop();
}

animateTo(data.stops[0]);
}

/* STEP 클릭 */
steps.forEach((step,i)=>{
step.addEventListener("click",()=>{

let stepNum=parseInt(step.dataset.step);

openStep(stepNum);

/* 활성화 UI */
steps.forEach(s=>s.classList.remove("active"));
step.classList.add("active");

/* 다음 STEP 해금 */
if(stepState.unlocked===stepNum && stepNum<3){
stepState.unlocked++;

let next=steps[stepNum];

next.classList.remove("locked");

/* 텍스트 교체 (구조 유지) */
if(stepState.unlocked===2){
next.querySelector(".content").innerText=
"[ The Origin : 첫 번째 로그 ] (3,287일 전, 포요님의 첫 시작)";
}

if(stepState.unlocked===3){
next.querySelector(".content").innerText=
"[ 3단계: NEXT LOGGING ] 다시 새롭게 시작될 페이지, 포동이들과 함께 채워갈 내일의 기록";
}
}

});
});

/* overlay 닫기 */
stepOverlay.addEventListener("click",(e)=>{
if(e.target===stepOverlay){
stepOverlay.classList.remove("show");
running=false;
}
});
</script>
