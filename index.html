<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포요 9주년</title>
    <style>
        :root { --mint: #BFFCC6; --lavender: #E0BBE4; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; color: white; background-color: #000; overflow-x: hidden; scroll-behavior: smooth; }

        /* [인트로 화면] */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--lavender), var(--mint));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .enter-btn {
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            background: white; color: #777; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s;
        }
        .enter-btn:hover { transform: scale(1.1); color: var(--lavender); }

        /* [배경 영상: 세로형 쇼츠 최적화] */
        #bg-video { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: -2; 
            object-fit: cover; /* 세로 영상을 화면에 꽉 채우도록 함 */
        }

        /* [본 페이지 배경 오버레이: 검은색 제거] */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            /* 연보라와 민트를 더 진하게 섞어 검은 배경을 가림 */
            background: linear-gradient(135deg, rgba(224, 187, 228, 0.5), rgba(191, 252, 198, 0.5)); 
            z-index: -1; 
        }
        
        nav { position: fixed; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .nav-menu { 
            display: flex; gap: 25px; background: rgba(255, 255, 255, 0.3); 
            padding: 10px 30px; border-radius: 30px; backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .nav-menu a { color: white; text-decoration: none; font-weight: bold; }
        
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        /* 홈 타이틀 */
        .home-title h1 { font-size: clamp(3rem, 10vw, 5rem); text-shadow: 0 0 20px var(--lavender); margin: 0; }

        /* [통계 디자인 복구] */
        .stats-box {
            background: rgba(255, 255, 255, 0.15); padding: 40px; border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); 
            max-width: 800px; width: 90%;
        }
        .stats-grid { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .stat-card {
            background: rgba(224, 187, 228, 0.3); padding: 20px; border-radius: 20px; 
            border: 1px solid var(--lavender); flex: 1; min-width: 150px;
        }
        .stat-card h3 { font-size: 2.5rem; color: var(--mint); margin: 10px 0; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h2 style="color: white; margin-bottom: 20px; letter-spacing: 2px;">Poyo 9th Anniversary</h2>
        <button class="enter-btn" onclick="startProject()">입장하기</button>
    </div>

    <audio id="mainAudio" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <video autoplay muted loop playsinline id="bg-video"><source src="video.mp4" type="video/mp4"></video>
    <div class="overlay"></div>

    <nav>
        <div class="nav-menu">
            <a href="#home">홈</a>
            <a href="#stats">통계</a>
            <a href="#game">게임</a>
        </div>
    </nav>

    <section id="home">
        <div class="home-title">
            <h1>포요 9주년</h1>
            <p style="font-size: 1.5rem; font-weight: 300; margin-top: 15px;">9년의 계절, 우리가 함께 써 내려간 이야기</p>
        </div>
    </section>

    <section id="stats">
        <div class="stats-box">
            <h2 style="color: var(--mint); margin-bottom: 30px;">9년의 발자취</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <p>함께한 시간</p>
                    <h3>9년</h3>
                </div>
                <div class="stat-card">
                    <p>함께한 날들</p>
                    <h3>3,285일</h3>
                </div>
                <div class="stat-card">
                    <p>우리의 마음</p>
                    <h3>∞</h3>
                </div>
            </div>
        </div>
    </section>

    <script>
        function startProject() {
            var audio = document.getElementById("mainAudio");
            if (audio) { audio.play(); }
            
            var intro = document.getElementById("intro-overlay");
            if (intro) {
                intro.style.opacity = '0';
                setTimeout(function() { intro.style.display = "none"; }, 800);
            }
        }
    </script>
</body>
</html>
