<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html,body{
margin:0;
padding:0;
overflow-x:hidden;
font-family:'Fredoka',sans-serif;
}

/* 🔒 기존 유지 */
#main{display:none}

/* 인트로 */
#intro{
position:fixed;
inset:0;
z-index:9999;
}
#intro video{
width:100%;
height:100%;
object-fit:cover;
}

/* 스킵 */
#skipBtn{
position:absolute;
top:20px;
right:20px;
z-index:10;
}

/* 중앙 */
#introContent{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#title{
font-size:5rem;
opacity:0;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#enterBtn{
opacity:0;
}

/* 메인 */
.top-ui{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
background:white;
padding:10px 25px;
border-radius:999px;
display:flex;
gap:15px;
z-index:999;
}

.top-btn{
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#cdb4ff;
cursor:pointer;
}

/* 페이지 */
.page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

/* 점 네비 */
.dots{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
}
.dot{
width:10px;
height:10px;
border-radius:50%;
background:black;
margin:10px 0;
opacity:0.3;
}
.dot.active{
opacity:1;
transform:scale(1.5);
}

/* 🔥 슬라이드 (완전 독립) */
.slide-page{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:flex;
justify-content:center;
align-items:center;
z-index:2000;

transform:translateX(100%);
transition:0.5s ease;
}

.slide-page.active{
transform:translateX(0);
}

/* 동그라미 */
.circle{
width:220px;
height:220px;
border-radius:50%;
background:linear-gradient(45deg,#cdb4ff,#b8f2e6);
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<!-- 인트로 -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline preload="auto">
<source src="video2.mp4">
</video>

<button id="skipBtn">스킵</button>

<div id="introContent">
<div id="title">Poyo 9th Anniversary</div>
<button id="enterBtn">입장하기</button>
</div>
</div>

<!-- 메인 -->
<div id="main">

<div class="top-ui">
<div class="top-btn" onclick="scrollToTop()">포요</div>
<div class="top-btn" onclick="goMemory()">추억</div>
<div class="top-btn" onclick="goGame()">도전</div>
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<section class="page">
<h1>POYO 9TH ANNIVERSARY</h1>
</section>

<section class="page" style="background:#0b3d2e;color:#00ff9d;">
<h1>치지직 스타일</h1>
</section>

<section class="page"><h1>PAGE 3</h1></section>
<section class="page"><h1>PAGE 4</h1></section>
<section class="page"><h1>PAGE 5</h1></section>

</div>

<!-- 🔥 슬라이드 (여기만 추가됨) -->
<div id="slideMemory" class="slide-page">
<div class="circle">추억</div>
</div>

<div id="slideGame" class="slide-page">
<div class="circle">도전</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const video=document.getElementById("introVideo");
const title=document.getElementById("title");
const enterBtn=document.getElementById("enterBtn");

let shown=false;

/* 인트로 소리 */
window.addEventListener("click",()=>{
video.muted=false;
video.volume=0.7;
},{once:true});

/* 103초 */
function loop(){
if(!shown && video.currentTime>=103){
shown=true;
title.style.opacity=1;
enterBtn.style.opacity=1;
}
requestAnimationFrame(loop);
}
loop();

/* 입장 */
function enter(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
}
enterBtn.onclick=enter;

/* 스킵 */
document.getElementById("skipBtn").onclick=()=>{
video.pause();
enter();
};

/* 점 네비 */
window.addEventListener("scroll",()=>{
let i=Math.round(window.scrollY/window.innerHeight);
document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
if(document.querySelectorAll(".dot")[i]){
document.querySelectorAll(".dot")[i].classList.add("active");
}
});

/* 🔥 슬라이드 (완전 분리) */
window.goMemory=()=>{
document.getElementById("slideMemory").classList.add("active");
}

window.goGame=()=>{
document.getElementById("slideGame").classList.add("active");
}

document.querySelectorAll(".circle").forEach(c=>{
c.addEventListener("click",()=>{
document.querySelectorAll(".slide-page").forEach(p=>{
p.classList.remove("active");
});
});
});

});

/* 홈 */
function scrollToTop(){
window.scrollTo({top:0,behavior:"smooth"});
}
</script>

</body>
</html>
