<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포요 9주년</title>
    <style>
        :root { 
            --mint: #BFFCC6; 
            --lavender: #E0BBE4; 
            /* 공통 배경 그라데이션 정의 */
            --main-bg: linear-gradient(135deg, #E0BBE4, #BFFCC6);
        }
        
        /* [핵심] 배경색을 body에 고정하여 검은색을 원천 차단 */
        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Pretendard', sans-serif; 
            color: white; 
            background: var(--main-bg) fixed !important; /* 항상 이 배경색 유지 */
            overflow-x: hidden; 
            scroll-behavior: smooth; 
        }

        /* 인트로 화면: 배경을 투명하게 해서 body의 배경색이 보이게 함 */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--main-bg); /* 인트로도 같은 배경색 */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; transition: opacity 0.8s ease;
        }
        .enter-btn {
            padding: 15px 45px; font-size: 1.2rem; font-weight: bold;
            background: white; color: #888; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .enter-btn:hover { transform: scale(1.05); background: #f9f9f9; }

        /* 배경 영상: 배경색 위에 겹쳐지도록 설정 */
        #bg-video { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: -1; object-fit: cover;
            opacity: 0.7; /* 영상이 배경색과 섞여서 더 몽환적으로 보이게 함 */
        }

        nav { position: fixed; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .nav-menu { 
            display: flex; gap: 20px; background: rgba(255, 255, 255, 0.3); 
            padding: 10px 25px; border-radius: 30px; backdrop-filter: blur(10px); 
        }
        .nav-menu a { color: #555; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; z-index: 1; }
        
        .home-title h1 { font-size: clamp(3rem, 10vw, 5rem); color: white; text-shadow: 2px 2px 15px rgba(0,0,0,0.1); }

        /* 통계 카드 디자인 */
        .stats-box {
            background: rgba(255, 255, 255, 0.2); padding: 40px; border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); 
            max-width: 800px; width: 90%;
        }
        .stats-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.2); padding: 25px; border-radius: 20px; 
            min-width: 150px; flex: 1; border: 1px solid white;
        }
        .stat-card h3 { font-size: 2.5rem; color: white; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h2 style="color: white; margin-bottom: 25px; letter-spacing: 2px;">Poyo 9th Anniversary</h2>
        <button class="enter-btn" onclick="startProject()">입장하기</button>
    </div>

    <audio id="mainAudio" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <nav>
        <div class="nav-menu">
            <a href="#home">홈</a><a href="#stats">통계</a><a href="#game">게임</a>
        </div>
    </nav>

    <section id="home">
        <div class="home-title">
            <h1>포요 9주년</h1>
            <p style="font-size: 1.4rem; margin-top: 15px; color: rgba(255,255,255,0.95);">9년의 계절, 우리가 함께 써 내려간 이야기</p>
        </div>
    </section>

    <section id="stats">
        <div class="stats-box">
            <h2 style="margin-bottom: 20px; color: white;">9년의 발자취</h2>
            <div class="stats-grid">
                <div class="stat-card"><p>함께한 시간</p><h3>9년</h3></div>
                <div class="stat-card"><p>함께한 날들</p><h3>3,285일</h3></div>
                <div class="stat-card"><p>우리의 마음</p><h3>∞</h3></div>
            </div>
        </div>
    </section>

    <script>
        function startProject() {
            // 음악 재생
            var audio = document.getElementById("mainAudio");
            if (audio) { audio.play().catch(e => console.log("음악 대기 중")); }
            
            // 영상 재생 강제 시도
            var video = document.getElementById("bg-video");
            if (video) { video.play(); }

            // 인트로 페이드아웃 후 제거
            var intro = document.getElementById("intro-overlay");
            if (intro) {
                intro.style.opacity = '0';
                setTimeout(function() { intro.style.display = "none"; }, 800);
            }
        }
    </script>
</body>
</html>
