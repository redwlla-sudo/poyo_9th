<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포요 9주년</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Fredoka', sans-serif;
}

/* ================= 인트로 ================= */
#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro video{
    width:100%;
    height:100%;
    object-fit:cover;
}

#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    z-index:99999;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:white;
}

/* ================= 메인 ================= */
#main{
    display:none;
}

/* ================= 페이지 ================= */
.page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:0.6s ease;
}

/* 1 */
.main-title{
    font-size:5rem;
    font-weight:700;
}

.sub-title{
    font-size:2.2rem;
}

/* 2 */
.tv-static{
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,120,0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,120,0.1), transparent 45%),
        linear-gradient(135deg,#000,#001a10);
    color:#00ff88;
}

/* 3~4 */
.gradient{
    background:linear-gradient(135deg,#d9cfff,#b8f2e6);
}

/* 5 */
.page5-text{
    font-size:4rem;
    font-weight:900;
    text-align:center;
}

/* ================= UI ================= */
.top-ui{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:999;
}

.top-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cdb4ff;
    cursor:pointer;
}

/* ================= 점 네비 ================= */
.dots{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:black;
    margin:10px 0;
    opacity:0.3;
}

.dot.active{
    opacity:1;
    transform:scale(1.5);
}

/* ================= OVERLAY (슬라이드 핵심) ================= */
.overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transform:translateX(100%);
    transition:0.7s ease;
    z-index:9998;
}

.overlay.active{
    transform:translateX(0);
}

#memoryOverlay{
    background:linear-gradient(135deg,#1a1a1a,#003322);
    color:#00ff88;
}

#challengeOverlay{
    background:linear-gradient(135deg,#2a0033,#b8f2e6);
    color:white;
}

.closeBtn{
    position:absolute;
    top:20px;
    left:20px;
    background:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- ================= 인트로 ================= -->
<div id="intro">
<video id="introVideo" autoplay muted playsinline>
<source src="video2.mp4">
</video>
<button id="skipBtn">스킵</button>
</div>

<audio id="introBgm" loop>
<source src="intro.mp3">
</audio>

<audio id="mainBgm" loop>
<source src="bgm.mp3">
</audio>

<!-- ================= MAIN ================= -->
<div id="main">

<div class="top-ui">
    <div class="top-btn" onclick="goHome()">포요</div>
    <div class="top-btn" onclick="openMemory()">추억</div>
    <div class="top-btn" onclick="openChallenge()">도전</div>
</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<section class="page"><div class="main-title">POYO 9TH ANNIVERSARY</div><div class="sub-title">포동이들과 함께 걸어온 9년이란 발자취</div></section>
<section class="page tv-static"><h1>CHZZK SIGNAL</h1></section>
<section class="page gradient"></section>
<section class="page gradient"></section>

<section class="page gradient">
<div class="page5-text">
더 많은 추억과 또는 게임이 하고 싶다면<br>
상단에 추억과 게임을 눌러주세요
</div>
</section>

</div>

<!-- ================= OVERLAY ================= -->
<div id="memoryOverlay" class="overlay">
<button class="closeBtn" onclick="goHome()">포요</button>
<h1>추억 페이지</h1>
</div>

<div id="challengeOverlay" class="overlay">
<button class="closeBtn" onclick="goHome()">포요</button>
<h1>도전 페이지</h1>
</div>

<script>

let state = "main"; // main | memory | challenge
let pageIndex = 0;

const pages = document.querySelectorAll(".page");
const dots = document.querySelectorAll(".dot");

const memory = document.getElementById("memoryOverlay");
const challenge = document.getElementById("challengeOverlay");

/* ================= 페이지 업데이트 ================= */
function updateMain(){
    pages.forEach((p,i)=>{
        p.style.transform = `translateY(${(i - pageIndex) * 100}vh)`;
    });

    dots.forEach(d=>d.classList.remove("active"));
    if(dots[pageIndex]) dots[pageIndex].classList.add("active");
}

/* ================= 휠 (메인에서만) ================= */
window.addEventListener("wheel",(e)=>{
    if(state !== "main") return;

    if(e.deltaY > 0) pageIndex++;
    else pageIndex--;

    if(pageIndex < 0) pageIndex = 0;
    if(pageIndex > 4) pageIndex = 4;

    updateMain();
});

/* ================= DOT 클릭 동기화 ================= */
dots.forEach((dot,i)=>{
    dot.addEventListener("click",()=>{
        if(state !== "main") return;
        pageIndex = i;
        updateMain();
    });
});

/* ================= OVERLAY ================= */
function openMemory(){
    state = "memory";
    memory.classList.add("active");
    challenge.classList.remove("active");
}

function openChallenge(){
    state = "challenge";
    challenge.classList.add("active");
    memory.classList.remove("active");
}

/* ================= HOME ================= */
function goHome(){
    state = "main";
    memory.classList.remove("active");
    challenge.classList.remove("active");
}

/* ================= INIT ================= */
updateMain();

</script>

</body>
</html>
